<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sociologija — Simulator mature</title>
<script src="/sim/vendor/react.production.min.js"></script>
<script src="/sim/vendor/react-dom.production.min.js"></script>
<script src="/sim/vendor/canvas-confetti.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f3ed;--s1:#fefcf8;--s2:#f0ebe2;--s3:#e8e1d5;
  --bdr:rgba(139,110,70,.13);--bdr2:rgba(139,110,70,.22);
  --text:#2c2418;--muted:#8a7d6a;
  --gold:#a8720a;--gold-d:rgba(168,114,10,.1);--gold-b:rgba(168,114,10,.22);
  --green:#1e7a3e;--green-d:rgba(30,122,62,.1);
  --red:#c43030;--red-d:rgba(196,48,48,.1);
  --blue:#2045b8;--blue-d:rgba(32,69,184,.1);
  --teal:#0c8a7a;--teal-d:rgba(12,138,122,.1);
  --shadow-sm:0 1px 3px rgba(100,70,30,.08),0 1px 2px rgba(100,70,30,.06);
  --shadow:0 4px 12px rgba(100,70,30,.1),0 2px 4px rgba(100,70,30,.06);
  --shadow-lg:0 8px 24px rgba(100,70,30,.12),0 4px 8px rgba(100,70,30,.06);
  --lock-scrim:rgba(254,252,248,.82);
  --r:10px;--rr:14px;--fb:'DM Sans',sans-serif;--fh:'DM Serif Display',serif
}
html,body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100%}
.dark-mode{
  --bg:#0a0a0a;--s1:#111213;--s2:#18191b;--s3:#222426;
  --bdr:rgba(255,255,255,.07);--bdr2:rgba(255,255,255,.14);
  --text:#f0efe8;--muted:#7a7a7a;
  --gold:#e9b446;--gold-d:rgba(233,180,70,.1);--gold-b:rgba(233,180,70,.2);
  --green:#3ecf6e;--green-d:rgba(62,207,110,.1);
  --red:#f87171;--red-d:rgba(248,113,113,.1);
  --blue:#4b7bff;--blue-d:rgba(75,123,255,.1);
  --teal:#2dcfbe;--teal-d:rgba(45,207,190,.1);
  --lock-scrim:rgba(10,10,10,.82);
  --shadow-sm:none;--shadow:none;--shadow-lg:none
}
#root{min-height:100vh}
.nav{position:sticky;top:0;z-index:100;background:var(--s1);box-shadow:var(--shadow-sm);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;padding:0 20px;height:56px}
.ntitle{font-family:var(--fh);font-size:17px}.nbadge{background:var(--gold-d);border:1px solid var(--gold-b);color:var(--gold);font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.nsp{flex:1}.timer{font-size:14px;font-weight:600;background:var(--s2);border:1px solid var(--bdr);padding:6px 14px;border-radius:8px;letter-spacing:.05em}
.timer.warn{color:var(--gold);border-color:var(--gold-b)}.timer.danger{color:var(--red);border-color:rgba(248,113,113,.3)}
.home{max-width:860px;margin:0 auto;padding:48px 20px 80px}
.hero{text-align:center;margin-bottom:48px}
.hero-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--gold),#e8c060);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 22px;box-shadow:var(--shadow-lg),0 0 0 6px rgba(168,114,10,.08)}
.hero h1{font-family:var(--fh);font-size:clamp(28px,5vw,40px);font-weight:400;margin-bottom:12px;line-height:1.2}
.hero em{color:var(--gold);font-style:italic}.hero p{color:var(--muted);font-size:15px;line-height:1.75;max-width:480px;margin:0 auto}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:36px}
.mc{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rr);padding:24px;cursor:pointer;transition:all .2s;position:relative;box-shadow:var(--shadow-sm)}
.mc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.mc.gold:hover{border-color:rgba(233,180,70,.4)}.mc.green:hover{border-color:rgba(62,207,110,.4)}
.mc.dim{opacity:.55;cursor:default;pointer-events:none}
.mc-ico{font-size:26px;margin-bottom:12px;display:block}.mc h3{font-size:15px;font-weight:600;margin-bottom:6px}
.mc.gold h3{color:var(--gold)}.mc.green h3{color:var(--green)}.mc.blue h3{color:var(--blue)}.mc.teal h3{color:var(--teal)}.mc.red h3{color:var(--red)}.mc.purple h3{color:#b97cf3}
.mc.red:hover{border-color:rgba(255,80,80,.4)}.mc.purple:hover{border-color:rgba(185,124,243,.4)}
.dark-mode .mc,.dark-mode .qcard,.dark-mode .exlist,.dark-mode .filter-preview,.dark-mode .share-card-wrap{box-shadow:none!important}
@media print{
  body *{visibility:hidden}
  .pdf-report,  .pdf-report *{visibility:visible}
  .pdf-report{position:fixed;top:0;left:0;width:100%;padding:24px 32px;background:#fff;color:#000}
  .pdf-report .no-print{display:none!important}
  .nav,.modes,#exams,.disclaimer-modal-overlay{display:none!important}
  .print-results{display:block!important}
}
.mc p{color:var(--muted);font-size:13px;line-height:1.6}
.mtag{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--s3);border:1px solid var(--bdr);color:var(--muted);padding:3px 8px;border-radius:99px}
.exlist{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rr);overflow:hidden;box-shadow:var(--shadow-sm)}
.exhdr{padding:14px 20px;border-bottom:1px solid var(--bdr);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.exrow{padding:16px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--bdr)}
.exrow:last-child{border-bottom:none}.exrow:hover{background:var(--s2)}
.exyear{font-family:var(--fh);font-size:22px;color:var(--gold);min-width:52px}
.exinfo strong{font-size:14px;font-weight:600;display:block;margin-bottom:3px}.exinfo span{font-size:12px;color:var(--muted)}
.exam-layout{display:grid;grid-template-columns:1fr 210px;gap:20px;max-width:1080px;margin:0 auto;padding:24px 20px 80px;align-items:start}
@media(max-width:768px){
  .exam-layout{grid-template-columns:1fr;padding:12px 12px 80px}
  .sidebar{display:none!important}
  .home{padding:28px 14px 60px}
  .modes{grid-template-columns:1fr 1fr;gap:10px}
  .mc{padding:16px}
  .mc-ico{font-size:20px;margin-bottom:8px}
  .mc h3{font-size:14px}
  .hero h1{font-size:clamp(22px,5vw,32px)}
  .hero-icon{width:56px;height:56px;font-size:26px}
  .results{padding:16px 14px 60px}
  .reshero{padding:20px 12px 16px}
  .breakdown-grid{grid-template-columns:1fr 1fr}
  .revitem{padding:10px 12px}
  .qcard{padding:18px 14px}
  .qnav{flex-wrap:wrap;gap:6px}
  .qnav .btn{flex:1;min-width:80px;font-size:13px;padding:8px 10px}
  .filter-screen{padding:20px 14px 60px}
  .filter-chips{gap:6px}
  .filter-chip{font-size:12px;padding:5px 10px}
  .nav{padding:0 12px;height:50px}
  .ntitle{font-size:15px}
  .nbadge{display:none}
  .section-progress{display:none}
  .analytics-tab-bar{gap:4px;overflow-x:auto;padding-bottom:4px}
  .analytics-tab{font-size:11px;padding:6px 8px;white-space:nowrap}
  .year-group-header{padding:10px 12px}
  .daily-stats{gap:8px}
  .daily-stat{min-width:0;padding:8px 6px}
  .daily-stat-val{font-size:22px}
}
@media(max-width:400px){
  .modes{grid-template-columns:1fr}
  .breakdown-grid{grid-template-columns:1fr}
  .share-card-wrap{padding:20px 14px}
}
.qcard{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rr);padding:28px;animation:fi .2s ease;box-shadow:var(--shadow-sm)}
.qmeta{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.qnum{font-size:13px;color:var(--muted)}
.qbadge{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.b-mc{background:var(--blue-d);color:var(--blue);border:1px solid rgba(75,123,255,.25)}
.b-ms{background:var(--teal-d);color:var(--teal);border:1px solid rgba(45,207,190,.25)}
.b-mat{background:var(--gold-d);color:var(--gold);border:1px solid var(--gold-b)}
.b-fb{background:rgba(168,85,247,.1);color:#c084fc;border:1px solid rgba(168,85,247,.25)}
.b-sa{background:var(--green-d);color:var(--green);border:1px solid rgba(62,207,110,.25)}
.b-es{background:var(--red-d);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.qflag{margin-left:auto;background:none;border:1px solid var(--bdr);color:var(--muted);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12px;font-family:var(--fb);transition:all .15s}
.qflag.on{background:var(--gold-d);border-color:var(--gold-b);color:var(--gold)}
.qtext{font-size:15px;line-height:1.72;margin-bottom:22px}
.ms-hint{font-size:12px;color:var(--gold);background:var(--gold-d);border:1px solid var(--gold-b);padding:6px 12px;border-radius:8px;margin-bottom:14px;display:inline-block}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);cursor:pointer;transition:all .15s}
.opt:hover{border-color:var(--bdr2);background:var(--s3)}
.opt.sel{background:var(--blue-d);border-color:rgba(75,123,255,.4)}
.opt.selms{background:var(--teal-d);border-color:rgba(45,207,190,.4)}
.opt.ok{background:var(--green-d)!important;border-color:rgba(62,207,110,.45)!important}
.opt.bad{background:var(--red-d)!important;border-color:rgba(248,113,113,.45)!important}
.optl{width:28px;height:28px;min-width:28px;border-radius:50%;border:1px solid var(--bdr2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);transition:all .15s;flex-shrink:0}
.opt.sel .optl{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt.selms .optl{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.ok .optl{background:var(--green);color:#fff;border-color:var(--green)}
.opt.bad .optl{background:var(--red);color:#fff;border-color:var(--red)}
.optt{font-size:14px;line-height:1.5;padding-top:3px}
.matching{display:flex;flex-direction:column;gap:11px}
.mrow{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:center}
.mleft{background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 13px;font-size:13px;line-height:1.4}
.marr{color:var(--muted);text-align:center}
.msel{background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 13px;font-size:13px;color:var(--text);font-family:var(--fb);cursor:pointer;width:100%;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
.msel:focus{border-color:var(--gold)}.msel.ok{border-color:var(--green);background:var(--green-d)}.msel.bad{border-color:var(--red);background:var(--red-d)}
.finp{background:var(--s2);border:1px solid var(--bdr2);border-radius:var(--r);padding:12px 15px;font-size:15px;color:var(--text);font-family:var(--fb);width:100%;outline:none;transition:border-color .15s}
.finp:focus{border-color:var(--gold)}.finp.ok{border-color:var(--green);background:var(--green-d)}.finp.bad{border-color:var(--red);background:var(--red-d)}
.ta{background:var(--s2);border:1px solid var(--bdr2);border-radius:var(--r);padding:13px 15px;font-size:14px;color:var(--text);font-family:var(--fb);width:100%;outline:none;resize:vertical;line-height:1.65;transition:border-color .15s}
.ta:focus{border-color:var(--gold)}
.fb{margin-top:16px;padding:13px 15px;border-radius:var(--r);border-left:3px solid}
.fb.ok{background:var(--green-d);border-color:var(--green)}.fb.bad{background:var(--red-d);border-color:var(--red)}.fb.info{background:var(--gold-d);border-color:var(--gold)}
.fbtitle{font-size:13px;font-weight:700;margin-bottom:5px}
.fb.ok .fbtitle{color:var(--green)}.fb.bad .fbtitle{color:var(--red)}.fb.info .fbtitle{color:var(--gold)}
.fbtext{font-size:13px;color:var(--muted);line-height:1.6}
.fbans{font-size:13px;font-style:italic;margin-top:6px;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:6px;line-height:1.6;color:var(--text)}
.qnav{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--fb);font-size:14px;font-weight:600;padding:10px 20px;border-radius:var(--r);cursor:pointer;transition:all .15s;border:none}
.btn-g{background:var(--s2);border:1px solid var(--bdr2);color:var(--muted)}.btn-g:hover{color:var(--text)}.btn-g:disabled{opacity:.3;cursor:not-allowed}
.btn-gold{background:var(--gold);color:#160d00}.btn-gold:hover{background:#f5d170}
.btn-red{background:var(--red-d,rgba(196,48,48,.12));border:1px solid rgba(196,48,48,.3);color:var(--red)}.btn-red:hover{background:rgba(196,48,48,.2)}
.btn-chk{background:var(--s3);border:1px solid var(--bdr2);color:var(--text)}.btn-chk:hover{border-color:var(--gold);color:var(--gold)}
.btn-sub{background:linear-gradient(135deg,#3ecf6e,#2dbb60);color:#fff}.btn-sub:hover{opacity:.9}
.sidebar{position:sticky;top:76px}
.sbcard{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rr);padding:16px}
.sbtitle{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.qdot{width:30px;height:30px;border-radius:6px;border:1px solid var(--bdr);background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.qdot:hover{border-color:var(--bdr2);color:var(--text)}
.qdot.ans{background:var(--blue-d);border-color:rgba(75,123,255,.3);color:var(--blue)}
.qdot.flag{background:var(--gold-d);border-color:var(--gold-b);color:var(--gold)}
.qdot.cur{border-color:var(--text);color:var(--text);background:var(--s3)}
.qdot.cok{background:var(--green-d);border-color:rgba(62,207,110,.3);color:var(--green)}
.qdot.cbad{background:var(--red-d);border-color:rgba(248,113,113,.3);color:var(--red)}
.qdot.cman{background:var(--gold-d);border-color:var(--gold-b);color:var(--gold)}
.prog{height:2px;background:var(--s3);border-radius:99px;margin-bottom:16px;overflow:hidden}
.progbar{height:100%;background:linear-gradient(90deg,var(--gold),#f5d170);border-radius:99px;transition:width .4s ease}
.results{max-width:740px;margin:0 auto;padding:40px 20px 80px}
.reshero{text-align:center;margin-bottom:36px}
.gcirc{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 18px;border-width:3px;border-style:solid}
.gnum{font-family:var(--fh);font-size:46px;line-height:1}
.glbl{font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.reshero h2{font-family:var(--fh);font-size:26px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;text-align:center}
.statn{font-family:var(--fh);font-size:28px;margin-bottom:4px}.statl{font-size:12px;color:var(--muted)}
.revlist{display:flex;flex-direction:column;gap:9px}
.revitem{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);padding:15px}
.revitem.rok{border-left:3px solid var(--green)}.revitem.rbad{border-left:3px solid var(--red)}.revitem.rman{border-left:3px solid var(--gold)}
.mlov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.mlbox{background:var(--s1);border:1px solid var(--bdr2);border-radius:var(--rr);padding:30px;max-width:420px;width:100%}
.mlbox h3{font-family:var(--fh);font-size:22px;margin-bottom:12px}
.mlbox p{color:var(--muted);font-size:14px;line-height:1.65;margin-bottom:20px}
.mlwarn{background:var(--gold-d);border:1px solid var(--gold-b);border-radius:var(--r);padding:10px 13px;font-size:13px;color:var(--gold);margin-bottom:16px}
.mlbtns{display:flex;gap:10px;justify-content:flex-end}
.ibox{margin-top:28px;padding:18px;background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rr);font-size:13px;color:var(--muted);line-height:1.65}
.ibox strong{color:var(--text);display:block;margin-bottom:6px}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── CONTEXT PANEL ──────────────────────────────────────────────────────── */
.ctx-panel{margin-bottom:22px;border-radius:var(--r);border:1px solid rgba(233,180,70,.2);overflow:hidden}
.ctx-toggle{width:100%;background:rgba(233,180,70,.07);border:none;color:var(--gold);font-family:var(--fb);font-size:12px;font-weight:600;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;letter-spacing:.04em;text-align:left}
.ctx-toggle:hover{background:rgba(233,180,70,.12)}
.ctx-toggle .ctx-arrow{margin-left:auto;transition:transform .2s;font-size:10px}
.ctx-toggle.open .ctx-arrow{transform:rotate(180deg)}
.ctx-body{background:var(--s2);display:none;padding:0}
.ctx-body.open{display:block;padding:14px 16px 0}
.ctx-scroll-inner{max-height:340px;overflow-y:auto;padding-bottom:14px;scrollbar-width:thin;scrollbar-color:var(--bdr2) transparent}
/* ── Globalni scrollbar ───────────────────────── */
*{scrollbar-width:thin;scrollbar-color:var(--bdr2) transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:99px;transition:background .2s}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
::-webkit-scrollbar-corner{background:transparent}
.ctx-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ctx-tab{background:var(--s3);border:1px solid var(--bdr);color:var(--muted);font-family:var(--fb);font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .15s}
.ctx-tab.active{background:var(--gold-d);border-color:var(--gold-b);color:var(--gold)}
.ctx-article{font-size:13px;line-height:1.75;color:var(--muted)}
.ctx-article-section{margin-bottom:14px}
.ctx-article-heading{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.ctx-table-wrap{overflow-x:auto}
.ctx-table{width:100%;border-collapse:collapse;font-size:12px}
.ctx-table th{background:var(--s3);color:var(--text);font-weight:600;padding:7px 10px;text-align:left;border-bottom:1px solid var(--bdr2);white-space:nowrap}
.ctx-table td{padding:6px 10px;border-bottom:1px solid var(--bdr);color:var(--muted);vertical-align:top}
.ctx-table tr:last-child td{border-bottom:none;font-weight:600;color:var(--text)}
.ctx-table tr:hover td{background:rgba(255,255,255,.02)}
.ctx-source{font-size:11px;color:var(--muted2);margin-top:8px;font-style:italic}
.ctx-badge{display:inline-block;background:rgba(233,180,70,.12);border:1px solid rgba(233,180,70,.2);color:var(--gold);font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.05em;margin-right:4px;margin-bottom:4px}

/* ── POKAŽI ODGOVOR ─────────────────────────────────────────────────────── */
.hint-btn{background:none;border:1px solid var(--bdr2);color:var(--muted);font-family:var(--fb);font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.hint-btn:hover{border-color:rgba(168,85,247,.4);color:#c084fc}
.hint-btn.active{background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.3);color:#c084fc}
.hint-box{margin-top:14px;padding:12px 15px;border-radius:var(--r);background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.2);animation:fi .2s ease}
.hint-box-title{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#c084fc;margin-bottom:8px}
.hint-box-content{font-size:13px;color:var(--text);line-height:1.6}
.hint-box-content .hint-correct{color:#c084fc;font-weight:600}

/* ── NOVI STATUSI ────────────────────────────────────────────────────────── */
.qdot.skip{background:rgba(251,146,60,.08);border-color:rgba(251,146,60,.3);color:#fb923c}
/* Legenda */
.sb-legend{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.sb-legend-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.sb-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* ── SEKCIJE ISPITA ──────────────────────────────────────────────────────── */
.section-progress{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.section-chip{background:var(--s2);border:1px solid var(--bdr);border-radius:99px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px;transition:all .2s}
.section-chip.active{border-color:var(--gold-b);color:var(--gold);background:var(--gold-d)}
.section-chip .sc-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── ANIMIRANI SCORE SCREEN ─────────────────────────────────────────────── */
.score-anim{animation:scoreIn .5s cubic-bezier(.175,.885,.32,1.275)}
@keyframes scoreIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.score-ring{position:relative;width:140px;height:140px;margin:0 auto 24px}
.score-ring svg{transform:rotate(-90deg)}
.score-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring-num{font-family:var(--fh);font-size:36px;line-height:1}
.score-ring-pct{font-size:11px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.breakdown-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:24px}
.bd-card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px}
.bd-card-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.bd-bar-wrap{height:6px;background:var(--s3);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bd-bar{height:100%;border-radius:99px;transition:width 1s ease}
.bd-score{font-size:13px;font-weight:600}

/* ── SECTION HEADER IN EXAM ─────────────────────────────────────────────── */
.section-divider{padding:8px 14px;background:var(--s3);border-radius:var(--r);margin-bottom:14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.section-divider span{color:var(--gold)}

/* ── XP & STREAK ─────────────────────────────────────────────────────────── */
.xp-bar-wrap{height:8px;background:var(--s3);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.xp-bar{height:100%;background:linear-gradient(90deg,var(--gold),#f5d170);border-radius:99px;transition:width 1.5s cubic-bezier(.4,0,.2,1)}
.xp-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.streak-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(233,180,70,.15),rgba(245,209,112,.08));border:1px solid var(--gold-b);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--gold)}
.streak-fire{font-size:18px}
.xp-gain-anim{position:fixed;pointer-events:none;z-index:999;font-family:var(--fh);font-size:22px;font-weight:700;color:var(--gold);animation:xpFloat 1.6s ease forwards}
@keyframes xpFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.3)}}
.level-badge{display:inline-flex;align-items:center;gap:5px;background:var(--gold-d);border:1px solid var(--gold-b);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--gold)}

/* ── SHARE CARD ──────────────────────────────────────────────────────────── */
.share-card-wrap{background:linear-gradient(135deg,#0d0a02,#1a1305);border:1px solid var(--gold-b);border-radius:20px;padding:32px;text-align:center;position:relative;overflow:hidden;margin-bottom:24px}
.share-card-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 50%,rgba(233,180,70,.12),transparent 60%),radial-gradient(circle at 70% 80%,rgba(233,180,70,.06),transparent 50%)}
.share-card-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(233,180,70,.06) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.share-card-inner{position:relative;z-index:1}
.share-card-logo{font-family:var(--fh);font-size:13px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:16px}
.share-grade-big{font-family:var(--fh);font-size:80px;line-height:1;margin-bottom:4px}
.share-pct{font-size:16px;color:var(--muted);margin-bottom:16px}
.share-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.share-tag{background:rgba(233,180,70,.1);border:1px solid rgba(233,180,70,.2);color:var(--gold);font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px}
.share-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-share{font-family:var(--fb);font-size:13px;font-weight:600;padding:9px 18px;border-radius:var(--r);cursor:pointer;border:none;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-share-copy{background:var(--s3);border:1px solid var(--bdr2);color:var(--text)}
.btn-share-copy:hover{border-color:var(--gold-b);color:var(--gold)}
.btn-share-img{background:var(--gold);color:#160d00}
.btn-share-img:hover{background:#f5d170}

/* ── ANALYTICS ───────────────────────────────────────────────────────────── */
.analytics-wrap{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rr);overflow:hidden;margin-top:28px}
.analytics-hdr{padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px}
.analytics-hdr-title{font-family:var(--fh);font-size:16px}
.analytics-body{padding:20px}
.analytics-tabs{display:flex;gap:6px;margin-bottom:20px}
.analytics-tab{background:var(--s2);border:1px solid var(--bdr);color:var(--muted);font-family:var(--fb);font-size:12px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer;transition:all .15s}
.analytics-tab.on{background:var(--gold-d);border-color:var(--gold-b);color:var(--gold)}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r)}
.history-grade{font-family:var(--fh);font-size:22px;min-width:28px}
.history-info{flex:1}
.history-info strong{font-size:13px;font-weight:600;display:block;margin-bottom:2px}
.history-info span{font-size:11px;color:var(--muted)}
.history-bar-wrap{width:80px;height:6px;background:var(--s3);border-radius:99px;overflow:hidden}
.history-bar{height:100%;border-radius:99px}
.weak-list{display:flex;flex-direction:column;gap:8px}
.weak-item{display:grid;grid-template-columns:1fr 120px 40px;gap:10px;align-items:center;padding:10px 14px;background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r)}
.weak-label{font-size:13px}
.weak-bar-wrap{height:6px;background:var(--s3);border-radius:99px;overflow:hidden}
.weak-bar{height:100%;border-radius:99px;transition:width .8s ease}
.weak-pct{font-size:12px;font-weight:600;text-align:right}

/* ── AI EXPLANATION ──────────────────────────────────────────────────────── */
.ai-exp-wrap{margin-top:10px}
.ai-exp-btn{background:none;border:1px solid rgba(129,140,248,.3);color:#818cf8;font-family:var(--fb);font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.ai-exp-btn:hover{background:rgba(129,140,248,.08);border-color:rgba(129,140,248,.5)}
.ai-exp-btn.loading{opacity:.6;cursor:wait}
.ai-exp-box{margin-top:10px;padding:14px 16px;background:rgba(129,140,248,.06);border:1px solid rgba(129,140,248,.2);border-radius:var(--r);animation:fi .2s ease}
.ai-exp-header{font-size:11px;font-weight:700;color:#818cf8;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ai-exp-text{font-size:13px;color:var(--text);line-height:1.72}
.ai-typing::after{content:'▋';animation:blink .7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── MOTIVATIONAL CTA ────────────────────────────────────────────────────── */
.next-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px}
.next-step-card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .2s;text-align:left}
.next-step-card:hover{transform:translateY(-2px)}
.next-step-card.gold:hover{border-color:rgba(233,180,70,.35)}
.next-step-card.blue:hover{border-color:rgba(75,123,255,.35)}
.next-step-card.green:hover{border-color:rgba(62,207,110,.35)}
.nsc-ico{font-size:22px;margin-bottom:8px;display:block}
.nsc-title{font-size:13px;font-weight:600;margin-bottom:4px}
.nsc-card.gold .nsc-title{color:var(--gold)}
.next-step-card.gold .nsc-title{color:var(--gold)}
.next-step-card.blue .nsc-title{color:var(--blue)}
.next-step-card.green .nsc-title{color:var(--green)}
.nsc-desc{font-size:12px;color:var(--muted);line-height:1.5}

/* ── HEATMAP ─────────────────────────────────────────────────────────────── */
.heatmap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:8px}
.heatmap-cell{border-radius:var(--r);padding:14px 12px;border:1px solid;transition:all .2s;cursor:default}
.heatmap-cell:hover{transform:scale(1.02)}
.heatmap-cell.hot{background:rgba(62,207,110,.1);border-color:rgba(62,207,110,.3)}
.heatmap-cell.mid{background:rgba(233,180,70,.1);border-color:rgba(233,180,70,.25)}
.heatmap-cell.cold{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.25)}
.heatmap-cell.empty{background:var(--s2);border-color:var(--bdr)}
.heatmap-topic{font-size:12px;font-weight:600;margin-bottom:6px;line-height:1.3}
.heatmap-cell.hot .heatmap-topic{color:var(--green)}
.heatmap-cell.mid .heatmap-topic{color:var(--gold)}
.heatmap-cell.cold .heatmap-topic{color:var(--red)}
.heatmap-cell.empty .heatmap-topic{color:var(--muted)}
.heatmap-pct{font-size:20px;font-weight:700;font-family:var(--fh);line-height:1}
.heatmap-cell.hot .heatmap-pct{color:var(--green)}
.heatmap-cell.mid .heatmap-pct{color:var(--gold)}
.heatmap-cell.cold .heatmap-pct{color:var(--red)}
.heatmap-cell.empty .heatmap-pct{color:var(--muted)}
.heatmap-sub{font-size:10px;color:var(--muted);margin-top:3px}

/* ── TIME TRACKING ────────────────────────────────────────────────────────── */
.time-badge{font-size:11px;color:var(--muted);background:var(--s3);border:1px solid var(--bdr);padding:3px 9px;border-radius:99px;margin-left:auto}
.time-badge.slow{color:#f97316;border-color:rgba(249,115,22,.3);background:rgba(249,115,22,.08)}
.time-badge.fast{color:var(--green);border-color:rgba(62,207,110,.3);background:rgba(62,207,110,.08)}
.time-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:20px}
.time-stat-card{background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;text-align:center}
.time-stat-val{font-family:var(--fh);font-size:22px;margin-bottom:3px}
.time-stat-lbl{font-size:11px;color:var(--muted)}

/* ── RECOMMENDATIONS ──────────────────────────────────────────────────────── */
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);transition:border-color .15s}
.rec-item:hover{border-color:var(--bdr2)}
.rec-icon{font-size:20px;min-width:28px}
.rec-content{}
.rec-title{font-size:13px;font-weight:600;margin-bottom:3px}
.rec-desc{font-size:12px;color:var(--muted);line-height:1.55}
.rec-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-top:6px}
.rec-badge.urgent{background:var(--red-d);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.rec-badge.good{background:var(--green-d);color:var(--green);border:1px solid rgba(62,207,110,.2)}
.rec-badge.tip{background:var(--blue-d);color:var(--blue);border:1px solid rgba(75,123,255,.2)}

/* ── TOPIC TAG ON QUESTION ────────────────────────────────────────────────── */
.topic-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(129,140,248,.1);color:#818cf8;border:1px solid rgba(129,140,248,.2);letter-spacing:.04em}

/* ── ANALYTICS TABS EXTENDED ─────────────────────────────────────────────── */
.analytics-tab-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}

/* ── TREND GRAPH ─────────────────────────────────────────────────────────── */
.trend-wrap{position:relative;margin-bottom:20px}
.trend-svg{width:100%;overflow:visible}
.trend-point{cursor:pointer;transition:r .15s}
.trend-point:hover{r:7}
.trend-tooltip{position:absolute;background:var(--s1);border:1px solid var(--bdr2);border-radius:var(--r);padding:8px 12px;font-size:12px;pointer-events:none;z-index:10;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.trend-tooltip strong{display:block;font-size:13px;margin-bottom:2px}
.trend-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.trend-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.trend-legend-line{width:20px;height:2px;border-radius:1px}
.trend-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.trend-need-more{text-align:center;padding:16px;font-size:12px;color:var(--muted);background:var(--s2);border-radius:var(--r);margin-top:8px}

/* ── TOPIC DRILL-DOWN ────────────────────────────────────────────────────── */
.drill-back{background:none;border:none;color:var(--gold);font-family:var(--fb);font-size:13px;cursor:pointer;padding:0;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.drill-back:hover{opacity:.8}
.drill-header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.drill-title{font-family:var(--fh);font-size:20px}
.drill-stat{font-size:13px;color:var(--muted)}
.drill-q-list{display:flex;flex-direction:column;gap:8px}
.drill-q-item{padding:13px 15px;background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);border-left:3px solid}
.drill-q-item.dok{border-left-color:var(--green)}
.drill-q-item.bad{border-left-color:var(--red)}
.drill-q-item.neu{border-left-color:var(--muted)}
.drill-q-text{font-size:13px;line-height:1.5;margin-bottom:6px}
.drill-q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drill-q-ans{font-size:12px;color:var(--muted)}
.drill-q-ans span{color:var(--text);font-weight:600}

/* ── PREDICTION ──────────────────────────────────────────────────────────── */
.pred-card{background:linear-gradient(135deg,rgba(233,180,70,.08),rgba(233,180,70,.03));border:1px solid var(--gold-b);border-radius:var(--rr);padding:24px;text-align:center;margin-bottom:20px}
.pred-grade{font-family:var(--fh);font-size:64px;line-height:1;margin-bottom:4px}
.pred-label{font-size:13px;color:var(--muted);margin-bottom:16px}
.pred-confidence{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;margin-bottom:16px}
.pred-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.pred-bd-item{background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);padding:12px}
.pred-bd-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.pred-bd-val{font-size:15px;font-weight:600}
.pred-trend-up{color:var(--green)}
.pred-trend-down{color:var(--red)}
.pred-trend-flat{color:var(--muted)}

/* ── DAILY SUMMARY ───────────────────────────────────────────────────────── */
.daily-card{background:var(--s2);border:1px solid var(--bdr2);border-radius:var(--rr);padding:20px;margin-bottom:20px}
.daily-greeting{font-family:var(--fh);font-size:18px;margin-bottom:4px}
.daily-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.daily-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.daily-stat{text-align:center}
.daily-stat-val{font-family:var(--fh);font-size:22px;line-height:1;margin-bottom:3px}
.daily-stat-lbl{font-size:11px;color:var(--muted)}
.daily-streak-bar{display:flex;gap:4px;margin-top:4px}
.daily-streak-day{width:20px;height:20px;border-radius:4px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.daily-streak-day.active{background:var(--gold);color:#160d00}
.daily-streak-day.today{background:var(--green);color:#fff}
.daily-streak-day.empty{background:var(--s3);color:var(--muted)}
.daily-insight{font-size:12px;color:var(--muted);padding:10px 13px;background:var(--s3);border-radius:var(--r);line-height:1.6}
.daily-insight strong{color:var(--text)}

/* ── EXAM MODE ───────────────────────────────────────────────────────────── */
.exam-mode-banner{background:linear-gradient(135deg,rgba(248,113,113,.12),rgba(248,113,113,.06));border:1px solid rgba(248,113,113,.25);border-radius:var(--r);padding:8px 14px;font-size:12px;color:var(--red);font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:14px}
.exam-mode-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);color:var(--red);font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.05em}
.mode-select-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:24px}
@media(max-width:700px){.mode-select-grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.mode-select-grid{grid-template-columns:1fr}}
.mode-card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rr);padding:22px;cursor:pointer;transition:all .2s;text-align:left}
.mode-card:hover{transform:translateY(-2px)}
.mode-card.practice:hover{border-color:rgba(62,207,110,.4)}
.mode-card.exam:hover{border-color:rgba(248,113,113,.4)}
.mode-card-ico{font-size:28px;margin-bottom:10px;display:block}
.mode-card-title{font-size:15px;font-weight:700;margin-bottom:6px}
.mode-card.practice .mode-card-title{color:var(--green)}
.mode-card.exam .mode-card-title{color:var(--red)}
.mode-card.timed .mode-card-title{color:var(--teal)}
.mode-card.virtual .mode-card-title{color:var(--blue)}
.mode-card.virtual:hover{border-color:rgba(32,69,184,.4)}
.mode-card-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.mode-card-features{display:flex;flex-direction:column;gap:4px}
.mode-feature{font-size:12px;display:flex;align-items:center;gap:6px}
.mode-feature.on{color:var(--green)}.mode-feature.off{color:var(--muted)}

/* ── ERROR TRACKER ───────────────────────────────────────────────────────── */
.error-list{display:flex;flex-direction:column;gap:8px}
.error-item{background:var(--s2);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.error-count{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.error-count.high{background:var(--red-d);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.error-count.mid{background:var(--gold-d);color:var(--gold);border:1px solid var(--gold-b)}
.error-count.low{background:var(--s3);color:var(--muted);border:1px solid var(--bdr)}
.error-body{}
.error-q{font-size:13px;line-height:1.5;margin-bottom:4px}
.error-meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.error-last{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}

/* ── MODE COMPARISON ─────────────────────────────────────────────────────── */

// biti razlog da se banka uopće dohvati (ODLUKA 4).
const SOC_TOTAL_MC=SOC_EXAM_META.reduce(function(s,m){return s+(m.mcCount||0);},0);

/* Dan kao redni broj (UTC). Živi ovdje, uz manifest, jer ga uz SRS ekran treba i
   Home — a Home se crta prije ijednog dohvata. */
function today_ord(){ return Math.floor(Date.now()/86400000); }

/* Koliko SRS kartica danas čeka — BEZ BANKE PITANJA.
   getSrsDueCards treba EXAMS, a Home se renderira prije ijednog dohvata (banka
   od Faze 2 stiže s poslužitelja). Nad praznim EXAMS-om ta funkcija vraća [], pa
   je kartica „Ponavljanje“ svakome tvrdila „✓ Sve naučeno za danas!“ — i onome s
   200 dospjelih i onome tko nije vidio nijednu. Ista definicija dospjelosti
   („nova ili due <= danas“) ovdje se izvodi iz samog SRS zapisa i SOC_TOTAL_MC iz
   manifesta: viđene kartice su ključevi zapisa, nove su ostatak. */
function socSrsDueCount(srsData){
  const tod=today_ord();
  const data=(srsData&&typeof srsData==="object")?srsData:{};
  let seen=0,overdue=0;
  Object.keys(data).forEach(function(k){
    seen++;
    const card=data[k];
    if(!card||!Number.isFinite(card.due)||card.due<=tod)overdue++;
  });
  const fresh=Math.max(0,SOC_TOTAL_MC-seen);
  return {due:overdue+fresh,seen:seen,total:SOC_TOTAL_MC};
}

// Prima envelope rute GET /api/sim/soc/exam/<key> ({key,meta,texts,qs,keys})
// ili polje takvih. Puni EXAMS IN PLACE — referenca se nikad ne mijenja.
function socIngestExam(payload){
  if(!payload||typeof payload!=="object")return null;
  const key=payload.key;if(typeof key!=="string"||!Array.isArray(payload.qs))return null;
  const meta=payload.meta||{},fallback=SOC_EXAM_BY_KEY[key]||{};
  const ex=EXAMS[key]||(EXAMS[key]={key:key});
  ex.key=key;
  ex.year=meta.year!=null?meta.year:fallback.year;
  ex.season=meta.season||fallback.season;
  ex.label=meta.label||fallback.label;
  ex.qs=payload.qs;
  ex.keys=payload.keys||"none";
  return ex;
}
function socIngestExams(payload){
  const list=Array.isArray(payload)?payload:[payload];
  return list.map(socIngestExam).filter(Boolean);
}

/* ── DOHVAT ISPITA I PREDAJA — SAMO PREKO RODITELJA ──────────────────────────
   ADR-001, ODLUKA 7: engine u iframeu NIKAD ne zove mrežu. Traži ispit porukom
   DISCERE_NEED_EXAM {key,mode} (key "*" = cijela banka, samo za plaćeni tier), a
   roditelj (SociologijaClient.jsx) odgovara s DISCERE_EXAMS / DISCERE_EXAM_ERROR.
   Predaja ide DISCERE_SUBMIT → roditelj POST /api/sim/soc/grade → DISCERE_GRADE.

   Standalone otvaranje ove datoteke (bez roditelja) nema odakle dobiti pitanja:
   FAIL-CLOSED, s porukom da se simulator otvori kroz aplikaciju. Prazan ekran bez
   objašnjenja izgledao bi kao kvar, a tihi lokalni fallback ne postoji — podaci
   su izašli iz ovog assetsa i to je cijela poanta zahvata. */
const SOC_STANDALONE_MSG="Simulator se otvara kroz aplikaciju — ispiti se učitavaju tek ondje. Otvori discere/sociologija i pokušaj ponovno.";
/** Strop čekanja na roditelja. Veći od njegovih (20 s dohvat, 30 s predaja) da
    poruka o grešci stigne s njegove strane, gdje je točnija. */
const SOC_EXAM_WAIT_MS=30000;
const SOC_BULK_WAIT_MS=90000;
const SOC_GRADE_WAIT_MS=45000;

/** key → način rada u kojem je ispit dohvaćen ("exam" | "practice"). */
const SOC_EXAM_MODE_BY_KEY=new Map();
/** `${key}|${mode}` → {promise,resolve,reject,timer} */
const socExamWaiters=new Map();
/** attemptId → {promise,resolve,reject,timer} */
const socGradeWaiters=new Map();
let socBulkWaiter=null;
/** Je li cijela banka (svih 32 ispita) već stigla — vidi socOnExamsDone. */
let socBulkLoaded=false;

function socHasParent(){try{return !!(window.parent&&window.parent!==window);}catch(e){return false;}}
function socNormMode(m){return m==="practice"?"practice":"exam";}
function socPost(m){
  try{
    const send=window.__SOC_TOPARENT__;
    if(typeof send!=="function")return false;
    return send(m)!==false;
  }catch(e){return false;}
}
function socErr(message,status){const err=new Error(message);err.status=status||0;return err;}

/** Otisak pokušaja — isti id roditelj i ruta prepoznaju kao ISTU predaju. */
function socNewAttemptId(){
  try{ if(window.crypto&&typeof window.crypto.randomUUID==="function")return window.crypto.randomUUID(); }catch(e){}
  return "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,12);
}

function socSettle(map,key,fn){
  const w=map.get(key);
  if(!w)return false;
  map.delete(key);
  clearTimeout(w.timer);
  fn(w);
  return true;
}

/**
 * Dohvati JEDAN ispit u traženom načinu rada. Istovremeni pozivi dijele promise.
 * Način rada je dio ključa keša: isti ispit u vježbanju smije nositi ključeve za
 * prvih FREE_LIMIT pitanja, a u ispitnom modu nijedan — kad bi se payload iz
 * vježbanja upotrijebio u simulaciji, prekidač `qs.some(q=>q.sol)` bi lagao.
 */
function socRequestExam(key,rawMode){
  const mode=socNormMode(rawMode);
  if(!key||typeof key!=="string")return Promise.reject(socErr("Ispit nije dostupan.",404));
  if(EXAMS[key]&&SOC_EXAM_MODE_BY_KEY.get(key)===mode)return Promise.resolve(EXAMS[key]);

  const waitKey=key+"|"+mode;
  const inFlight=socExamWaiters.get(waitKey);
  if(inFlight)return inFlight.promise;

  if(!socHasParent())return Promise.reject(socErr(SOC_STANDALONE_MSG,0));

  let resolve,reject;
  const promise=new Promise(function(res,rej){resolve=res;reject=rej;});
  const timer=setTimeout(function(){
    socSettle(socExamWaiters,waitKey,function(w){w.reject(socErr("Dohvat ispita je predugo trajao.",0));});
  },SOC_EXAM_WAIT_MS);
  socExamWaiters.set(waitKey,{promise:promise,resolve:resolve,reject:reject,timer:timer,mode:mode});

  if(!socPost({type:"DISCERE_NEED_EXAM",key:key,mode:mode})){
    socSettle(socExamWaiters,waitKey,function(w){w.reject(socErr(SOC_STANDALONE_MSG,0));});
  }
  return promise;
}

/**
 * Dohvati CIJELU banku — za ekrane koji je analiziraju (Pregled, Filter,
 * Flashcards, SRS, Bookmarci, Dnevni izazov, Virtualni ispit). Svi su Standard
 * sadržaj i svi su iza socFeatureGatea, pa free korisnik dovde ne dolazi; ako i
 * dođe, roditelj odbija "*" za free (ODLUKA 4).
 */
function socRequestAllExams(){
  if(socBulkLoaded)return Promise.resolve(SOC_EXAM_META.length);
  if(socBulkWaiter)return socBulkWaiter.promise;
  if(!socHasParent())return Promise.reject(socErr(SOC_STANDALONE_MSG,0));

  let resolve,reject;
  const promise=new Promise(function(res,rej){resolve=res;reject=rej;});
  const timer=setTimeout(function(){
    const w=socBulkWaiter;socBulkWaiter=null;
    if(w)w.reject(socErr("Dohvat ispita je predugo trajao.",0));
  },SOC_BULK_WAIT_MS);
  socBulkWaiter={promise:promise,resolve:resolve,reject:reject,timer:timer};

  if(!socPost({type:"DISCERE_NEED_EXAM",key:"*",mode:"exam"})){
    const w=socBulkWaiter;socBulkWaiter=null;clearTimeout(timer);
    if(w)w.reject(socErr(SOC_STANDALONE_MSG,0));
  }
  return promise;
}

/** Predaja na ocjenjivanje. Vraća { pct, grade, cor, total, bodovi, xpGain, scores }. */
function socSubmitToParent(payload){
  const attemptId=payload&&payload.attemptId;
  if(!attemptId)return Promise.reject(socErr("Predaja nije moguća.",0));
  const inFlight=socGradeWaiters.get(attemptId);
  if(inFlight)return inFlight.promise;
  if(!socHasParent())return Promise.reject(socErr(SOC_STANDALONE_MSG,0));

  let resolve,reject;
  const promise=new Promise(function(res,rej){resolve=res;reject=rej;});
  const timer=setTimeout(function(){
    socSettle(socGradeWaiters,attemptId,function(w){w.reject(socErr("Slanje je predugo trajalo.",0));});
  },SOC_GRADE_WAIT_MS);
  socGradeWaiters.set(attemptId,{promise:promise,resolve:resolve,reject:reject,timer:timer});

  const sent=socPost({
    type:"DISCERE_SUBMIT",
    examKey:payload.examKey,
    answers:payload.answers||{},
    qTimes:payload.qTimes||{},
    examMode:!!payload.examMode,
    attemptId:attemptId,
    durationSec:Number.isInteger(payload.durationSec)?payload.durationSec:undefined
  });
  if(!sent){
    socSettle(socGradeWaiters,attemptId,function(w){w.reject(socErr(SOC_STANDALONE_MSG,0));});
  }
  return promise;
}

/* ── primanje odgovora roditelja (zove ih bridge IIFE na dnu) ─────────────── */

function socOnExams(d){
  const payload=d&&d.exam;
  const ex=socIngestExam(payload);
  if(!ex)return;
  // Skupni dohvat ide s mode="exam" (roditeljev BULK_MODE) i stiže nezatražen,
  // pa se način rada bilježi iz zahtjeva kad on postoji, inače kao "exam".
  const examWait=socExamWaiters.get(ex.key+"|exam");
  const practiceWait=socExamWaiters.get(ex.key+"|practice");
  const mode=practiceWait&&!examWait?"practice":"exam";
  SOC_EXAM_MODE_BY_KEY.set(ex.key,mode);
  socSettle(socExamWaiters,ex.key+"|"+mode,function(w){w.resolve(ex);});
}

function socOnExamError(d){
  const key=d&&d.key;
  const status=(d&&d.status)||0;
  const message=(d&&d.error)||"Dohvat ispita nije uspio.";
  if(key==="*"){
    const w=socBulkWaiter;socBulkWaiter=null;
    if(w){clearTimeout(w.timer);w.reject(socErr(message,status));}
    return;
  }
  // Roditelj ne vraća način rada na svakoj grešci; odbij oba čekanja za taj ispit.
  ["exam","practice"].forEach(function(mode){
    socSettle(socExamWaiters,key+"|"+mode,function(w){w.reject(socErr(message,status));});
  });
}

function socOnExamsDone(d){
  const w=socBulkWaiter;socBulkWaiter=null;
  if(!w)return;
  clearTimeout(w.timer);
  const delivered=(d&&d.delivered)||0;
  const total=(d&&d.total)||0;
  // Banka se proglašava učitanom samo kad je stigla CIJELA. Stigne li dio,
  // sljedeći ulazak u takav ekran ponovno pita roditelja, koji ono što već ima
  // isporuči iz keša, a ono što nedostaje pokuša ponovno — rupa ne ostaje trajna.
  if(total&&delivered>=total)socBulkLoaded=true;
  // Ništa nije stiglo → to je prava greška i ekran mora ponuditi ponovni pokušaj.
  // Dio je stigao → ekran se otvara s onim što ima (semantika allSettled).
  if(delivered>0)w.resolve(delivered);
  else w.reject(socErr("Dohvat ispita nije uspio. Provjeri vezu pa pokušaj ponovno.",0));
}

function socOnGrade(d){
  socSettle(socGradeWaiters,d&&d.attemptId,function(w){w.resolve((d&&d.result)||null);});
}

function socOnGradeError(d){
  socSettle(socGradeWaiters,d&&d.attemptId,function(w){
    const err=socErr((d&&d.error)||"Ocjenjivanje nije uspjelo.",(d&&d.status)||0);
    err.retryAfterSec=(d&&d.retryAfterSec)||0;
    w.reject(err);
  });
}

/* ── NACRT ISPITA (DS) ──────────────────────────────────────────────────────
   Nedovršen pokušaj u localStorageu. Sociologija ga dosad nije imala (hrvatski
   ima `discere_exam_<key>`, matematika `mat_resume`, engleski `disc_eng_exam_*`),
   pa je osvježavanje stranice u 80. minuti simulacije brisalo sve: odgovori su
   živjeli isključivo u React stanju.

   NAČIN RADA JE DIO KLJUČA: bez njega vježbanje (u kojem „Provjeri“ pokazuje
   točan odgovor) ostavi popunjene odgovore, a simulacija istog ispita ih pri
   montiranju pokupi kao svoje i preda kao regularan pokušaj.

   ROK JE DIO NACRTA i to je bitno: bez zapisanog apsolutnog trenutka isteka
   osvježavanje vraća pun timer, pa se 90-minutna simulacija može produljivati
   unedogled — a takav pokušaj ocjenjivačka ruta upisuje u sim_progress kao
   regularan (iz njega se računaju napredak i percentil). */
const SOC_DRAFT_PREFIX="disc_soc_exam_";
const SOC_DRAFT_TTL_MS=6*60*60*1000;
const SOC_REAL_EXAM=/^\d{4}_(ljeto|jesen)$/;

/** Ključ nacrta, ili null za virtualne sesije (slažu se iznova pri svakom ulasku).
    SVA ČETIRI NAČINA RADA IMAJU SVOJ KLJUČ, i timedPractice je tu punopravan
    parametar: vježbanje otkriva točan odgovor po pitanju, pa bi zajednički nacrt
    prenio već viđena rješenja u vježbanje s timerom (i njegov rok u netimirano). */
function socDraftKey(examKey,examMode,practice,timedPractice){
  if(!examKey||!SOC_REAL_EXAM.test(examKey))return null;
  const mode=examMode?"_exam"
    :timedPractice?"_practice_timed"
    :practice?"_practice"
    :"_plain";
  return SOC_DRAFT_PREFIX+examKey+mode;
}

function socReadDraft(key){
  if(!key)return null;
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return null;
    const d=JSON.parse(raw);
    if(!d||typeof d!=="object")return null;
    if(!Number.isFinite(d.at)||Date.now()-d.at>SOC_DRAFT_TTL_MS)return null;
    return {
      answers:(d.answers&&typeof d.answers==="object")?d.answers:{},
      qTimes:(d.qTimes&&typeof d.qTimes==="object")?d.qTimes:{},
      deadline:Number.isFinite(d.deadline)?d.deadline:null,
      cur:Number.isInteger(d.cur)&&d.cur>0?d.cur:0,
      attemptId:typeof d.attemptId==="string"?d.attemptId:null
    };
  }catch(e){return null;}
}

function socWriteDraft(key,data){
  if(!key)return;
  try{localStorage.setItem(key,JSON.stringify(Object.assign({at:Date.now()},data)));}catch(e){}
}

function socClearDraft(key){
  if(!key)return;
  try{localStorage.removeItem(key);}catch(e){}
}

      sections: [
        {
          heading: "Tradicionalna religioznost u užem smislu",
          text: "Tradicionalna religioznost u užem smislu pokriva razdoblje socijalizacije u obitelji. Obitelj (u današnjoj nukleusnoj obitelji to su prvenstveno roditelji) odlučuje o uključivanju djece u religijsku zajednicu, stvara religijsku atmosferu u domu te brine o prenošenju religijskih sadržaja na djecu. Kao dio obiteljske i šire nacionalne i kulturne tradicije ti su oblici bili širokorasprostranjeni i činili podlogu visokorasprostranjene religioznosti.\n\nPodaci iz 1972. pokazuju da je 81% ispitanika izjavilo da u svom roditeljskom domu ima križ, slike svetaca, oltarić i sl. Podaci iz 1997. pokazuju da je 86% ispitanika izjavilo da u stanu drži križ, ikonu ili sliku nekoga sveca."

          text: "Istraživanje Društvene i religijske promjene u Hrvatskoj provedeno je 2004. na reprezentativnom uzorku od 2220 ispitanika u 154 naselja. U istraživanju se 96,5% ispitanika izjasnilo da pripadaju nekoj vjeri, uglavnom katoličkoj.\n\nIz analiza je vidljivo da su ne samo religiozni već i manje religiozni ispitanici u visokom postotku konfesionalno identificirani, odgajani u vjeri, obavili osnovne sakramente i pohađali vjeronauk. Podaci pokazuju da je religija bila i ostala prisutna u životu ljudi te je u značajnom opsegu bila i jest dio biografije različitih generacija."

  "2011_jesen": {
    article: {
      title: "Bodin, D., Robène, L., Héas, S.: Sport i nasilje u Europi (2007.)",
      sections: [
        {
          heading: "Skinheadi i navijačka kultura",
          text: "Veza između navijačke kulture i ideologije ima prilično dugu prošlost. Skinheadi su se pojavili u Velikoj Britaniji kasnih šezdesetih godina prošloga stoljeća. Izvorno taj pokret nije bio rasistički — bio je reakcija na hipi kulturu i raspad britanskoga gospodarstva. U svojoj osnovi bio je kontrakultura: hipici su imali dugu kosu i išli na mirovne prosvjede pa su skinheadi obrijali glavu i nasiljem se koristili kao sredstvom isticanja svoje muževnosti. Pokret skinheada, većina kojih je potjecala iz radničkih obitelji, dijelio je mnoge vrijednosti s imigrantima koji su, baš poput skinsa, bili na margini društva. I jedni i drugi slušali su ska i reggae glazbu. U nogometu, tada sastavnom dijelu britanske popularne kulture, skinheadi su pronašli afirmativno sredstvo izražavanja."
        },
        {
          heading: "Isključivanje i ekonomizacija sporta",
          text: "Izravno je odbijanje jedan primjer isključivanja: odbijanje natjecanja s nekim tko je druge vjere ili zbog razlike u stajalištima oko političkih, kulturnih, vjerskih i drugih tema. Postoji i širi problem vezan sa spolom u sportu — pitanje trebaju li žene sudjelovati u sportskim aktivnostima nije ograničeno samo na sport ili suvremenu eru.\n\nMeđu različitim oblicima državnoga nasilja, postoje oni koji su ostavili izrazit trag u europskoj povijesti — primjer je način na koji su mladi bili prisiljeni baviti se sportom pod zastavama fašizma u Italiji, nacizma u Njemačkoj i Pétainova režima u Francuskoj.\n\nU organiziranome sportu, novac se ne samo distribuira nejednako već su prisutne i očite razlike među sportovima — što doprinosi isključivanju. Ekonomska dominacija se u Europi ispoljila na različite načine: od ulaganja, sponzorstva i pokroviteljstva do dioničarstva i preuzimanja tvrtki. Takva je situacija potaknula klubove da počnu razmišljati i djelovati na poduzetnički način.\n\nTelevizija je pomogla demokratizaciji sporta donijevši ga širokoj publici, ali je promijenila i njegovu sliku — koncentriranjem na određene sportove koji se smatraju televizičnijima (nogomet, tenis, biciklizam, utrke), što je pojačalo financiranje tih sportova na uštrb ostalih."

  "2011_ljeto": {
    article: {
      title: "Katunarić, V.: Razvoj ljudske suradnje — prema postmonetarnom društvu? (2010.)",
      sections: [
        {
          heading: "Postmonetarno društvo i stratifikacija",
          text: "Katunarić, V., Razvoj ljudske suradnje: prema postmonetarnom društvu?, 2010.\n\nU tekstu se raspravlja o povezanosti neofeudalnih tendencija u suvremenim društvima s evolucijom novca u globalni novac, koja odgovara izvornoj naravi novca kao duga, kako ga je definirao Georg Simmel. Postojanje golemih financijskih sredstava izvan kontrole država omogućuje bogaćenje mimo standarda demokratskog egalitarizma i formiranje društvene stratifikacije karakteristične za ranomoderno društvo. Autor tu tendenciju interpretira kao preobražaj odnosa između Gesellschafta i Gemeinschafta u karikaturu liberalizma i socijalizma — 'Gornju' i 'Donju zajednicu'.\n\nToj tendenciji suprotstavlja viziju postmonetarnog društva u kojemu bi novac služio zadovoljenju nužnih potreba individuuma, dok bi se postupno povlačio iz sfere razotuđenog rada i iz područja gdje izravno povjerenje među ljudima prevladava. Takva demonetarizacija odvijala bi se u kontekstu komplementarnosti kooperativnih i kompetitivnih odnosa — partnerstva između socijalizma i liberalizma s njihovim ljudskim licima."
        },
        {
          heading: "Špekulantska ekonomija i monetaristički zaokret",
          text: "Repolarizacija društva na konkurentski i kooperativni tip podudara se s rascjepom između špekulantske i radne ekonomije. Špekulantska ekonomija stvara podlogu za društvo rastućih egoista koji više vole stvari nego ljude. U takvom bi društvu živio najveći dio zapadne hemisfere — preobrazilo bi se u globalni gornji stalež, najbrojniji na Zapadu i Sjeveru.\n\nPri kraju 20. stoljeća kapitalizam izvodi 'monetaristički zaokret'. Da bi se ta promjena objasnila, novac ne treba shvaćati samo kao sredstvo razmjene, nego i ekonomskih borbi i društvene moći. Bitan rezultat te dinamike jest da bankovno-kreditni novac izlazi izvan kontrole većine država. U tom se svjetlu može razumjeti zašto zapadne države spašavaju banke, a traže likvidaciju istočnoeuropskih brodogradilišta.\n\nVlasnici novog bogatstva, iako ekonomske izglede u maloj mjeri dijele s ostalim zaposlenima i lokalne zajednice te nastoje smanjiti porezna davanja, ipak ne žele raskinuti simboličke veze sa zajednicom. Njihova je reprezentativna ideologija demokratska, katkad i populistička, ali oni su u srži grabežljivci koji sebe vide kao pobjednike poput feudalaca i kraljeva."
        }
      ]

    "2018_ljeto": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [{heading:"Émile Durkheim: Pravila sociološke metode (odlomak)",text:"Pa ipak društveni su fenomeni stvari i s njima treba postupati kao sa stvarima. (...)\n\nMi dakle trebamo promatrati društvene fenomene kakvi su po sebi, odvojeni od svjesnih \nsubjekata koji ih predstavljaju; treba ih proučavati izvana, kao vanjske stvari, budući da nam se \npredstavljaju u takvom svojstvu. (...) \nOne uopće ne ovise o našoj volji već ju izvana određuju; one su poput kalupa po kojima mi \nmoramo oblikovati svoju djelatnost. (...) \nZa čovjeka je karakteristično to što njegove uzde nisu fizičke nego moralne, odnosno \ndruštvene. On svoj zakon ne dobiva od materijalnog okružja koje mu se grubo nameće, nego \nod svijesti koja je iznad njegove i koju osjeća nad sobom. (…)\n\nNo kad je uznemireno, bilo zbog neke bolne krize ili zbog sretnih, ali prenaglih promjena, \ndruštvo tada nije sposobno za takav utjecaj; i eto odakle nagli usponi suicidalne krivulje, (...) \nTreba vremena da javna svijest opet razvrsta ljude i stvari. Njihova pojedinačna vrijednost \nostaje neodređena, a time za neko vrijeme nedostaje i cjelokupna regulacija, sve dok tako \noslobođene društvene sile opet ne uspostave ravnotežu. Više se ne zna što je moguće a što \nnije, što je pravedno a što nepravedno, koji su zahtjevi i nade opravdani, koji su prevršili mjeru. \nZato, nema toga što ljudi ne zahtijevaju. \n(...) Stanje (...) još je dakle pojačano činjenicom da su strasti manje disciplinirane upravo u \nčasu kad bi im trebala čvršća disciplina.\n\nPrema: V. Cvjetičanin i R. Supek, Sociološka hrestomatija (2003.)"},{heading:"Moreška — kulturna baština Korčule",text:"dočekali su morešku, (...) Jedinstvenu mediteransku mačevalačku igru koja se \nsamo na Korčuli održala do današnjeg dana, središnju nit lokalnog identiteta. Ples \nkoji se igra stotinu puta na godinu, za turiste i posjetitelje, ali koji se samo taj dan u \ngodini igra isključivo za baštinike korčulanskog blaga. \n(...) etimološki ʼmoreškaʼ najvjerojatnije i dolazi od riječi Maur, Mor. Ta se teorija \nponajviše uvriježila u narodu. Prema njoj se moreška prvi put igrala u španjolskoj \nLeridi sredinom 12. stoljeća, kao prisjećanje na protjerivanje Maura. Potom se \nproširila cijelim Mediteranom, a u Korčulu je došla preko južne Italije i Dubrovnika u \n16. stoljeću. \n(...) veliki kruzer pristao je na gatove pod zidinama staroga grada.  \n(...) Iz pristigloga metalnoga gorostasa izlaze turisti iz cijelog svijeta i odlaze do \nkamene pozornice.\nPrema: National Geographic (br. 8., 2009.)"},{heading:"Demografski trendovi: žene i brak u suvremenom društvu",text:"Žene se sve kasnije odlučuju na stupanje u bračnu zajednicu. Na tu činjenicu u velikoj \nmjeri utječe splet raznih društvenih i gospodarskih čimbenika. Sve veći obuhvat mladih žena \nvisokoškolskim obrazovanjem vrlo je važan čimbenik u pomicanju te dobi u starije dobne \nskupine. Također, tome je uvelike pridonijelo osamostaljivanje žena koje se sve više uključuju  \nu tržište rada. Mladi ljudi koji imaju namjeru sklopiti brak danas u sve većem broju žive \nzajedno, u izvanbračnim zajednicama, i prije sklapanja braka. Sve navedeno doprinijelo je \npovećanju prosječne dobi nevjeste pri sklapanju prvog braka u promatranome razdoblju od \n1971. do danas za šest godina. \n(...) Spomenuti splet društvenih i gospodarskih čimbenika koji utječu na činjenicu da se žene \nsve kasnije odlučuju na bračnu zajednicu ujedno doprinosi i pomicanju dobi u kojoj se žene \nodlučuju na rođenje prvog djeteta. \n(...) Prosječna mjesečna neto plaća za žene u 2014. iznosila je 5190 kuna te je bila za 10,9 % \nmanja od prosječne neto plaće muškaraca. \n(...) Equal Pay Day, odnosno dan jednakih plaća u 2015. padao je na 14. veljače, što upućuje \nna to da su, ako se u omjer uzmu prosječne neto plaće muškaraca i žena te podijele s brojem \ndana u godini, žene dostigle primanja muškaraca tek 45 dana poslije.\nPrema: Državni zavod za statistiku (www.dzs.hr)"}]

    "2018_jesen": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [{heading:"Slučaj školskog nasilja (novinarski tekst)",text:"Učenik šestog razreda (...) tvrdi da je u kuhinji slučajno trknuo starijeg dječaka, a ovaj ga \nje primio za glavu i zaprijetio (...). Na velikom odmoru izišao je van i osmaš ga je, kaže, počeo \nloviti. U jednom trenutku spotaknuo se i pao na pod i tada ga je, nastavlja, stariji dječak više \nputa udario (...). Ničega se drugog ne sjeća. \n(...)  \nRavnateljica škole istaknula je da je to prvi takav slučaj koji im se dogodio.\n\n– Osjećali smo se jadno i zatečeno. Žalosno je da se to dogodilo u našoj školi, koja ima 1090 \nučenika, ali sretni smo što nije bilo težih posljedica. Intenzivno radimo na suzbijanju i prevenciji \nmaloljetničkog nasilja, a sada ćemo pojačati i predavanja – rekla je (...) i dodala da je osmaš \nkažnjen ukorom, a da o eventualnoj kazni za učenika šestog razreda još nisu raspravljali jer \njoš nije bio u školi nakon incidenta. Policija je priopćila da su o događaju podnijeli posebno \nizvješće ODO-u za mladež i obavijestili Centar za socijalnu skrb.\nIzvor: Večernji list (www.vecernji.hr)"},{heading:"Identitet u sociološkoj perspektivi",text:"U sociološkoj perspektivi koncepcija identiteta vezana je prije svega uz socijalnu \ninterakciju, te procese socijalizacije i internalizacije. \n(...)\n\nKonstrukciju identiteta karakteriziraju tri temeljna pitanja: Tko sam ja u svijetu?; \nTko sam ja u društvu?; i Tko sam ja spram sebe? (Rogić, 2003:20-21). Po tome je \nkoncepcija identiteta bitno oznaka moderniteta jer u tradicionalnom stanju društva \nkojim uglavnom dominira \u201ezajednica\u201d nije bilo potrebe za postavljanjem tih pitanja. \n(...) Pitanje identiteta, prvo kao problem, a onda kao zadatak, javlja se \nrastvaranjem institucije susjedstva i razvojem nacionalne države koja mjesto \nrođenja postavlja kao temelj svoje suverenosti. Navedena pitanja mogu imati \nsmisla jedino ako pojedinac vjeruje da može biti netko drugi. Ta pitanja su smislena \njedino ako pojedinac u tom smislu ima izbor i ako o njemu ovisi što će izabrati.\nPrema: I. Cifrić i K. Nikodem, Socijalna ekologija (Vol. 15, 2006.)"},{heading:"Religioznost i povratak svetoga",text:"Još više, spomenuta je potreba za religioznošću izravni povijesni odgovor na krize tog \nmodernog svijeta koji se pokazao nesposobnim riješiti temeljne probleme ljudskoga postojanja, \npomiriti različite kulture, očuvati prirodu od uništenja, donijeti mir i blagostanje svim ljudima na \nplanetu.\n\nIz toga slijedi da razloge za pojavu nove religioznosti – koja je danas lako prepoznatljiva \nu mnoštvu crkvenih skupina, vjerskih zajednica, novih sekti, religijskih pokreta, karizmatičkih \ndružbi i apokaliptičkih grupa – valja prije svega tražiti u krizi modernosti i raspadu njezinih \nsvjetovnih mitova. Neke središnje vrednote građanskoga društva – kao što su razumnost, \nnapredak, političnost, ideologičnost, autoritet, tehnologijski i proizvođački mentalitet – \ndoživljavaju u naše dane svoje potpuno povijesno obezvrijeđenje. Stoga je teško izbjeći pitanje \nda li se između toga kraja iluzija modernosti i početka spektakularnog povratka religije u \nsvjetovno društvo može uspostaviti neka uzročna sveza. Odgovor je naravno potvrdan:  \nsveto je nadošlo jer je modernost zatajila.\nPrema: J. Jukić, Revija za sociologiju (Vol. 22, 1991.)"}]
    },

    article: {
      title: "Tekstovi uz zadatke",
      sections: [{heading:"Slučaj Marko — etiketiranje u školi",text:"Marko je gimnazijalac s dugom kosom, pirsinzima u obrvi, nosu i usni te s nekoliko \ntetovaža. Na nastavu u Markov razred dolazi nastavnik na zamjeni koji od prvoga \nsata ima negativan stav prema Marku zbog njegova izgleda i stila odijevanja. Često \nmu ne vjeruje da je samostalno riješio zahtjevne zadatke. Na kraju školske godine \nMarko je po prvi put u svojemu školovanju imao zaključenu trojku. Prethodnih je \ngodina išao na školska natjecanja, a sve s istim trudom."},{heading:"Slučaj Maja — socijalizacija i uloga nastavnice",text:"Maja se nakon završenoga studija sociologije zaposlila kao nastavnica u gimnaziji. \nStručno se usavršava i u nastavi uspješno kombinira različite metode rada u \npoučavanju i ocjenjivanju svojih učenika. Zbog toga je pohvaljivana te je nedavno \npromovirana u zvanje mentorice."},{heading:"Grafički prikaz: gradsko i seosko stanovništvo",text:"Grafički prikaz 1. Postotak gradskoga i seoskoga stanovništva u svjetskoj populaciji\n\nPrikaz prikazuje dva trenda kroz 20. i 21. stoljeće:\n- Rastuća linija: postotak gradskog stanovništva (urbanizacija)\n- Padajuća linija: postotak seoskog stanovništva (deruralizacija)\n\nPočetkom 20. stoljeća više od 80% svjetskog stanovništva živjelo je na selu. Oko 2007. godine po prvi put u povijesti više od 50% svjetskog stanovništva živjelo je u gradovima. Projek­cije predviđaju da će do 2050. oko 70% svjetskog stanovništva živjeti u urbanim područjima.\n\nIzvor: Dumont, G-F., 2018. Urban demographic transition. Urban development issues 56, str. 13-25."},{heading:"Karl Marx: Prilog kritici političke ekonomije (odlomak)",text:"U društvenoj proizvodnji svoga života ljudi stupaju u određene nužne odnose, \nnezavisne od njihove volje, odnose proizvodnje, koji odgovaraju određenom \nstupnju razvitka njihovih materijalnih proizvodnih snaga. Cjelokupnost tih odnosa \nproizvodnje sačinjava ekonomsku strukturu društva, realnu osnovu na kojoj se \nuzdižu pravna i politička nadgradnja i kojoj odgovaraju određeni oblici društvene \nsvijesti. Način proizvodnje materijalnog života uvjetuje proces socijalnog, \npolitičkog i duhovnog života uopće. (...) Na izvjesnom stupnju svog razvitka dolaze \nmaterijalne proizvodne snage društva u proturječnost s postojećim odnosima \nproizvodnje ili, što je samo pravni izraz za to, s odnosima vlasništva u čijem \nsu se okviru do tad kretale. Iz oblika razvijanja proizvodnih snaga ti se odnosi \npretvaraju u njihove okove. Tada nastupa epoha socijalne revolucije. S promjenom \nekonomske osnove vrši se sporije ili brže prevrat čitave goleme nadgradnje... (...)\n\nLjudski rad postaje predmetom. Naime: \u201eTa činjenica uključuje da se predmet \nproizveđen radom, njegov proizvod, njemu sada suprotstavlja kao tuđe biće, \nkao moć nezavisna od proizvođača. Proizvod rada jest rad koji je utjelovljen u \npredmetu i pretvorio se u fizičku stvar. Taj je proizvod opredmećenje rada\" (Marx, 1961:210). (...)\n\n(...) Središnju dimenziju tvori način na koji ljudi društveno proizvode ono što im \nje potrebno za održanje života. Tvore je proizvodne snage i njima odgovarajući \nodnosi proizvodnje. Ono što ljudi misle – razni oblici religije, prava, politike i \nfilozofije – uvjetovano je tom strukturom kao realnom osnovom na koju je upućeno \nsve ostalo.\n\nKalanj, R. 2005. Suvremenost klasične sociologije. Politička kultura. Zagreb."},{heading:"Grafit Paraf Punk — zaštićena kulturna baština Rijeke",text:"Nakon 40 godina od nastanka na nogostupu Lorenzovih stuba na Kozali \nobnovljen je riječki grafit Paraf punk. Natpis je prije dvije godine Grad Rijeka \nproglasio zaštićenim kulturnim dobrom …, a sada ga je ponovio njegov autor \nValter Kocijančić, pjevač i jedan od osnivača spomenutog benda, uz nazočnost \npredstavnika Grada Rijeke. \n– Bio sam tada mlad i nestašan dječarac koji je živio u neposrednoj blizini. Bilo \nje kasno ljetno poslijepodne i uzeo sam kantu bijele boje i napisao Paraf punk, \nprisjetio se tog trenutka član istoimenog benda… \n(…) Riječki gradonačelnik Vojko Obersnel rekao je tom prilikom da je dobro da se \ngrafit spasio od zaborava i da ne bi bilo loše da on bude spomenik od nacionalnog \nznačaja. \n(…) – Ponosni smo što je iz ovog kvarta, iz Rijeke krenuo punk pokret kao i na ono \nšto su radili Parafi a kasnije nastavili Termiti, naveo je riječki gradonačelnik. \nGrafit je izravno svjedočanstvo vrlo ranog početka ovog subkulturnog pokreta u \nglazbi; to je jedan od europski vrijednih znakova riječkog urbanog duha. \nwww.novilist.hr (objavljeno 20. travnja 2018. godine)"},{heading:"Socijalno isključivanje u obrazovanju u Hrvatskoj",text:"Snažno je prisutan fenomen socijalnog isključivanja, o kojem se malo govori, \na to je da se najveći dio udaljavanja djece niskoobrazovanih od sveučilišta \ndogađa već u osnovnoj školi. U višim razredima osnovne škole, presudnima \nza upise u srednje škole, djeca niskoobrazovanih u prosjeku su smanjeno \nuspješna i to povlači za sobom loše i lošije zaključne ocjene. A s njima nema \nni teorijske mogućnosti upisivanja gimnazija koje ih pripremaju za sveučilišta \n(...). Istraživanja pokazuju da je iznos prihoda, kvaliteta života i razina dobrobiti \npojedinca u uskoj vezi s količinom naobrazbe. (...)\n\nSvima dostupno obrazovanje ne znači pružiti svima školsku zgradu i mogućnost \nda određeni broj godina sjede u školskim klupama, nego osiguranje jednakosti \nmogućnosti, jednakosti u pristupu i pravednosti u obrazovanju.\nwww.vecernji.hr (objavljeno 20. travnja 2018. godine)"}]
    },

      "2019_jesen": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [{heading:"Prosvjed zbog klimatskih promjena",text:"Nakon sudjelovanja na tribinama o klimatskim promjenama građani jedne županije \norganizirali su prosvjed kako bi izrazili svoje nezadovoljstvo lošom organizacijom \nodvoza i razvrstavanja otpada u svojoj županiji. Pisanje masovnih medija o \nprosvjedima potaknulo je i druge građane na informiranje, što je povećalo interes \nza sudjelovanjem građana u raspravama o razvrstavanju i odvozu otpada."},{heading:"Mreža za zaštitu životinja — javni performans",text:"Članovi udruga koje su se povezale u Mrežu za zaštitu životinja organizirali su javni \nperformans kako bi potaknuli propisivanje obvezatne trajne sterilizacije životinja i na \ntaj način spriječili nekontrolirano razmnožavanje životinja i njihovo odbacivanje."},{heading:"Promjene u obiteljskom životu kroz povijest",text:"Prije više od sto godina djecu su osim roditelja odgajale i čuvale bake, ujne, strine \ni ostala rodbina. Kad bi djeca odrasla, radila bi na zemlji sa svojim roditeljima i \nbrinula bi se za njih. Danas su obitelji neolokalne i dok roditelji rade, ulogu čuvanja \nnjihove djece preuzeli su vrtići, a brigu o starim i nemoćnim roditeljima starački \ndomovi."},{heading:"Tablica: BDP država i prihodi multinacionalnih poduzeća (2012.)",text:"Tablica 1. Usporedba bruto domaćega proizvoda pojedinih država i prihoda multinacionalnih poduzeća u 2012. godini\n\nDržava | BDP (mil. $) | Multinacionalno poduzeće | Prihodi (mil. $)\nBelgija | 487.674 | Royal Dutch Shell | 484.692\nArgentina | 474.954 | Exxon Mobil | 452.926\nAustrija | 398.594 | Wal-Mart Stores | 446.950\nJužna Afrika | 384.315 | BP | 386.463\nVenezuela | 382.424 | Sinopec Group | 375.214\nDanska | 303.527 | China National Petroleum | 352.338\nEgipat | 256.729 | State Grid | 259.142\nGrčka | 249.201 | Chevron | 245.621\nIzrael | 240.894 | ConocoPhillips | 237.727\nPakistan | 231.879 | Toyota Motor | 235.364\nPortugal | 212.720 | Total | 231.580\nIrak | 212.501 | Volkswagen | 221.551\nIrska | 212.501 | Japan Post Holding | 211.019\nČeška | 196.072 | Glencore International | 186.152\nRumunjska | 169.384 | Gazprom | 157.831\n\nGalović, T., 2017., Putovima krupnog kapitala i globalizacije, Ekonomski fakultet Sveučilišta u Rijeci, Rijeka, str. 64."},{heading:"Rudi Supek: Sociologija (odlomak iz hrestomatije)",text:"U društvenim kao i u živim tijelima povećanje mase obično prati i povećanje \nstrukture. I živa tijela i društva pored integracije, koja je primarna karakteristikama \nevolucije, u velikoj mjeri pokazuju i sekundarnu karakteristiku - diferencijaciju. (...) \nKako napredujemo od malih grupa prema većima, od jednostavnih složenima, \nod složenih dvostrukosloženima, sve su veće razlike među dijelovima. Društveni \nagregat, homogen dok je malen, svakim daljnjim povećanjem obično postaje i \nheterogeniji, a da bi dosegao velike razmjere, mora postati vrlo kompleksan. (...) \nU većim jednostavnim grupama obično nalazimo neku vrstu vodstva. (...) Prije \nnego što dostignu znatnije razmjere, skupine bez vodstva i bez ikakve uprave \nodvojene su i nisu koherentne. Međutim, kod agregata koji broje oko sto i više \nčlanova obično nalazimo jednostavno ili složeno upravno tijelo - jednog čovjeka \nili više ljudi koji polažu pravo na vlast što je vrše, koja je prirodna, nadnaravna ili i \njedno i drugo. (...) \nParalelno s povećanjem mase, do kojega dolazi ujedinjavanjem primarnih \ndruštvenih agregata u drugostepeni, javljaju se nove razlike među dijelovima.\n\nSupek, R., 1987., Herbert Spencer i biologizam u sociologiji, Naprijed, Zagreb, str. 154.–156."},{heading:"Potrošačka kultura i fetišizam robe",text:"Pojam potrošnje u međuvremenu se proširio na ukupnost svih djelovanja individua i \nkućanstava koji, kao potražitelji, nastupaju na tržištima roba i usluga. Pošto se konzumiranjem \npokušavaju zadovoljiti ne samo elementarne potrebe (glad, žeđ, zaštita, ljubav), nego i \nsloženije (priznanje, prestiž, kulturno sudjelovanje), konzumacija uključuje i sve akte kupovine \ni naturalne razmjene i poklone koji, također, mogu biti osnova za \u201etrošak\". Čak i kada se, \nprimjerice, samostalno proizvodi povrće u vlastitom vrtu, ili kroji i šije odjeća ili umjetnički \noblikuje predmet, u takvu je proizvodnju uvijek uključena neka vrsta kupovine, jer se koristi ili \nkupljeni alat ili znanje za čije je stjecanje utrošen novac.\n\n(....) Kupovina nekog tehničkog produkta (npr. auta, kompjutora, ali i turističkog aranžmana) \npodrazumijeva istodobno i akt \u201epodruštvljenja\" te da određena dobra i/ili predmeti pridonose \nosjećaju samosvijesti. Takva se dobra ne žele samo zbog neposredne korisnosti: njihovim \nznačenjem \u201eupravljaju druga a ne čisto ekonomska rasuđivanja\" (Becher, 1990, 226). Zato se \npotrošačko djelovanje promatra kao proces unutar kojeg su faze stvaranja motiva, dobijanja \ninformacija koje prethode zarađivanju, te diskursi koji pripremaju odluku za kupnju, društveno \nvažniji nego sami akti kupnje.\n\n(...) \u201eVidljivost potrošnje\" kao akt konzuma postaje važan element u osobnoj koncepciji stila \nživota (npr. kupnja kuće u određenom kvartu ili kupnja točno određenog modela automobila).\n\n(...) Trgovački centri, samoposluge, muzeji, tematski parkovi i organizirana turistička putovanja \nkonstruiraju konzumaciju i dokolicu kao iskustvo. Otud i organizacija umjetničkih izložbi u \nrobnim kućama te modnih revija u galerijama i muzejima.\n\n(...) Potrošnja postaje procesom koji uključuje akumulaciju spektakla te miješanje i šifri i \nkultura. Presudna postaje uloga medija putem kojih se potrošačima ne nameću više određeni \nstilovi, nego se izazivanjem želje za stilizacijom i estetizacijom života, potiče interes za stil \nuopće.\n\nTomić-Koludrović, I. i Leburić, A., 2002., Sociologija životnog stila: prema novoj metodološkoj strategiji, Naklada Jesenski i Turk, Zagreb., str. 27.–35."},{heading:"Majetić, F.: Grad u postindustrijsko doba",text:"Kao nova snaga ili pokretači razvoja gospodarski uspješnog grada u postindustrijsko doba \nističu se uslužne djelatnosti s velikom udjelom kreativnosti, znanja i informacija: proizvodnja \ni potrošnja kulture i zabave poput umjetnosti, mode, glazbe, turizma, ugostiteljstva ili brojnih \nmanifestacija te razne druge \u201ehigh-tech\u201d kreativne industrije (npr. softver dizajn, novi mediji, \ninformacijsko komunikacijske tehnologije) (Gospodini, 2006:312; Gospodini, 2007:4). Osim \nnekih od spomenutih usluga \u201etreće generacije\u201d (Hutton, 2000 prema Gospodini, 2006) gradove \nmogu jednako snažno pokretati i aktivnosti poput financijske industrije, raznih savjetovanja, \npravnih, računovodstvenih i sličnih usluga \u201eprve i druge generacije\u201d (Sassen, 2001; Gottdiener \ni Hutchinson, 2011). S transformacijom urbanih ekonomija mijenja se i poredak na globalnoj, \nregionalnoj i nacionalnoj ljestvici konkurentnosti gradova. \u201eZvijezde\u201d industrijskog doba \npoput New York Cityja, Londona ili Tokyja zadržavaju vodeće pozicije na svim razinama \ni u postindustrijsko doba; gradovi sa stručnom i kreativnom radnom snagom u danas \nvisokoprofitabilnim djelatnostima poput San Josea, Austina, Minneapolisa preuzimaju novu, \nznačajniju ulogu; nekadašnja središta industrijske proizvodnje poput Detroita, Manchestera, \nLiverpoola, gradova s područja Ruhra, Torina, ili Nagoye gube \u201estaru slavu\u201d, a neki od \nindustrijskih centara (npr. Varšava) uspijevaju se repozicionirati kao regionalna financijska ili \nsredišta neke druge propulzivne djelatnosti nove ekonomije.\nMajetić, F., 2014., Grad u postindustrijsko doba: važnija ekonomska obilježja suvremenog grada,"}]
    },
