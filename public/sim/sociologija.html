        return e("div",{key:q.id,className:"revitem "+cls},
          e("div",{style:{display:"flex",gap:10,alignItems:"flex-start"}},
            e("span",{style:{color:col,fontWeight:700,fontSize:14,minWidth:18}},ic),
            e("div",{style:{flex:1}},
              e("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:3,flexWrap:"wrap"}},
                e("span",{style:{fontSize:11,color:"var(--muted)"}},(i+1)+". "+TLBL[q.type]),
                !examMode&&q.topic&&e("span",{className:"topic-tag"},TOPIC_LABELS[q.topic]||q.topic),
                qTimes[q.id]&&e("span",{className:"time-badge "+(qTimes[q.id]>90?"slow":qTimes[q.id]<20?"fast":"")},"\u23f1 "+qTimes[q.id]+"s")
              ),
              e("div",{style:{fontSize:13,lineHeight:1.55,marginBottom:5}},q.q),
              ad&&e("div",{style:{fontSize:12,color:"var(--muted)"}},ad),
              ok===false&&q.type==="mc"&&e("div",{style:{fontSize:12,color:"var(--green)",marginTop:4}},"✓ Točno: "+q.sol.cl+" — "+q.opts[LL.indexOf(q.sol.cl)]),
              ok===false&&q.type==="ms"&&e("div",{style:{fontSize:12,color:"var(--green)",marginTop:4}},"✓ Točni: "+q.sol.cls.join(", ")),
              !isM&&hasKey(q)&&e(AnswerHelper,{q,show:true,autoExpand:false,onToggle:()=>{}})
            )
          )
        )
      })),
      e("div",{style:{marginTop:28,textAlign:"center",display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}},
        e("button",{className:"btn btn-g",onClick:onBack},"← Na početak"),
        !locked&&wrongAutoQ.length>0&&onPracticeErrors&&e("button",{
          className:"btn btn-red",
          style:{background:"var(--red-d)",color:"var(--red)",border:"1px solid rgba(196,48,48,.3)"},
          onClick:()=>onPracticeErrors(wrongAutoQ,exam)
        },"🔁 Vježbaj greške ("+wrongAutoQ.length+")"),
        e("button",{className:"btn btn-gold",onClick:()=>{onBack();setTimeout(()=>document.getElementById("exams")?.scrollIntoView({behavior:"smooth"}),100);}},
          "Pokušaj drugi ispit →")
      ),
      e("div",{style:{marginTop:32,paddingTop:24,borderTop:"1px solid var(--bdr)"}},
        e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:16}},"Podijeli rezultat"),
        e(ShareCard,{exam,pct,grade:g,gc,cor,total,userData:userData||{xp:0,streak:0,history:[]}})
      ),
      e("div",{style:{marginTop:8,paddingTop:24,borderTop:"1px solid var(--bdr)"}},
        e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:16}},"Sljedeći koraci"),
        e("div",{className:"next-steps"},
          e("div",{className:"next-step-card gold",onClick:onBack},e("span",{className:"nsc-ico"},"📄"),e("div",{className:"nsc-title",style:{color:"var(--gold)"}},"Drugi ispit"),e("div",{className:"nsc-desc"},"Probaj drugi rok i usporedi rezultate.")),
          e("div",{className:"next-step-card blue"},e("span",{className:"nsc-ico"},"🎯"),e("div",{className:"nsc-title",style:{color:"var(--blue)"}},"Practice Mode"),e("div",{className:"nsc-desc"},"Uvježbaj tipove pitanja gdje si najslabiji.")),
          e("div",{className:"next-step-card green"},e("span",{className:"nsc-ico"},"📊"),e("div",{className:"nsc-title",style:{color:"var(--green)"}},"Vidi napredak"),e("div",{className:"nsc-desc"},"Prati statistiku kroz sve riješene ispite."))
        )
      ),
      !locked&&(userData?.history?.length>0)&&e("div",{style:{marginTop:8}},
        e(AnalyticsPanel,{userData:userData||{},onStartExam:onBack})
      )
    )
  )
}


function Sim({exam,practice,examMode,timedPractice=false,onExit,onDone,userData,onPracticeErrors}){
  const QSX=exam.qs;
  // Nacrt se čita JEDNOM, pri montiranju — inicijalizator stanja se izvrši samo
  // tada, pa localStorage i Date.now() ne ulaze u svaki render.
  const draftKey=socDraftKey(exam.key,examMode,practice,timedPractice);
  const[draft]=useState(()=>socReadDraft(draftKey));
  const[cur,setCur]=useState(()=>(draft&&draft.cur<QSX.length)?draft.cur:0);
  const[answers,setAnswers]=useState(()=>(draft&&draft.answers)||{});
  const[rev,setRev]=useState({});
  const[flag,setFlag]=useState({});
  const[bookmarks,setBookmarks]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("discere_bookmarks")||"{}");}catch{return {};}
  });
  const[visited,setVisited]=useState({0:true});
  const[modal,setModal]=useState(false);
  const[done,setDone]=useState(false);
  const[qTimes,setQTimes]=useState(()=>(draft&&draft.qTimes)||{});
  // Apsolutan trenutak isteka, ne preostale sekunde (vidi socReadDraft).
  const[deadline,setDeadline]=useState(()=>(draft&&draft.deadline)||null);
  // Predaja na poslužitelj: stanje, greška i odbrojavanje do ponovnog pokušaja.
  const[serverScore,setServerScore]=useState(null);
  const[submitting,setSubmitting]=useState(false);
  const[submitError,setSubmitError]=useState(null);
  const[retryIn,setRetryIn]=useState(0);
  const attemptIdRef=React.useRef((draft&&draft.attemptId)||null);
  const submitRef=React.useRef(null);
  const doneCalledRef=React.useRef(false);
  // `submitting` je stanje i ne mijenja se sinkrono, a istek roka zna okinuti
  // predaju iz DVA efekta u istom commitu (useTimer.onExpire i čuvar roka).
  // Ref je jedina brava koja drži unutar istog tika.
  const submittingRef=React.useRef(false);
  // Vremena po pitanju u trenutku predaje (uključujući zadnje pitanje).
  const finalQTimesRef=React.useRef(null);
  const[shownAnswers,setShownAnswers]=useState({});
  const[conf,setConf]=useState({});
  const[timerAlert,setTimerAlert]=useState(null);
  const[flashRed,setFlashRed]=useState(false);
  const[kbHint,setKbHint]=useState(false);
  const qStart=React.useRef(Date.now());
  const[qElapsed,setQElapsed]=React.useState(0);

  // Live timer po pitanju
  React.useEffect(()=>{
    setQElapsed(0);
    qStart.current=Date.now();
    if(!practice&&!timedPractice) return; // samo u vježbanju
    const id=setInterval(()=>{
      setQElapsed(Math.round((Date.now()-qStart.current)/1000));
    },1000);
    return ()=>clearInterval(id);
  },[cur]);

  // Persist bookmarks
  function toggleBookmark(qid){
    setBookmarks(prev=>{
      const next={...prev};
      const key=exam.key+"_"+qid;
      if(next[key]) delete next[key];
      else next[key]={qid,examKey:exam.key,examLabel:exam.year+" "+exam.label,q:QSX.find(x=>x.id===qid)?.q?.slice(0,80)||""};
      localStorage.setItem("discere_bookmarks",JSON.stringify(next));
      return next;
    });
  }

  // Topic coverage progress
  const topicCoverage = React.useMemo(()=>{
    const topics={};
    QSX.forEach(q=>{
      const t=q.topic||"ostalo";
      if(!topics[t]) topics[t]={total:0,answered:0};
      topics[t].total++;
      if(hasAns(answers[q.id])) topics[t].answered++;
    });
    return topics;
  },[answers, QSX]);
  const coveredTopics=Object.values(topicCoverage).filter(t=>t.answered===t.total&&t.total>0).length;
  const totalTopics=Object.keys(topicCoverage).length;

  const q=QSX[cur];

  // Keyboard shortcuts
  React.useEffect(()=>{
    if(done) return;
    function onKey(e){
      // Don't trigger when typing in input/textarea
      if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT") return;
      const curQ=QSX[cur];
      const curIsRev=!!rev[curQ?.id]||done;
      // A/B/C/D — select MC option
      if(curQ.type==="mc"&&!curIsRev&&["a","b","c","d"].includes(e.key.toLowerCase())){
        const idx=["a","b","c","d"].indexOf(e.key.toLowerCase());
        if(idx<(curQ.opts||[]).length){
          setAnswers(p=>({...p,[curQ.id]:e.key.toUpperCase()}));
          if(practice) setShownAnswers(p=>({...p,[curQ.id]:true}));
        }
        return;
      }
      // Enter / Space — confirm/check or go next if already answered
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        if(practice&&!curIsRev&&hasKey(curQ)&&hasAns(answers[curQ.id])){
          setRev(p=>({...p,[curQ.id]:true}));
          const result = chk(curQ, answers[curQ.id]);
          if(result===true) window._playSound?.("correct");
          else if(result===false) window._playSound?.("wrong");
        } else if(cur<QSX.length-1){
          recordTime(cur);const nc=cur+1;setCur(nc);setVisited(v=>({...v,[nc]:true}));
          if(!practice)setShownAnswers({});
        }
        return;
      }
      // → ArrowRight — next question
      if(e.key==="ArrowRight"&&cur<QSX.length-1){
        e.preventDefault();
        recordTime(cur);const nc=cur+1;setCur(nc);setVisited(v=>({...v,[nc]:true}));
        if(!practice)setShownAnswers({});
        return;
      }
      // ← ArrowLeft — prev question
      if(e.key==="ArrowLeft"&&cur>0){
        e.preventDefault();
        recordTime(cur);const nc=cur-1;setCur(nc);setVisited(v=>({...v,[nc]:true}));
        if(!practice)setShownAnswers({});
        return;
      }
      // B — bookmark
      if(e.key==="b"||e.key==="B"){
        toggleBookmark(curQ.id);
        return;
      }
      // F — flag
      if(e.key==="f"||e.key==="F"){
        setFlag(p=>({...p,[curQ.id]:!p[curQ.id]}));
        return;
      }
      // G — pojmovnik
      if(e.key==="g"||e.key==="G"){
        setShowGlossary(h=>!h);
        return;
      }
      // ? — show keyboard hint
      if(e.key==="?"){
        setKbHint(h=>!h);
      }
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[cur,answers,rev,done,QSX,practice]);

  const isRev=!!rev[q?.id]||done;

  function onTimerWarn(sLeft){
    if(examMode){setTimerAlert(sLeft);setFlashRed(true);setTimeout(()=>setFlashRed(false),500);}
  }
  function onTimerExpire(){
    if(done)return;
    if(examMode)setTimerAlert(0);
    // Istekao rok → AUTOMATSKA predaja. Dosad je ispit čekao klik, pa je
    // zatvaranje kartice u toj minuti značilo izgubljen pokušaj.
    if(timedRun&&submitRef.current)submitRef.current();
  }
  function recordTime(fromIdx){
    const elapsed=Math.round((Date.now()-qStart.current)/1000);
    const qid=QSX[fromIdx].id;
    setQTimes(t=>({...t,[qid]:(t[qid]||0)+elapsed}));
    qStart.current=Date.now();
  }
  // Trajanje je fiksno, ali PREOSTALO vrijeme dolazi iz nacrta kad on nosi rok —
  // inače osvježavanje stranice vrati pun timer i simulacija se produljuje.
  const TOTAL_SEC=examMode?5400:timedPractice?5400:practice?999999:7200;
  const timedRun=!!(examMode||timedPractice);
  const[initialSec]=useState(()=>{
    const d=(draft&&draft.deadline)||null;
    return d?Math.max(0,Math.round((d-Date.now())/1000)):TOTAL_SEC;
  });
  const timer=useTimer(initialSec,!done,onTimerExpire,onTimerWarn);
  const setA=v=>{
    setAnswers(p=>({...p,[q.id]:v}));
    if(practice) setShownAnswers(p=>({...p,[q.id]:true}));
  };
  const answered=Object.keys(answers).filter(k=>hasAns(answers[k])).length;
  const unanswered=QSX.filter(x=>!hasAns(answers[x.id])).length;
  function getDot(i){
    const qq=QSX[i],a=answers[qq.id];
    if(done){if(qq.type==="sa"||qq.type==="es"||chk(qq,a)===null)return"cman";return chk(qq,a)===true?"cok":"cbad"}
    if(i===cur)return"cur";
    if(flag[qq.id])return"flag";
    if(hasAns(a))return"ans";
    if(visited[i])return"skip";
    return""
  }

  /* ── PREDAJA ───────────────────────────────────────────────────────────────
     Pravi ispit ocjenjuje POSLUŽITELJ (ADR-001, ODLUKA 2): predaja UVIJEK ide
     porukom DISCERE_SUBMIT, a konačan rezultat i povijest dolaze iz DISCERE_GRADE.
     Virtualne sesije (greške, bookmarci, filter, dnevni izazov) sastavljene su od
     pitanja iz više ispita i na poslužitelju ne postoje, pa ostaju lokalne — a
     ondje su ključevi ionako prisutni jer su ti ekrani Standard sadržaj. */
  const isRealExam=SOC_REAL_EXAM.test(exam.key||"");
  /* Prekidač „smije li klijent prikazati VLASTITU ocjenu“:
       • virtualne sesije nemaju `keys` (nije ih isporučila ruta) → gleda se ima
         li ijedno pitanje ključ;
       • ispit s rute smije se ocijeniti lokalno SAMO uz keys:"full". Kod
         keys:"partial" rezultat ne bi bio nepotpun nego KRIV: pitanju bez ključa
         chk vraća null, pa ispada iz brojnika, a ostaje u nazivniku. */
  const localKeys=exam.keys?exam.keys==="full":QSX.some(hasKey);

  function scoreAll(){
    const map={};
    QSX.forEach(x=>{map[String(x.id)]=(x.type==="sa"||x.type==="es")?null:chk(x,answers[x.id]);});
    return map;
  }
  function localAggregate(){
    const autoQ2=QSX.filter(x=>x.type!=="sa"&&x.type!=="es");
    let cor2=0;autoQ2.forEach(x=>{if(chk(x,answers[x.id])===true)cor2++;});
    const pct2=autoQ2.length?Math.round(cor2/autoQ2.length*100):0;
    return {pct:pct2,grade:grade(pct2),cor:cor2,total:autoQ2.length,bodovi:null,
      xpGain:calcXpGain(pct2,autoQ2.length),scores:scoreAll()};
  }
  /** Razrada po tipu pitanja iz mape ✓/✗ — ista bez obzira odakle mapa dolazi. */
  function breakdownFrom(scoreMap){
    const types2=[
      {key:"mc",label:"Jedan odgovor"},{key:"ms",label:"Više odgovora"},
      {key:"mat",label:"Povezivanje"},{key:"fb",label:"Dopunjavanje"}
    ];
    return types2.map(t=>{
      const tqs=QSX.filter(x=>x.type===t.key);
      return{...t,correct:tqs.filter(x=>scoreMap[String(x.id)]===true).length,total:tqs.length};
    }).filter(t=>t.total>0);
  }

  /** Rezultat je konačan: povijest, XP i nacrt se diraju TOČNO JEDNOM. */
  function finalize(result,serverSaved){
    if(doneCalledRef.current||!result)return;
    doneCalledRef.current=true;
    socClearDraft(draftKey);
    const scoreMap=(result.scores&&typeof result.scores==="object")?result.scores:{};
    if(onDone)onDone({
      pct:result.pct,grade:result.grade,cor:result.cor,total:result.total,
      examKey:exam.key,examLabel:exam.year+". "+exam.label,
      breakdown:breakdownFrom(scoreMap),
      qTimes:finalQTimesRef.current||qTimes,answers,examMode,
      // Otisak pokušaja putuje s rezultatom: kad redak mora upisati roditelj
      // (serverSaved===false), jedinstveni indeks (user_id, attempt_id) jedini
      // sprječava drugi redak za pokušaj koji je ruta ipak ocijenila i upisala.
      attemptId:attemptIdRef.current,
      scores:scoreMap,xpGain:result.xpGain,serverSaved
    });
  }

  function submit(){
    if(submittingRef.current||doneCalledRef.current)return;
    // Vrijeme zadnjeg pitanja se mora uračunati SINKRONO: setQTimes je asinkron,
    // pa bi predaja inače nosila vrijeme bez posljednjeg zadatka. Kod ponovnog
    // pokušaja (`done` je već true) ne dodaje se ništa — inače bi se vrijeme
    // provedeno na ekranu rezultata pripisalo zadnjem pitanju.
    const elapsed=done?0:Math.max(0,Math.round((Date.now()-qStart.current)/1000));
    const lastQid=QSX[cur]&&QSX[cur].id;
    const finalQTimes=lastQid?Object.assign({},qTimes,{[lastQid]:(qTimes[lastQid]||0)+elapsed}):qTimes;
    finalQTimesRef.current=finalQTimes;
    setQTimes(finalQTimes);
    qStart.current=Date.now();
    setModal(false);setTimerAlert(null);

    const local=localKeys?localAggregate():null;

    if(!isRealExam){
      if(local)setServerScore(local);
      setDone(true);window.scrollTo(0,0);
      finalize(local,undefined);
      return;
    }

    // Otisak pokušaja nastaje PRIJE setDone(true) i odmah ide u nacrt. Efekt koji
    // nacrt inače piše izlazi na `done`, pa bi otisak stvoren kasnije ostao samo u
    // memoriji: nakon osvježavanja stranice ista bi predaja dobila NOVI attemptId,
    // ruta je ne bi prepoznala kao istu (findPriorAttempt traži po attempt_id),
    // potrošila bi još jedno mjesto dnevnog budžeta i upisala drugi redak.
    if(!attemptIdRef.current)attemptIdRef.current=socNewAttemptId();
    if(draftKey)socWriteDraft(draftKey,{answers,qTimes:finalQTimes,cur,deadline,
      attemptId:attemptIdRef.current});

    // Ekran rezultata se otvara odmah: s lokalnom ocjenom ako ključevi postoje,
    // inače u stanju čekanja (Results prikazuje „Ocjenjujemo…“ + ponovni pokušaj).
    if(local)setServerScore(prev=>prev||local);
    setDone(true);window.scrollTo(0,0);

    const spent=Object.keys(finalQTimes).reduce((a,k)=>a+(Number(finalQTimes[k])||0),0);
    const durationSec=Math.min(86400,Math.max(0,Math.round(
      timedRun?TOTAL_SEC-((timer&&timer.s)||0):spent)));

    submittingRef.current=true;
    setSubmitting(true);setSubmitError(null);
    socSubmitToParent({examKey:exam.key,answers,qTimes:finalQTimes,examMode,
      attemptId:attemptIdRef.current,durationSec}).then(function(result){
      submittingRef.current=false;
      setSubmitting(false);setRetryIn(0);setSubmitError(null);
      if(result){setServerScore(result);finalize(result,true);return;}
      // Ruta je odgovorila, ali bez upotrebljivog rezultata. S ključevima se
      // pokušaj spašava lokalno; bez njih ekran mora ponuditi ponovni pokušaj,
      // a ne ostati zauvijek na „Ocjenjujemo…“.
      if(local){finalize(local,false);return;}
      setSubmitError({message:"Ocjenjivanje nije vratilo rezultat. Pokušaj ponovno.",status:0,local:false});
    },function(err){
      submittingRef.current=false;
      setSubmitting(false);
      const status=(err&&err.status)||0;
      const wait=status===429?((err&&err.retryAfterSec)||0):0;
      setSubmitError({message:(err&&err.message)||"Slanje rezultata nije uspjelo.",status,
        local:!!local});
      // Razmak od 60 s nije odbijen pokušaj nego „pričekaj“: odbrojimo i pustimo
      // korisnika da pošalje ISTI attemptId, koji ruta prepozna kao istu predaju.
      if(wait>0&&wait<=600)setRetryIn(wait);
      // S punim ključevima rezultat postoji i bez poslužitelja — pokušaj se ne
      // smije izgubiti zbog mreže. Redak u sim_progress tada upisuje roditelj
      // (serverSaved === false). Bez ključeva rezultat može dati samo poslužitelj,
      // pa se povijest NE piše i ekran nudi ponovni pokušaj.
      if(local)finalize(local,false);
    });
  }

  // Predaja iz efekata (istek roka) mora vidjeti NAJNOVIJI submit — zatvaranje
  // nad starim renderom slalo bi stare odgovore.
  React.useEffect(()=>{submitRef.current=submit;});

  // Rok se postavlja čim simulacija počne i od tada živi u nacrtu; ako je pri
  // montiranju već istekao (osvježavanje nakon isteka), predaja ide odmah.
  React.useEffect(()=>{
    if(!timedRun||!draftKey||done)return undefined;
    if(!deadline){setDeadline(Date.now()+TOTAL_SEC*1000);return undefined;}
    const left=deadline-Date.now();
    if(left<=0){if(submitRef.current)submitRef.current();return undefined;}
    const id=setTimeout(()=>{if(submitRef.current)submitRef.current();},left);
    return ()=>clearTimeout(id);
  },[timedRun,draftKey,deadline,done]);

  // Odgovori, vremena, rok i tekuće pitanje preživljavaju osvježavanje stranice;
  // briše ih tek konačan rezultat (finalize) ili istek TTL-a.
  React.useEffect(()=>{
    if(!draftKey||done)return;
    if(!Object.keys(answers).length&&!Object.keys(qTimes).length&&!deadline)return;
    socWriteDraft(draftKey,{answers,qTimes,cur,deadline,attemptId:attemptIdRef.current});
  },[draftKey,answers,qTimes,cur,deadline,done]);

  // Odbrojavanje do ponovne predaje (429 s razmakom od 60 s).
  React.useEffect(()=>{
    if(retryIn<=0)return undefined;
    const t=setTimeout(()=>setRetryIn(n=>(n>0?n-1:0)),1000);
    return ()=>clearTimeout(t);
  },[retryIn]);

  if(done)return e(Results,{exam,answers,onBack:onExit,userData:userData||{},
    qTimes:finalQTimesRef.current||qTimes,conf,examMode,onPracticeErrors,
    score:serverScore,submitting,submitError,retryIn,
    onRetrySubmit:()=>{setSubmitError(null);submit();}});
  const tc=timer&&(timer.s<600?"danger":timer.s<1800?"warn":"");
  const bkKey=exam.key+"_"+q.id;
  const isBookmarked=!!bookmarks[bkKey];

  return e(Fragment,null,
    flashRed&&e("div",{className:"timer-warning-overlay"}),

    // Keyboard shortcut hint modal
    kbHint&&e("div",{className:"mlov",onClick:()=>setKbHint(false)},
      e("div",{className:"mlbox",style:{maxWidth:360}},
        e("h3",{style:{marginBottom:16}},"⌨️ Tipkovnički prečaci"),
        [
          ["A / B / C / D","Odaberi odgovor (MC)"],
          ["Enter ili Space","Provjeri / Sljedeće pitanje"],
          ["→ / ←","Sljedeće / Prethodno pitanje"],
          ["B","Bookmark pitanje"],
          ["F","Označi (flag) pitanje"],
          ["G","Otvori / zatvori pojmovnik"],
          ["?","Prikaži/sakrij ove prečace"],

function PDFReportScreen({userData, onBack}){
  const history = Array.isArray(userData?.history) ? userData.history : [];
  const errors = Object.values(userData?.errorTracker||{})
    .sort((a,b)=>b.count-a.count).slice(0,8);
  const totalExams = history.length;
  const avgPct = totalExams
    ? Math.round(history.reduce((s,h)=>s+h.pct,0)/totalExams)
    : 0;
  const lastFive = history.slice(-5);
  const trend = lastFive.length>=2
    ? Math.round(lastFive[lastFive.length-1].pct - lastFive[0].pct)
    : null;

  // Teme stats
  const topicAcc = {};
  history.forEach(h=>{
    if(!h.topic_breakdown) return;
    Object.entries(h.topic_breakdown).forEach(([t,d])=>{
      if(!topicAcc[t]) topicAcc[t]={correct:0,total:0};
      topicAcc[t].correct+=d.correct||0;
      topicAcc[t].total+=d.total||0;
    });
  });
  const topicRows = Object.entries(topicAcc)
    .map(([t,v])=>({t,pct:v.total?Math.round(v.correct/v.total*100):null,total:v.total}))
    .filter(r=>r.pct!==null)
    .sort((a,b)=>a.pct-b.pct);

  const weakTopics = topicRows.filter(r=>r.pct<60).slice(0,5);
  const strongTopics = topicRows.filter(r=>r.pct>=70).slice(-3).reverse();

  const today = new Date().toLocaleDateString("hr",{day:"numeric",month:"long",year:"numeric"});

  function doPrint(){
    window.print();
  }

  return e("div",{style:{maxWidth:700,margin:"0 auto",padding:"24px 20px 60px"}},
    // Nav (sakriven pri ispisu)
    e("div",{className:"nav no-print"},
      e("button",{className:"btn btn-g",style:{fontSize:13,padding:"6px 12px"},onClick:onBack},"← Natrag"),
      e("span",{className:"ntitle"},"📄 PDF Izvještaj"),
      e("button",{
        className:"btn btn-gold no-print",
        style:{fontSize:13,padding:"6px 16px"},
        onClick:doPrint
      },"🖨️ Ispiši / Spremi PDF")
    ),

    // PDF sadržaj
    e("div",{className:"pdf-report",style:{
      background:"var(--s1)",border:"1px solid var(--bdr)",borderRadius:"var(--rr)",
      padding:"32px",marginTop:16,boxShadow:"var(--shadow)"
    }},
      // Zaglavlje
      e("div",{style:{
        display:"flex",justifyContent:"space-between",alignItems:"flex-start",
        borderBottom:"2px solid var(--gold)",paddingBottom:16,marginBottom:24

function TopicFilterScreen({onStart, onBack}){
  const ALL_TOPICS = Object.keys(TOPIC_LABELS);
  const ALL_TYPES  = [
    {key:"mc",  label:"Jedan odgovor",   color:"sel-blue"},
    {key:"ms",  label:"Više odgovora",   color:"sel-blue"},
    {key:"mat", label:"Povezivanje",     color:"sel-blue"},
    {key:"fb",  label:"Dopunjavanje",    color:"sel-blue"},
    {key:"sa",  label:"Kratki odgovor",  color:"sel-green"},
    {key:"es",  label:"Esej",            color:"sel-green"},
  ];
  const ALL_YEARS = [2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];

  const[selTopics, setSelTopics] = useState(new Set(ALL_TOPICS));
  const[selTypes,  setSelTypes]  = useState(new Set(["mc","ms","mat","fb","sa"]));
  const[selYears,  setSelYears]  = useState(new Set(ALL_YEARS));
  const[showPreview, setShowPreview] = useState(false);

  function tog(set, setFn, val){
    setFn(prev=>{
      const next=new Set(prev);
      next.has(val)?next.delete(val):next.add(val);
      return next;
    });
  }
  function togAll(set, setFn, all){
    setFn(set.size===all.length ? new Set() : new Set(all));
  }

  const ALL_SEASONS = ["ljeto","jesen"];
  const[selSeasons, setSelSeasons] = useState(new Set(ALL_SEASONS));

  // Compute matching questions from ALL exams
  const matchingQs = React.useMemo(()=>{
    const qs = [];
    Object.values(EXAMS).forEach(exam=>{
      if(!selYears.has(exam.year)) return;
      if(!selSeasons.has(exam.season)) return;
      exam.qs.forEach(q=>{
        if(!selTopics.has(q.topic||"ostalo")) return;
        if(!selTypes.has(q.type)) return;
        qs.push({...q, _examKey:exam.key, _examYear:exam.year, _examLabel:exam.label});
      });
    });
    return qs;
  },[selTopics, selTypes, selYears, selSeasons]);

  // Shuffle for practice
  function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

  function startSession(){
    if(matchingQs.length===0) return;
    const shuffled = shuffle(matchingQs).slice(0,60); // max 60
    // Build a virtual "exam" object
    const virtualExam = {
      key: "filter_session",
      year: "Filter",
      season: "session",
      label: "Tematska sesija",
      qs: shuffled
    };
    onStart(virtualExam);
  }

  const typeStats = {};
  matchingQs.forEach(q=>{ typeStats[q.type]=(typeStats[q.type]||0)+1; });

  return e(Fragment, null,
    e("div",{className:"nav"},
      e("button",{className:"btn btn-g",style:{fontSize:13,padding:"6px 12px"},onClick:onBack},"← Natrag"),
      e("span",{className:"ntitle"},"Vježbaj po temi")
    ),
    e("div",{className:"filter-screen"},

      e("div",{className:"filter-preview"},
        e("div",{className:"filter-preview-count"},matchingQs.length),
        e("div",{className:"filter-preview-info"},
          e("div",{className:"filter-preview-title"},
            matchingQs.length===0?"Nema pitanja za odabrane filtere":
            "Pitanja pronađena"
          ),
          e("div",{className:"filter-preview-sub"},
            matchingQs.length>0&&Object.entries(typeStats).map(([t,n])=>
              `${TLBL[t]}: ${n}`).join(" · ")
          )
        ),
        e("button",{
          className:"btn btn-gold",
          disabled:matchingQs.length===0,
          onClick:startSession,
          style:{whiteSpace:"nowrap"}
        },"▶ Pokreni "+Math.min(matchingQs.length,60)+" pitanja")
      ),

      e("div",{className:"filter-section"},
        e("div",{className:"filter-section-title"},"Teme"),
        e("div",{className:"filter-chips"},
          e("div",{
            className:"filter-chip all"+(selTopics.size===ALL_TOPICS.length?" sel":""),
            onClick:()=>togAll(selTopics,setSelTopics,ALL_TOPICS)
          },"Sve teme"),
          ALL_TOPICS.map(t=>e("div",{
            key:t,
            className:"filter-chip"+(selTopics.has(t)?" sel":""),
            onClick:()=>tog(selTopics,setSelTopics,t)
          },TOPIC_LABELS[t]))
        )
      ),

      e("div",{className:"filter-section"},
        e("div",{className:"filter-section-title"},"Vrsta pitanja"),
        e("div",{className:"filter-chips"},
          e("div",{
            className:"filter-chip all"+(selTypes.size===ALL_TYPES.length?" sel":""),
            onClick:()=>togAll(selTypes,setSelTypes,ALL_TYPES.map(t=>t.key))
          },"Sve vrste"),
          ALL_TYPES.map(t=>e("div",{
            key:t.key,
            className:"filter-chip"+(selTypes.has(t.key)?" "+t.color:""),
            onClick:()=>tog(selTypes,setSelTypes,t.key)
          },t.label))
        )
      ),

      e("div",{className:"filter-section"},
        e("div",{className:"filter-section-title"},"Ispitni rok"),
        e("div",{className:"filter-chips"},
          e("div",{
            className:"filter-chip all"+(selSeasons.size===ALL_SEASONS.length?" sel":""),
            onClick:()=>togAll(selSeasons,setSelSeasons,ALL_SEASONS)
          },"Oba roka"),
          e("div",{
            className:"filter-chip"+(selSeasons.has("ljeto")?" sel":""),
            onClick:()=>tog(selSeasons,setSelSeasons,"ljeto")
          },"☀️ Ljetni"),
          e("div",{
            className:"filter-chip"+(selSeasons.has("jesen")?" sel":""),
            onClick:()=>tog(selSeasons,setSelSeasons,"jesen")
          },"🍂 Jesenski")
        )
      ),

      e("div",{className:"filter-section"},
        e("div",{className:"filter-section-title"},"Ispitna godina"),
        e("div",{className:"filter-chips"},
          e("div",{
            className:"filter-chip all"+(selYears.size===ALL_YEARS.length?" sel":""),
            onClick:()=>togAll(selYears,setSelYears,ALL_YEARS)
          },"Sve godine"),
          ALL_YEARS.map(y=>e("div",{
            key:y,
            className:"filter-chip"+(selYears.has(y)?" sel":""),
            onClick:()=>tog(selYears,setSelYears,y)
          },y+"."))
        )
      ),

      matchingQs.length>0&&e("div",{className:"filter-section"},
        e("div",{
          className:"filter-section-title",
          style:{cursor:"pointer",userSelect:"none"},
          onClick:()=>setShowPreview(p=>!p)
        },"Pregled pitanja ("+(showPreview?"sakrij":"prikaži")+")"),
        showPreview&&e("div",{className:"filter-question-preview"},
          matchingQs.slice(0,20).map((q,i)=>e("div",{key:i,className:"fqp-item"},
            e("span",{className:"fqp-badge "+(TBDG[q.type]||"b-mc")},TLBL[q.type]),
            e("span",null,q.q.slice(0,90)+(q.q.length>90?"...":""))
          )),
          matchingQs.length>20&&e("div",{style:{fontSize:11,color:"var(--muted)",padding:"6px 0"}},
            "...i još "+(matchingQs.length-20)+" pitanja")
        )
      )
    )
  );
}

function generateVirtualExam(){
  // Generiraj virtualni ispit: ~40 pitanja, proporcionalna distribucija tipova
  // kao pravi NCVVO ispit (MC ~14, MS ~9, MAT ~4, FB ~4, SA ~4, ES ~5)
  const targets = {mc:14, ms:9, mat:4, fb:4, sa:4, es:5};
  const pools = {mc:[], ms:[], mat:[], fb:[], sa:[], es:[]};

  Object.values(EXAMS).forEach(exam=>{
    exam.qs.forEach(q=>{
      if(pools[q.type]) pools[q.type].push({...q, _examKey:exam.key});
    });
  });

  // Shuffle svaki pool
  Object.values(pools).forEach(pool=>pool.sort(()=>Math.random()-.5));

  const qs = [];
  Object.entries(targets).forEach(([type, n])=>{
    qs.push(...(pools[type]||[]).slice(0, n));
  });

  // Remixaj finale
  qs.sort(()=>Math.random()-.5);

  // Numeriraj id-eve redom
  qs.forEach((q,i)=>{ q.id = i+1; });

  return {
    key: "virtual_"+Date.now(),
    year: new Date().getFullYear(),
    season: "ljeto",
    label: "Virtualni ispit",
    qs
  };
}

const SRS_KEY = "disc_soc_srs";

function srsLoad(){
  try{ return JSON.parse(localStorage.getItem(SRS_KEY)||"{}"); }catch{ return {}; }
}
function srsSave(data){
  try{ localStorage.setItem(SRS_KEY, JSON.stringify(data)); }catch{}
}

// Broj dana od Unix epohe (today_ord) i brojač dospjelih kartica bez banke
// (socSrsDueCount) žive uz manifest, jer ih treba i Home prije ijednog dohvata.

// SM-2: ažuriraj karticu nakon odgovora
// quality: 0=pogrešno, 1=točno ali teško, 2=točno lako
function sm2Update(card, quality){
  const ef = Math.max(1.3, (card.ef||2.5) + 0.1 - (2-quality)*(0.08+(2-quality)*0.02));
  let interval;
  if(quality === 0){
    interval = 1;
  } else if(!card.interval || card.interval < 1){
    interval = 1;
  } else if(card.interval === 1){
    interval = 6;
  } else {
    interval = Math.round(card.interval * ef);
  }
  return { ef, interval, due: today_ord() + interval, reps: (card.reps||0)+1 };
}

// Nađi sva pitanja koja su danas na redu (ili još nikad nisu viđena).
// TRAŽI BANKU — smije se zvati tek iza withAllExams (SRS ekran). Za brojku na
// Home ekranu, koji se crta prije dohvata, postoji socSrsDueCount uz manifest.
function getSrsDueCards(srsData){
  const tod = today_ord();
  const allMC = [];
  Object.values(EXAMS).forEach(exam=>{
    exam.qs.forEach(q=>{
      if(q.type!=="mc") return;
      const key = exam.key+"__"+q.id;
      const card = srsData[key];
      // Nova kartica (nikad viđena) ili dospjela
      if(!card || card.due <= tod){
        allMC.push({...q, _examKey:exam.key, _srsKey:key, _card:card||null});
      }
    });
  });
  // Prioritet: dospjele stare (po due ASC) > nove
  const overdue = allMC.filter(q=>q._card).sort((a,b)=>(a._card.due||0)-(b._card.due||0));
  const newCards = allMC.filter(q=>!q._card).sort(()=>Math.random()-.5);
  return [...overdue, ...newCards];
}

function nextMaturaSoc(){
  var rokovi=[{m:5,d:1,label:"ljetnog roka"},{m:7,d:20,label:"jesenskog roka"}];
  var now=new Date(); now.setHours(0,0,0,0);
  var yr=now.getFullYear(); var cands=[];
  rokovi.forEach(function(r){ cands.push({t:new Date(yr,r.m,r.d),label:r.label}); cands.push({t:new Date(yr+1,r.m,r.d),label:r.label}); });
  cands.sort(function(a,b){return a.t-b.t;});
  var next=cands.find(function(c){return c.t>=now;})||cands[0];
  return {days:Math.round((next.t-now)/86400000),label:next.label};
}

function FlashcardScreen({onBack}){
  const[topicFilter,setTopicFilter]=useState("sve");
  const[examFilter,setExamFilter]=useState("sve");
  const[cards,setCards]=useState(null);
  const[cur,setCur]=useState(0);
  const[flipped,setFlipped]=useState(false);
  const[known,setKnown]=useState([]);
  const[unknown,setUnknown]=useState([]);
  const[done,setDone]=useState(false);

  // Build flashcard pool from all MC questions with exp
  const allCards=React.useMemo(()=>{
    const pool=[];
    Object.values(EXAMS).forEach(exam=>{
      exam.qs.forEach(q=>{
        if((q.type==="mc"||q.type==="sa")&&(q.exp||q.sol?.ans)){
          pool.push({...q,_examKey:exam.key,_examYear:exam.year,_examLabel:exam.label});
        }
      });
    });
    return pool;
  },[]);

  const allTopics=[...new Set(allCards.map(c=>c.topic))].sort();
  const allYears=[...new Set(allCards.map(c=>c._examYear))].sort((a,b)=>b-a);

  function buildDeck(){
    let pool=[...allCards];
    if(topicFilter!=="sve") pool=pool.filter(c=>c.topic===topicFilter);
    if(examFilter!=="sve") pool=pool.filter(c=>String(c._examYear)===examFilter);
    // Shuffle
    pool.sort(()=>Math.random()-.5);
    setCards(pool.slice(0,40));
    setCur(0);
    setFlipped(false);
    setKnown([]);
    setUnknown([]);
    setDone(false);
  }

  function handleKnow(knowIt){
    const card=cards[cur];
    if(knowIt) setKnown(k=>[...k,card]);
    else setUnknown(u=>[...u,card]);
    setFlipped(false);
    if(cur+1>=cards.length) setDone(true);
    else setCur(c=>c+1);
  }

  function restart(onlyUnknown=false){
    const pool=onlyUnknown?[...unknown].sort(()=>Math.random()-.5):[...cards].sort(()=>Math.random()-.5);
    setCards(pool);
    setCur(0);setFlipped(false);setKnown([]);setUnknown([]);setDone(false);
  }

  if(!cards) return e(Fragment,null,
    e("div",{className:"nav"},
      e("button",{className:"btn btn-g",style:{fontSize:13,padding:"6px 12px"},onClick:onBack},"← Natrag"),
      e("span",{className:"ntitle"},"🃏 Flashcards")
    ),
    e("div",{style:{maxWidth:600,margin:"0 auto",padding:"32px 20px"}},
      e("div",{style:{textAlign:"center",marginBottom:32}},
        e("div",{style:{fontSize:48,marginBottom:12}},"🃏"),
        e("h2",{style:{fontFamily:"var(--fh)",marginBottom:8}},"Flashcard ponavljanje"),
        e("p",{style:{color:"var(--muted)",fontSize:14}},"Brzo ponavljanje pojmova. Kartica — odgovor — znam/ne znam.")
      ),
      e("div",{style:{background:"var(--s1)",border:"1px solid var(--bdr)",borderRadius:"var(--rr)",padding:"24px",marginBottom:20}},
        e("div",{style:{marginBottom:16}},
          e("div",{style:{fontSize:12,fontWeight:700,color:"var(--muted)",marginBottom:8,textTransform:"uppercase",letterSpacing:".06em"}},"Tema"),
          e("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
            e("button",{className:"filter-chip"+(topicFilter==="sve"?" active":""),onClick:()=>setTopicFilter("sve")},"Sve teme"),
            allTopics.map(t=>e("button",{key:t,className:"filter-chip"+(topicFilter===t?" active":""),onClick:()=>setTopicFilter(t)},TOPIC_LABELS[t]||t))
          )
        ),
        e("div",{style:{marginBottom:20}},
          e("div",{style:{fontSize:12,fontWeight:700,color:"var(--muted)",marginBottom:8,textTransform:"uppercase",letterSpacing:".06em"}},"Godina ispita"),
          e("select",{
            value:examFilter,onChange:ev=>setExamFilter(ev.target.value),
            style:{background:"var(--s2)",border:"1px solid var(--bdr)",borderRadius:"var(--r)",padding:"8px 12px",color:"var(--text)",fontSize:13,width:"100%",fontFamily:"var(--fb)"}
          },
            e("option",{value:"sve"},"Sve godine"),
            allYears.map(y=>e("option",{key:y,value:String(y)},y+". godina"))
          )
        ),
        e("div",{style:{fontSize:12,color:"var(--muted)",marginBottom:16}},
          "Dostupno: "+(topicFilter==="sve"&&examFilter==="sve"?allCards.length:
            allCards.filter(c=>(topicFilter==="sve"||c.topic===topicFilter)&&(examFilter==="sve"||String(c._examYear)===examFilter)).length)+" kartica (prikazat će se do 40)"
        ),
        e("button",{className:"btn btn-gold",style:{width:"100%",padding:"12px"},onClick:buildDeck},"▶ Pokreni sesiju")
      )
    )
  );

  if(done) return e(Fragment,null,
    e("div",{className:"nav"},
      e("button",{className:"btn btn-g",style:{fontSize:13,padding:"6px 12px"},onClick:onBack},"← Natrag"),
      e("span",{className:"ntitle"},"🃏 Flashcards — Rezultat")
    ),
    e("div",{style:{maxWidth:500,margin:"0 auto",padding:"40px 20px",textAlign:"center"}},
      e("div",{style:{fontSize:52,marginBottom:16}},known.length>=cards.length*.8?"🏆":known.length>=cards.length*.5?"✅":"📚"),
      e("div",{style:{fontFamily:"var(--fh)",fontSize:28,marginBottom:8}},known.length+"/"+cards.length),
      e("div",{style:{color:"var(--muted)",marginBottom:24}},"kartica koje znaš"),
      e("div",{style:{display:"flex",gap:12,justifyContent:"center",marginBottom:24}},
        e("div",{style:{background:"var(--green-d)",border:"1px solid rgba(30,122,62,.3)",borderRadius:"var(--r)",padding:"12px 20px",textAlign:"center"}},
          e("div",{style:{fontSize:24,fontWeight:800,color:"var(--green)"}},"✓ "+known.length),
          e("div",{style:{fontSize:12,color:"var(--muted)"}},known.length===1?"Znam":"Znam")
        ),
        e("div",{style:{background:"var(--red-d)",border:"1px solid rgba(196,48,48,.3)",borderRadius:"var(--r)",padding:"12px 20px",textAlign:"center"}},
          e("div",{style:{fontSize:24,fontWeight:800,color:"var(--red)"}},unknown.length),
          e("div",{style:{fontSize:12,color:"var(--muted)"}},"Ne znam")
        )
      ),
      e("div",{style:{display:"flex",flexDirection:"column",gap:10}},
        unknown.length>0&&e("button",{className:"btn btn-gold",style:{padding:"12px"},onClick:()=>restart(true)},"🔁 Ponovi samo ne-znane ("+unknown.length+")"),
        e("button",{className:"btn btn-g",style:{padding:"12px"},onClick:()=>restart(false)},"↺ Ponovi sve karte"),
        e("button",{className:"btn btn-g",style:{padding:"12px"},onClick:onBack},"← Novi odabir")
      )
    )
  );

  const card=cards[cur];
  const progress=((cur+1)/cards.length*100).toFixed(0);

  return e(Fragment,null,
    e("div",{className:"nav"},
      e("button",{className:"btn btn-g",style:{fontSize:13,padding:"6px 12px"},onClick:onBack},"← Natrag"),
      e("span",{className:"ntitle"},"🃏 Flashcards"),
      e("span",{style:{fontSize:12,color:"var(--muted)"}},cur+1+"/"+cards.length)
    ),
    e("div",{style:{maxWidth:600,margin:"0 auto",padding:"24px 20px 60px"}},
      // Progress bar
      e("div",{style:{height:4,background:"var(--s3)",borderRadius:99,marginBottom:20,overflow:"hidden"}},
        e("div",{style:{height:"100%",width:progress+"%",background:"var(--gold)",borderRadius:99,transition:"width .3s"}})
      ),
      // Score chips
      e("div",{style:{display:"flex",gap:8,marginBottom:16}},
        e("span",{style:{fontSize:12,color:"var(--green)",background:"var(--green-d)",padding:"3px 10px",borderRadius:99,fontWeight:700}},"✓ "+known.length),
        e("span",{style:{fontSize:12,color:"var(--red)",background:"var(--red-d)",padding:"3px 10px",borderRadius:99,fontWeight:700}},"✗ "+unknown.length),
        e("span",{className:"topic-tag",style:{fontSize:11,marginLeft:"auto"}},TOPIC_LABELS[card.topic]||card.topic)
      ),
      // Card
      e("div",{
        onClick:()=>setFlipped(f=>!f),
        style:{
          background:"var(--s1)",border:"1px solid var(--bdr)",borderRadius:"var(--rr)",
          padding:"32px 28px",minHeight:220,cursor:"pointer",
          boxShadow:"var(--shadow)",transition:"all .2s",
          display:"flex",flexDirection:"column",justifyContent:"center",
          userSelect:"none",marginBottom:20,position:"relative"
        }
      },
        e("div",{style:{position:"absolute",top:14,right:16,fontSize:11,color:"var(--muted)",fontWeight:600}},flipped?"↑ Odgovor":"↓ Klikni za odgovor"),
        // Question side
        e("div",{style:{fontSize:15,lineHeight:1.65,fontWeight:500,marginBottom:flipped?16:0}},card.q),
        // Answer side
        flipped&&e("div",{style:{borderTop:"1px solid var(--bdr)",paddingTop:16}},
          card.type==="mc"&&card.sol?.cl&&card.opts&&e("div",null,
            e("div",{style:{fontSize:12,color:"var(--muted)",marginBottom:6}},"Točan odgovor:"),
            e("div",{style:{fontSize:15,fontWeight:700,color:"var(--green)",marginBottom:8}},
              card.sol.cl+") "+(card.opts["ABCDE".indexOf(card.sol.cl)]||"")
            )
          ),
          card.type==="sa"&&card.sol?.ans&&e("div",null,
            e("div",{style:{fontSize:12,color:"var(--muted)",marginBottom:6}},"Odgovor:"),
            e("div",{style:{fontSize:15,fontWeight:700,color:"var(--green)",marginBottom:8}},card.sol.ans)
          ),
          card.exp&&e("div",{style:{fontSize:12,color:"var(--muted)",fontStyle:"italic",marginTop:6}},"💡 "+card.exp)
        )
      ),
      // Action buttons (only when flipped)
      flipped
        ? e("div",{style:{display:"flex",gap:12}},
            e("button",{
              className:"btn",onClick:()=>handleKnow(false),
              style:{flex:1,padding:"14px",background:"var(--red-d)",border:"1px solid rgba(196,48,48,.3)",color:"var(--red)",fontSize:15,fontWeight:700,borderRadius:"var(--r)",cursor:"pointer"}
            },"✗ Ne znam"),
            e("button",{
              className:"btn",onClick:()=>handleKnow(true),
              style:{flex:1,padding:"14px",background:"var(--green-d)",border:"1px solid rgba(30,122,62,.3)",color:"var(--green)",fontSize:15,fontWeight:700,borderRadius:"var(--r)",cursor:"pointer"}

function BookmarksScreen({onBack, onStartSession}){
  const[bookmarks,setBookmarks]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("discere_bookmarks")||"{}");}catch{return {};}
  });
  const[filter,setFilter]=useState("sve");

  // Resolve bookmark keys to actual questions
  const bkList=Object.entries(bookmarks).map(([key,saved])=>{
    const [examKey, qidStr] = key.split("__");
    if(!examKey||!qidStr) return null;
    const exam=EXAMS[examKey];
    if(!exam) return null;
    const q=exam.qs.find(q=>String(q.id)===qidStr);
    if(!q) return null;
    return {key, examKey, q, saved};
  }).filter(Boolean);

  const topics=[...new Set(bkList.map(b=>b.q.topic).filter(Boolean))];
  const filtered=filter==="sve"?bkList:bkList.filter(b=>b.q.topic===filter);

  function removeBookmark(key){
    setBookmarks(prev=>{
      const next={...prev};
      delete next[key];
      localStorage.setItem("discere_bookmarks",JSON.stringify(next));
      return next;
    });
  }

  function startSession(){
    if(filtered.length===0) return;
    const qs=filtered.map(b=>({...b.q,_examKey:b.examKey}));
    const shuffled=[...qs].sort(()=>Math.random()-.5);
    onStartSession({key:"bookmarks_session",year:"Bookmarci",season:"session",label:"Bookmarci — vježbanje",qs:shuffled.slice(0,40)});
  }

  return e(Fragment,null,
    e("div",{className:"nav"},
      e("button",{className:"btn btn-g",style:{fontSize:13,padding:"6px 12px"},onClick:onBack},"← Natrag"),
      e("span",{className:"ntitle"},"🔖 Bookmarci")
    ),
    e("div",{style:{maxWidth:720,margin:"0 auto",padding:"28px 20px 80px"}},
      bkList.length===0
        ? e("div",{style:{textAlign:"center",padding:"60px 0"}},

            e("div",{style:{fontSize:18,fontWeight:700,marginBottom:8}},"Nema bookmarkanih pitanja"),
            e("div",{style:{fontSize:14,color:"var(--muted)",marginBottom:24}},"Dok rješavaš ispit, pritisni B ili ikonu 🔖 da bookmarkaš pitanje."),
            e("button",{className:"btn btn-g",onClick:onBack},"← Natrag")
          )
        : e("div",null,
            e("div",{style:{background:"var(--s1)",border:"1px solid var(--bdr)",borderRadius:"var(--rr)",padding:"18px 20px",marginBottom:20,display:"flex",alignItems:"center",gap:16,boxShadow:"var(--shadow)"}},
              e("div",{style:{fontSize:32,fontWeight:800,color:"var(--gold)"}},bkList.length),
              e("div",{style:{flex:1}},

              ),

              topics.map(t=>e("button",{

function ErrorsScreen({userData, onStart, onBack}){
  const errors = Object.values(userData.errorTracker||{})
    .filter(e=>e.count>0)
    .sort((a,b)=>b.count-a.count);

  function startErrorSession(){
    if(errors.length===0) return;
    // Build virtual exam from error questions
    const qs = errors.slice(0,40).map(err=>{
      // Find original question
      const exam = EXAMS[err.examKey];
      if(!exam) return null;
      const q = exam.qs.find(q=>String(q.id)===String(err.qid));
      return q ? {...q, _examKey:err.examKey} : null;
    }).filter(Boolean);
    if(qs.length===0) return;
    const shuffled = [...qs].sort(()=>Math.random()-.5);
    onStart({key:"errors_session", year:"Greške", season:"session", label:"Greške — ponavljanje", qs:shuffled});

  const[filterType, setFilterType] = useState("sve");
  const[expanded, setExpanded] = useState({});
  const[globalSearch, setGlobalSearch] = useState(false);

  const exam = selExam ? EXAMS[selExam] : null;

  // All questions across all exams for global search
  const allQuestions = React.useMemo(()=>{
    const qs = [];
    Object.values(EXAMS).forEach(ex=>{
      ex.qs.forEach(q=>qs.push({...q, _examKey:ex.key, _examLabel:ex.year+". — "+(ex.season==="ljeto"?"Ljetni":"Jesenski")}));
    });
    return qs;
  },[]);

  const sourceQs = globalSearch ? allQuestions : (exam ? exam.qs : []);

  const questions = sourceQs.filter(q=>{
    if(filterTopic!=="sve" && q.topic!==filterTopic) return false;
    if(filterType!=="sve" && q.type!==filterType) return false;
    if(search){
      const s = search.toLowerCase();
      const inQ = q.q.toLowerCase().includes(s);
      const inOpts = q.opts?.some(o=>o.toLowerCase().includes(s));
      const inAns = (q.sol?.ans||q.sol?.ex||"").toLowerCase().includes(s);
      const inTopic = (TOPIC_LABELS[q.topic]||"").toLowerCase().includes(s);
      if(!inQ && !inOpts && !inAns && !inTopic) return false;
    }
    return true;
  });

  const examList = Object.values(EXAMS).sort((a,b)=>b.year-a.year||(a.season==="ljeto"?-1:1));

  // Topics available in current source

      q.opts&&e("div",{style:{display:"flex",flexDirection:"column",gap:4,marginBottom:10}},
        q.opts.map((opt,j)=>{
          const isCorrect = q.sol?.cl===String.fromCharCode(65+j);

            fontSize:12,padding:"6px 11px",borderRadius:"var(--r)",

      // Global search toggle
      e("div",{style:{display:"flex",gap:8,marginBottom:16,alignItems:"center",flexWrap:"wrap"}},
        e("button",{

  {id:"improvement",emoji:"📈",title:"Veliki napredak!",desc:"Poboljšao/la si rezultat za +20%!"},
  {id:"speed_ace",emoji:"⚡",title:"Munjeviti odgovori!",desc:"Prosjek ispod 30s po pitanju!"},
  {id:"comeback",emoji:"🔄",title:"Comeback!",desc:"Popravak s ocjene 1 na 3 ili više!"}
];
function checkNewAchievements(userData,result,topicBreakdown){
  const alreadyEarned=new Set((userData&&userData.achievements)||[]);
  const toAdd=[];
  const totalExams=((userData&&userData.totalExams)||0)+1;
  function tryEarn(id){ if(!alreadyEarned.has(id)){ alreadyEarned.add(id); const b=ACHIEVEMENTS.find(a=>a.id===id); if(b) toAdd.push(b); } }
  if(totalExams>=1) tryEarn("first_exam");
  if(totalExams>=5) tryEarn("five_exams");
  if(totalExams>=10) tryEarn("ten_exams");
  if(result.grade===5) tryEarn("grade_5");
  if(result.pct===100) tryEarn("perfect");
  const streak=(userData&&userData.streak)||0;
  if(streak>=3) tryEarn("streak_3");
  if(streak>=7) tryEarn("streak_7");
  if(topicBreakdown){ for(const k in topicBreakdown){ const t=topicBreakdown[k]; if(t&&t.total>=3&&t.correct===t.total){ tryEarn("topic_master"); break; } } }
  const prevAttempts=((userData&&userData.history)||[]).filter(h=>h.examKey===result.examKey);
  if(prevAttempts.length>0){
    const bestPrev=Math.max(...prevAttempts.map(h=>h.pct));
    if(result.pct>=bestPrev+20) tryEarn("improvement");
    const last=prevAttempts[prevAttempts.length-1];
    if(last&&last.grade===1&&result.grade>=3) tryEarn("comeback");
  }
  const timeVals=Object.values(result.qTimes||{}).filter(t=>t>0&&t<600);
  if(timeVals.length>=10){ const avg=timeVals.reduce((a,b)=>a+b,0)/timeVals.length; if(avg<30) tryEarn("speed_ace"); }
  return {newAchievements:[...alreadyEarned],newBadges:toAdd};
}
function AchievementToast({badge,onDismiss}){
  useEffect(()=>{ const t=setTimeout(onDismiss,4500); return ()=>clearTimeout(t); },[onDismiss]);
  return e("div",{className:"ach-toast",onClick:onDismiss},
    e("div",{className:"ach-toast-inner"},
      e("div",{className:"ach-toast-emoji"},badge.emoji),
      e("div",null,
        e("div",{className:"ach-toast-label"},"Novi bedž!"),
        e("div",{className:"ach-toast-title"},badge.title),
        e("div",{className:"ach-toast-desc"},badge.desc)
      ),
      e("button",{className:"ach-toast-close",onClick:ev=>{ev.stopPropagation();onDismiss();}},"×")
    )
  );
}

   Pitanja stižu s poslužitelja (ADR-001), pa ulazak u ispit više nije trenutan.
   Ova dva ekrana su cijena te promjene: dok se čeka, Sim SE NE MONTIRA — a to
   znači i da timer ne kreće prije nego pitanja stignu. */
function ExamLoadingScreen({label,onCancel}){
  return e("div",{style:{minHeight:"60vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:"40px 20px",textAlign:"center"}},
    e("div",{className:"spinner","aria-hidden":"true",style:{width:34,height:34,borderRadius:"50%",border:"3px solid var(--bdr)",borderTopColor:"var(--gold)",animation:"soc-spin .9s linear infinite"}}),
    e("div",{role:"status","aria-live":"polite",style:{fontFamily:"var(--fh)",fontSize:16,fontWeight:700}},label||"Učitavamo ispit…"),
    e("div",{style:{fontSize:12.5,color:"var(--muted)",maxWidth:340,lineHeight:1.6}},"Pitanja dolaze s poslužitelja. Timer kreće tek kad stignu."),
    onCancel&&e("button",{className:"btn btn-g",style:{marginTop:6},onClick:onCancel},"Odustani")
  );
}
function ExamLoadErrorScreen({message,onRetry,onBack}){
  return e("div",{style:{minHeight:"60vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,padding:"40px 20px",textAlign:"center"}},
    e("div",{style:{fontSize:34}},"⚠️"),
    e("div",{role:"alert",style:{fontFamily:"var(--fh)",fontSize:16,fontWeight:700,maxWidth:420,lineHeight:1.5}},message||"Dohvat ispita nije uspio."),
    e("div",{style:{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap",marginTop:6}},
      onRetry&&e("button",{className:"btn btn-gold",onClick:onRetry},"Pokušaj ponovno"),
      onBack&&e("button",{className:"btn btn-g",onClick:onBack},"← Na početak")
    )
  );
}

function App(){
  const[screen,setScreen]=useState("home");
  const[achToast,setAchToast]=useState(null);
  const[examKey,setExamKey]=useState("2010_ljeto");
  const[pendingExamKey,setPendingExamKey]=useState(null);
  // Dohvat ispita u tijeku, odnosno njegova greška. `loadToken` odbacuje
  // odgovore zastarjelih zahtjeva: bez njega bi korisnik koji odustane pa otvori
  // drugi ispit dobio prvi, jer je njegov odgovor stigao kasnije.
  const[examLoading,setExamLoading]=useState(null);
  const[examLoadError,setExamLoadError]=useState(null);
  const loadToken=React.useRef(0);
  const[darkMode,setDarkMode]=useState(()=>{
    const saved=localStorage.getItem("discere_dark");
    if(saved!==null) return saved!=="0"; // korisnik je ručno postavio
    // Prati system postavku
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  });
  const[soundOn,setSoundOn]=useState(()=>localStorage.getItem("discere_sound")!=="0");
  const[cbMode,setCbMode]=useState(()=>localStorage.getItem("discere_soc_cb")==="1");
  const[dysMode,setDysMode]=useState(()=>localStorage.getItem("discere_soc_dys")==="1");

  // Apply dark mode
  React.useEffect(()=>{
    document.body.classList.toggle("dark-mode",darkMode);
    localStorage.setItem("discere_dark",darkMode?"1":"0");
  },[darkMode]);

  // Apply colorblind / dyslexia accessibility modes
  React.useEffect(()=>{
    document.body.classList.toggle("cb-mode",cbMode);
    localStorage.setItem("discere_soc_cb",cbMode?"1":"0");
  },[cbMode]);
  React.useEffect(()=>{
    document.body.classList.toggle("dys-mode",dysMode);
    localStorage.setItem("discere_soc_dys",dysMode?"1":"0");
  },[dysMode]);

  // Prati promjenu system dark mode postavke (samo ako korisnik nije ručno postavio)
  React.useEffect(()=>{
    const mq=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
    if(!mq) return;
    function onSystemChange(e){
      // Primijeni samo ako localStorage nije eksplicitno postavljen od korisnika
      // (korisnik nikad nije kliknuo toggle = localStorage je null)
      if(localStorage.getItem("discere_dark")===null){
        setDarkMode(e.matches);
      }
    }
    mq.addEventListener("change",onSystemChange);
    return ()=>mq.removeEventListener("change",onSystemChange);
  },[]);

  // Sound effect helper
  function playSound(type){
    if(!soundOn) return;
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      if(type==="correct"){
        osc.frequency.setValueAtTime(880,ctx.currentTime);
        osc.frequency.setValueAtTime(1100,ctx.currentTime+0.1);
        gain.gain.setValueAtTime(0.15,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
        osc.start(); osc.stop(ctx.currentTime+0.3);
      } else if(type==="wrong"){
        osc.frequency.setValueAtTime(330,ctx.currentTime);
        osc.frequency.setValueAtTime(220,ctx.currentTime+0.1);
        gain.gain.setValueAtTime(0.1,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
        osc.type="sawtooth";
        osc.start(); osc.stop(ctx.currentTime+0.3);
      } else if(type==="done"){
        [523,659,784].forEach((f,i)=>{
          const o2=ctx.createOscillator(); const g2=ctx.createGain();
          o2.connect(g2); g2.connect(ctx.destination);
          o2.frequency.value=f;
          g2.gain.setValueAtTime(0.12,ctx.currentTime+i*0.12);
          g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.12+0.25);
          o2.start(ctx.currentTime+i*0.12); o2.stop(ctx.currentTime+i*0.12+0.25);
        });
      }
    }catch(e){}
  }
  window._playSound = playSound; // expose globally for Sim component

  // Statistika izvodi „Najteža pitanja“, kritična pitanja, popis pitanja teme i
  // „Pokrivenost gradiva“ iz CIJELE banke, a banka od Faze 2 stiže s poslužitelja.
  // Za plaćeni tier je zato dohvatimo prije ulaska; free je po ODLUCI 4 nikad ne
  // traži, pa mu ti blokovi pišu da podatak nije dostupan umjesto da lažu nulu.
  function goStats(){
    if(socLocked()){setScreen("stats");window.scrollTo(0,0);return;}
    withAllExams("Učitavamo banku pitanja…",function(){setScreen("stats");window.scrollTo(0,0)});
  }
  // OD OVDJE NADALJE: socFeatureGate stoji PRIJE withAllExams. Redoslijed je
  // dio ugovora, ne stil — free korisnik ne smije ni zatražiti cijelu banku
  // (ODLUKA 4), a ne samo je ne vidjeti nakon što stigne.
  function goFilter(topicKey){
    if(!socFeatureGate())return;
    const build=window._virtualExamBuilder;
    if(topicKey && build){
      // Prečac iz Statistike. Banka se dohvaća i ovdje: Statistika se otvara i
      // prije ijednog dohvata, pa bi vježba složena na ekranu bila qs:[] i Sim
      // bi se srušio na prvom pitanju. Recept se izvršava TEK nakon dohvata.
      window._virtualExamBuilder=null;
      withAllExams("Učitavamo banku pitanja…",function(){
        const vex=build();
        if(!vex||!vex.qs||!vex.qs.length){
          // Tema bez ijednog automatski ocjenjivog pitanja — filter ekran je
          // pošteniji ishod od prazne sesije.
          setScreen("filter");window.scrollTo(0,0);return;
        }
        window._virtualExam=vex;
        setExamKey(vex.key);
        setScreen("filter_session");
        window.scrollTo(0,0);
      });
      return;
    }
    withAllExams("Učitavamo banku pitanja…",function(){setScreen("filter");window.scrollTo(0,0)});
  }
  function goErrors(){if(!socFeatureGate())return;withAllExams("Učitavamo banku pitanja…",function(){setScreen("errors");window.scrollTo(0,0)})}
  function goBrowse(){if(!socFeatureGate())return;withAllExams("Učitavamo banku pitanja…",function(){setScreen("browse");window.scrollTo(0,0)})}
  function goBookmarks(){if(!socFeatureGate())return;withAllExams("Učitavamo banku pitanja…",function(){setScreen("bookmarks");window.scrollTo(0,0)})}
  function goFlashcards(){if(!socFeatureGate())return;withAllExams("Učitavamo banku pitanja…",function(){setScreen("flashcards");window.scrollTo(0,0)})}
  function goDailyChallenge(){if(!socFeatureGate())return;withAllExams("Slažemo dnevni izazov…",function(){setScreen("daily");window.scrollTo(0,0)})}
  function goSRS(){if(!socFeatureGate())return;withAllExams("Učitavamo banku pitanja…",function(){setScreen("srs");window.scrollTo(0,0)})}
  function goPDFReport(){if(!socFeatureGate())return;setScreen("pdf_report");window.scrollTo(0,0)}
  function goGuide(){setScreen("guide");window.scrollTo(0,0)}
  function goFilterSession(virtualExam){
    if(!socFeatureGate())return;
    setExamKey(virtualExam.key);
    window._virtualExam = virtualExam;
    setScreen("filter_session");
    window.scrollTo(0,0);
  }
  function goErrorSession(virtualExam){
    if(!socFeatureGate())return;
    setExamKey(virtualExam.key);
    window._virtualExam = virtualExam;
    setScreen("errors_session");
    window.scrollTo(0,0);
  }
  function goBookmarkSession(virtualExam){
    if(!socFeatureGate())return;
    setExamKey(virtualExam.key);
    window._virtualExam = virtualExam;
    setScreen("bookmark_session");
    window.scrollTo(0,0);
  }
  function goPracticeExamErrors(wrongQs, srcExam){
    if(!socFeatureGate())return;
    // Start a practice session with only the wrong questions from this exam
    const virtualExam = {
      key:"exam_errors_session",
      year:srcExam.year,
      season:srcExam.season,
      label:srcExam.label+" — Greške",
      qs:[...wrongQs].sort(()=>Math.random()-.5)
    };
    setExamKey(virtualExam.key);
    window._virtualExam = virtualExam;
    setScreen("errors_session");
    window.scrollTo(0,0);
  }
  const[userData,updateUserData]=useUserData();
  // cross-tab sync: re-hydrate userData kad se promijeni u drugom tabu (samo na sigurnim ekranima)
  React.useEffect(()=>{
    function onSync(ev){
      const d=ev&&ev.detail; if(!d||d.key!=="disc_soc_user"||!d.value) return;
      if(screen!=="home"&&screen!=="stats") return;
      try{
        const parsed=JSON.parse(d.value);
        const changed=(parsed.xp||0)!==((userData&&userData.xp)||0)
          ||((parsed.history||[]).length)!==(((userData&&userData.history)||[]).length)
          ||((parsed.achievements||[]).length)!==(((userData&&userData.achievements)||[]).length);
        if(changed) updateUserData(()=>parsed);
      }catch(e){}
    }
    window.addEventListener("soc-storage-sync",onSync);
    return ()=>window.removeEventListener("soc-storage-sync",onSync);
  },[screen,userData]);
  const exam=EXAMS[examKey];
  function socGate(k){if(socAllowed(k))return true;socUpgrade("soc-practice","standard");return false}
  function socFeatureGate(){if(!socLocked())return true;socUpgrade("soc-feature","standard");return false}

  /* ── ulazak u ispit ide preko dohvata ────────────────────────────────────
     EXAMS je prazan dok roditelj ne pošalje ispit, pa nijedan ekran s pitanjima
     ne smije biti montiran prije toga. `run` se zove tek nakon uspjeha; greška
     daje ekran s porukom i gumbom "Pokušaj ponovno" (isti zahtjev, isti mod). */
  function withExam(key,mode,label,run){
    const token=++loadToken.current;
    setExamLoadError(null);
    setExamLoading({label:label});
    socRequestExam(key,mode).then(function(){
      if(loadToken.current!==token)return;
      setExamLoading(null);
      run();
    },function(err){
      if(loadToken.current!==token)return;
      setExamLoading(null);
      setExamLoadError({
        message:(err&&err.message)||"Dohvat ispita nije uspio.",
        retry:function(){withExam(key,mode,label,run);}
      });
    });
  }

  /* Ekrani koji analiziraju CIJELU banku (Pregled, Filter, Flashcards, SRS,
     Bookmarci, Dnevni izazov, Virtualni ispit). Svi su Standard sadržaj, pa
     socFeatureGate stoji PRIJE ovog poziva — free korisnik nikad ne pokrene
     skupni dohvat (ODLUKA 4). Roditelj ga za free i odbija, ali gate je prvi. */
  function withAllExams(label,run){
    const token=++loadToken.current;
    setExamLoadError(null);
    setExamLoading({label:label||"Učitavamo banku pitanja…"});
    socRequestAllExams().then(function(){
      if(loadToken.current!==token)return;
      setExamLoading(null);
      run();
    },function(err){
      if(loadToken.current!==token)return;
      setExamLoading(null);
      setExamLoadError({
        message:(err&&err.message)||"Dohvat ispita nije uspio.",
        retry:function(){withAllExams(label,run);}
      });
    });
  }

  function goExam(k){withExam(k,"exam","Učitavamo ispit…",function(){setExamKey(k);setScreen("exam");window.scrollTo(0,0)})}
  function goModeSelect(k){withExam(k,"exam","Učitavamo ispit…",function(){setPendingExamKey(k);setScreen("modeselect");window.scrollTo(0,0)})}
  function goPractice(k){var kk=k||"2010_ljeto";if(!socGate(kk))return;withExam(kk,"practice","Učitavamo vježbanje…",function(){setExamKey(kk);setScreen("practice");window.scrollTo(0,0)})}
  function goPracticeTimer(k){var kk=k||pendingExamKey||"2010_ljeto";if(!socGate(kk))return;withExam(kk,"practice","Učitavamo vježbanje…",function(){setExamKey(kk);setScreen("practice_timed");window.scrollTo(0,0)})}
  function goVirtualExam(){
    if(!socFeatureGate())return;
    withAllExams("Slažemo virtualni ispit…",function(){
      const vex=generateVirtualExam();
      window._virtualExam=vex;
      setExamKey(vex.key);
      setScreen("virtual_exam");
      window.scrollTo(0,0);
    });
  }
  function goExamMode(k){var kk=k||pendingExamKey||"2010_ljeto";withExam(kk,"exam","Pripremamo simulaciju…",function(){setExamKey(kk);setScreen("exammode");window.scrollTo(0,0)})}
  function goHome(){setExamLoadError(null);setScreen("home");window.scrollTo(0,0)}
  function onExamDone(result){
    // XP i točnost PO PITANJU dolaze iz rezultata: kad ga je dao poslužitelj, on
    // je izvor istine (ADR-001 točka 10). Lokalni izračun ostaje kao rezerva za
    // pozive bez `scores` (virtualne sesije složene iz više ispita).
    const xpGain = Number(result.xpGain)||calcXpGain(result.pct, result.total);
    const examQs = EXAMS[result.examKey]?.qs || [];
    const scores = (result.scores && typeof result.scores==="object" && Object.keys(result.scores).length)
      ? result.scores : null;
    function verdictOf(q){
      if(!q||q.type==="sa"||q.type==="es") return null;
      if(scores){const v=scores[String(q.id)];return v===undefined?null:v;}
      return chk(q, result.answers?.[q.id]);
    }
    if(result.pct>=70) window._playSound?.("done");

    // Build topic_breakdown
    const topicBreakdown = {};
    examQs.forEach(q=>{
      const topic = q.topic || "ostalo";
      if(q.type==="sa"||q.type==="es") return;
      if(!topicBreakdown[topic]) topicBreakdown[topic]={correct:0,total:0};
      topicBreakdown[topic].total++;
      if(verdictOf(q)===true) topicBreakdown[topic].correct++;
    });

    const wrongAnswers = [];
    examQs.forEach(q=>{
      if(q.type==="sa"||q.type==="es") return;
      if(verdictOf(q)===false){
        wrongAnswers.push({qid:q.id,q:q.q.slice(0,80),topic:q.topic||"ostalo",examKey:result.examKey,type:q.type});
      }
    });

    let _mergedAch=(userData&&userData.achievements)||[];
    try{
      const _afterStreak=updateStreak(userData||{});
      const _ach=checkNewAchievements(_afterStreak,{pct:result.pct,grade:result.grade,qTimes:result.qTimes||{},examKey:result.examKey,answers:result.answers||{}},topicBreakdown);
      _mergedAch=_ach.newAchievements;
      if(_ach.newBadges&&_ach.newBadges.length) setAchToast(_ach.newBadges[0]);
      if((result.pct>=70||(_ach.newBadges&&_ach.newBadges.length))&&typeof window!=="undefined"&&typeof window.confetti==="function"){
        window.confetti({particleCount:result.pct>=90?180:110,spread:75,origin:{y:.25},disableForReducedMotion:true});
      }
    }catch(e){}
    updateUserData(prev=>{
      const updated = updateStreak(prev);
      const errorTracker = {...(prev.errorTracker||{})};
      wrongAnswers.forEach(w=>{
        const key = w.examKey+"_"+w.qid;
        const existing = errorTracker[key]||{count:0,q:w.q,topic:w.topic,examKey:w.examKey,qid:w.qid,type:w.type};
        errorTracker[key] = {...existing, count: existing.count+1, lastDate: new Date().toLocaleDateString("hr")};
      });
      examQs.forEach(q=>{
        if(q.type==="sa"||q.type==="es") return;
        if(verdictOf(q)===true){
          const key = result.examKey+"_"+q.id;
          if(errorTracker[key]){
            errorTracker[key] = {...errorTracker[key], count: Math.max(0, errorTracker[key].count-1)};
            if(errorTracker[key].count===0) delete errorTracker[key];
          }
        }
      });
      const newHistory = [...(prev.history||[]),{
        examLabel:result.examLabel,examKey:result.examKey,
        date:new Date().toLocaleDateString("hr"),pct:result.pct,grade:result.grade,
        cor:result.cor,total:result.total,breakdown:result.breakdown,
        topic_breakdown:topicBreakdown,qTimes:result.qTimes||{},
        mode:result.examMode?"simulacija":"vježbanje",wrongCount:wrongAnswers.length
      }];
      return{...updated, xp:(prev.xp||0)+xpGain, history:newHistory,
        errorTracker, achievements:_mergedAch, totalExams:(prev.totalExams||0)+1, lastXpGain:xpGain};
    });
    try{
      if(/^\d{4}_(ljeto|jesen)$/.test(result.examKey)&&window.__SOC_TOPARENT__){
        // Redak u sim_progress u pravilu piše SAMA ocjenjivačka ruta (ODLUKA 2).
        // `serverSaved` je jedini razlog zbog kojeg ova poruka još postoji: kad je
        // false, ruta je predaju odbila (mreža, 429), a klijent ju je s vlastitim
        // ključevima izračunao lokalno — tada i samo tada roditelj upisuje redak.
        window.__SOC_TOPARENT__({type:"DISCERE_RESULT",result:{
          examKey:result.examKey,examLabel:result.examLabel,razina:null,
          pct:result.pct,grade:String(result.grade),cor:result.cor,total:result.total,
          answers:result.answers||{},qTimes:result.qTimes||{},examMode:!!result.examMode,
          topic_breakdown:topicBreakdown,errorTags:[],serverSaved:result.serverSaved,
          // Bez otiska bi rezervni upis prošao kao NULL redak i pokušaj koji je
          // ruta već spremila brojao bi se dvaput (indeks vrijedi samo za ne-NULL).
          attemptId:(typeof result.attemptId==="string")?result.attemptId:null
        }});
      }
    }catch(e){}
  }
  const activeExam = (screen==="filter_session"||screen==="errors_session"||screen==="bookmark_session") ? (window._virtualExam||exam) : exam;

  const toggles = e("div",{style:{display:"flex",gap:6,marginLeft:"auto"}},
    e("button",{
      onClick:goGuide,
      title:"Upute",
      style:{background:"none",border:"1px solid var(--bdr)",borderRadius:"var(--r)",padding:"4px 8px",cursor:"pointer",fontSize:13,color:"var(--muted)"}
    },"ℹ️"),
    e("button",{
      onClick:()=>{const n=!soundOn;setSoundOn(n);localStorage.setItem("discere_sound",n?"1":"0");},
      title:soundOn?"Isključi zvuk":"Uključi zvuk",
      style:{background:"none",border:"1px solid var(--bdr)",borderRadius:"var(--r)",padding:"4px 8px",cursor:"pointer",fontSize:14,color:"var(--muted)"}
    },soundOn?"🔊":"🔇"),
    e("button",{
      onClick:()=>setCbMode(v=>!v),
      title:cbMode?"Isključi mod za daltonizam":"Mod za daltonizam (Okabe-Ito)",
      style:{background:cbMode?"var(--gold-d)":"none",border:"1px solid "+(cbMode?"var(--gold-b)":"var(--bdr)"),borderRadius:"var(--r)",padding:"4px 8px",cursor:"pointer",fontSize:14,color:cbMode?"var(--gold)":"var(--muted)"}
    },"🎨"),
    e("button",{
      onClick:()=>setDysMode(v=>!v),
      title:dysMode?"Isključi font za disleksiju":"Font za disleksiju",
      style:{background:dysMode?"var(--gold-d)":"none",border:"1px solid "+(dysMode?"var(--gold-b)":"var(--bdr)"),borderRadius:"var(--r)",padding:"4px 8px",cursor:"pointer",fontSize:14,color:dysMode?"var(--gold)":"var(--muted)"}
    },"🔤"),
    e("button",{
      onClick:()=>setDarkMode(d=>!d),
      onDoubleClick:()=>{
        // Dvostruki klik = reset na system postavku
        localStorage.removeItem("discere_dark");
        const prefersDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
        setDarkMode(prefersDark);
      },
      title:(darkMode?"Svijetli mod":"Tamni mod")+" · Dvostruki klik = slijedi sustav",
      style:{background:"none",border:"1px solid var(--bdr)",borderRadius:"var(--r)",padding:"4px 8px",cursor:"pointer",fontSize:14,color:"var(--muted)"}
    },darkMode?"☀️":"🌙")
  );

  // Čekanje i greška su ZASEBNI ekrani, a ne stanje unutar Sima: dok ispit ne
  // stigne, Sim se uopće ne montira, pa ni timer ne može krenuti prije pitanja.
  if(examLoading) return e("div",{style:{minHeight:"100vh",background:"var(--bg)",color:"var(--text)"}},
    e(ExamLoadingScreen,{label:examLoading.label,onCancel:function(){loadToken.current++;setExamLoading(null);}}));
  if(examLoadError) return e("div",{style:{minHeight:"100vh",background:"var(--bg)",color:"var(--text)"}},
    e(ExamLoadErrorScreen,{message:examLoadError.message,onRetry:examLoadError.retry,onBack:goHome}));

  return e("div",{style:{minHeight:"100vh",background:"var(--bg)",color:"var(--text)"}},
    achToast&&e(AchievementToast,{badge:achToast,onDismiss:()=>setAchToast(null)}),
    // FAIL-CLOSED: otvori li se ova datoteka izravno (bez aplikacije oko sebe),
    // ispiti se ne mogu dohvatiti — pitanja i ključevi više ne žive u njoj.
    !socHasParent()&&e("div",{role:"note",style:{background:"var(--gold-d)",border:"1px solid var(--gold-b)",color:"var(--gold)",padding:"10px 16px",fontSize:13,lineHeight:1.55,textAlign:"center"}},
      "Simulator se otvara kroz aplikaciju — ispiti se učitavaju tek ondje."),

(function(){
  var SYNC=["disc_soc_user","discere_bookmarks","disc_soc_srs"];
  var embedded=false; try{embedded=window.parent&&window.parent!==window;}catch(e){embedded=false;}
  // Vraća je li poruka DOISTA poslana: socPost iz toga zaključuje smije li uopće
  // čekati odgovor (standalone otvaranje nema kome poslati zahtjev).
  function toParent(m){try{if(!embedded)return false;window.parent.postMessage(m,"*");return true;}catch(e){return false;}}
  function _get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  window.__SOC_TOPARENT__=toParent;
  // fail-closed u iframeu: dok DISCERE_CONFIG ne stigne, razrada rezultata je zaključana
  // (safety boot nakon 6 s inače bi je otključao); standalone otvaranje ostaje otključano
  window.__SOC_BRIDGE__={tier:"free",allowed:null,freeExam:false,lockResults:embedded};
  var _set=localStorage.setItem.bind(localStorage);
  var _rem=localStorage.removeItem.bind(localStorage);
  var booted=false, readyTimer=null;
  function stopReady(){ if(readyTimer){clearInterval(readyTimer);readyTimer=null;} }
  function sameAllow(a,b){
    if(!a||!b) return a===b;
    if(a.size!==b.size) return false;
    var ok=true; a.forEach(function(k){ if(!b.has(k)) ok=false; }); return ok;
  }
  /** Je li nova konfiguracija doista drukčija? Ponovljeni isti CONFIG ne prebojava. */
  function bridgeChanged(p,n){
    return p.tier!==n.tier||!!p.freeExam!==!!n.freeExam||!!p.lockResults!==!!n.lockResults||!sameAllow(p.allowed,n.allowed);
  }
  function boot(){ if(booted)return; booted=true; stopReady(); try{ReactDOM.createRoot(document.getElementById("root")).render(e(App,null));}catch(err){console.error(err);} }
  // outbound: mirror synced localStorage writes to parent (debounced/upserted there)
  localStorage.setItem=function(k,v){_set(k,v);if(SYNC.indexOf(k)>-1)toParent({type:"DISCERE_SAVE",key:k,value:v});};
  localStorage.removeItem=function(k){_rem(k);if(SYNC.indexOf(k)>-1)toParent({type:"DISCERE_SAVE",key:k,value:null});};
  window.addEventListener("message",function(ev){
    var d=ev.data||{}; if(!d||!d.type)return;
    if(d.type==="DISCERE_HYDRATE"&&!booted){
      stopReady();
      try{
        var st=d.state||{};
        var cloudAt=Number(st._savedAt||0);
        var localAt=Number(_get("disc_soc_synced_at")||0);
        var hasLocal=!!_get("disc_soc_user");
        if(cloudAt>localAt||!hasLocal){
          SYNC.forEach(function(k){ if(st[k]!=null) _set(k,st[k]); });
          if(cloudAt) _set("disc_soc_synced_at",String(cloudAt));
        }
      }catch(e){}
    }
    if(d.type==="DISCERE_CONFIG"){
      var allow=null;
      if(d.allowed){ allow=new Set(); for(var i=0;i<d.allowed.length;i++) allow.add(d.allowed[i]); }
      var prev=window.__SOC_BRIDGE__||{};
      var next={tier:d.tier||"free",allowed:allow,freeExam:!!d.freeExam,lockResults:!!d.lockResults};
      window.__SOC_BRIDGE__=next;
      stopReady();
      // Roditelj tier razrješava asinkrono i CONFIG šalje pri svakoj promjeni —
      // i NAKON boota (READY se tada više ne ponavlja). Zaključavanje se čita pri
      // renderu, pa promjena mora probuditi ekrane koji već stoje na zaslonu:
      // rezultate, statistiku i značke na Homeu. Bez ovoga plaćeni korisnik do
      // kraja sesije gleda "Otključaj razradu → Standard".
      if(bridgeChanged(prev,next)){
        try{ window.dispatchEvent(new CustomEvent("soc-bridge-change",{detail:next})); }catch(e){}
      }
    }
    if(d.type==="DISCERE_BOOT"){ boot(); }
    // ADR-001, ODLUKA 7: ispiti i ocjena stižu ISKLJUČIVO ovim putem — engine
    // nema nijedan fetch. Handleri su deklaracije iznad, u istom dosegu skripte.
    if(d.type==="DISCERE_EXAMS"){ try{socOnExams(d);}catch(err){console.error(err);} }
    if(d.type==="DISCERE_EXAM_ERROR"){ try{socOnExamError(d);}catch(err){console.error(err);} }
    if(d.type==="DISCERE_EXAMS_DONE"){ try{socOnExamsDone(d);}catch(err){console.error(err);} }
    if(d.type==="DISCERE_GRADE"){ try{socOnGrade(d);}catch(err){console.error(err);} }
    if(d.type==="DISCERE_GRADE_ERROR"){ try{socOnGradeError(d);}catch(err){console.error(err);} }
  });
  // cross-tab sync: kad drugi tab promijeni stanje, javi Appu da re-hydrira
  window.addEventListener("storage",function(ev){
    if(!ev||!ev.key) return;
    if(ev.key==="disc_soc_user"||ev.key==="disc_soc_srs"||ev.key==="discere_bookmarks"){
      try{ window.dispatchEvent(new CustomEvent("soc-storage-sync",{detail:{key:ev.key,value:ev.newValue}})); }catch(e){}
    }
  });
  if(embedded){
    toParent({type:"DISCERE_READY"});
    readyTimer=setInterval(function(){ if(!booted) toParent({type:"DISCERE_READY"}); else stopReady(); },600);
    setTimeout(boot,6000); // safety: boot localStorage-only if parent never handshakes
  } else {
    setTimeout(boot,150); // standalone (opened directly)
  }
})();
