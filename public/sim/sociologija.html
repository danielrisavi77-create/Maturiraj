  "2020_ljeto": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Policajac i vlastiti sin (z. 24)",text:"Policajac je zaustavio voza\u010da kako bi ga kaznio zbog neoprezne i prebrze vo\u017enje. Nakon \u0161to je policajac uvidio da je zaustavio vlastito ga sina, bio je zate\u010den i zapitao se bi li mu trebao napisati kaznu ili ne."},
        {heading:"Globalizacija i multinacionalne kompanije (z. 27)",text:"Multinacionalne kompanije imaju golem utjecaj na svjetsku ekonomiju i kontroliraju financijske tokove, tehnologiju i planetarne resurse. Radna mjesta milijuna ljudi ovise o odlukama tih kompanija o premje\u0161tanju kapitala iz jedne dr\u017eave u drugu. Istovremeno se financijska tr\u017ei\u0161ta umre\u017eavaju, a stalan informacijski i komunikacijski razvoj odlika je suvremenoga dru\u0161tva."},
        {heading:"Birokracija kao piramida (z. 29)",text:"Birokratska organizacija nalik je piramidi. Mo\u0107 je u takvoj organizaciji koncentrirana u rukama malobrojnih pojedinaca pri vrhu piramide koji predstavljaju tu organizaciju, donose najva\u017enije odluke i nala\u017eu radne zadatke ni\u017ee pozicioniranim slu\u017ebenicima."},
        {heading:"Grafički prikaz: upisanost studenata u Hrvatskoj 1960.–2001. (z. 30)",text:"Grafički prikaz 1. Postotak upisanih studenata na visoka učilišta u Hrvatskoj od 1960. do 2001. godine. Prikazane su dvije linije: žene i muškarci. Linija koja prikazuje udio žena ima rastuć trend. Izvor: Državni zavod za statistiku Republike Hrvatske, 2016."},
        {heading:"Kulturna promjena i kulturno zaostajanje (z. 31)",text:"Iako je pred stotinu godina muško starinsko odijelo bilo zamijenjeno oblikom gra\u0111anskoga, tek iza drugoga svjetskog rata mlade su se \u017eene prve po\u010dele odijevati na gra\u0111anski na\u010din, dok te promjene nije prihva\u0107ala stara \u017eenska populacija. Mladi iseljenici u grad kroz obrazovanje mijenjaju svoje shva\u0107anje odnosa me\u0111u spolovima, ali se mijenjaju i odnosi me\u0111u generacijama.\n\n(...) Najkasnije se mijenjaju sadr\u017eaji duhovne kulture, od koje posebno neka vjerovanja, koja su u novom ambijentu mogla ostati u intimnoj sferi \u017eivota pojedinaca ili u\u017eega kruga \u010dlanova obitelji.\n\nEthnologica Dalmatica. 2004."},
        {heading:"Demografsko starenje (z. 32)",text:"(...) Trenutačno na svijetu živi 705 milijuna ljudi starijih od 65 i oko 680 milijuna djece do četiri godine života.\nZnanstvenici predviđaju da će do 2050. godine razlika biti još izraženija: na jedno dijete od četiri godine živjet će dvije osobe starije od 65.\n\nwww.tportal.hr, 2019."},
        {heading:"Sveto i profano — Durkheim (z. 33)",text:"Podjela svijeta na dva područja \u2013 od kojih jedno obuhva\u0107a sve što je sveto a drugo sve što je profano \u2013 jest distinktivna crta religijske misli. (...)\n\nNe može biti dru\u0161tva koje ne osje\u0107a potrebu da u pravilnim razmacima odr\u017eava i ja\u010da kolektivne osje\u0107aje i kolektivne ideje koje \u010dine njegovo jedinstvo i osebujnost. A to moralno obnavljanje mo\u017ee se posti\u0107i samo putem zborova, skupova i sabora na kojima pojedinci, tijesno zdru\u017eeni, zajedni\u010dki ponovno potvr\u0111uju svoje zajedni\u010dke osje\u0107aje. (...) Kakva je bitna razlika izme\u0111u, s jedne strane, skupa kr\u0161\u0107ana koji svetkuju glavne datume Kristova \u017eivota, ili pak \u017didova koji slave bilo izlazak iz Egipta bilo objavljenje Deset zapovijedi i, s druge strane, sastanka gra\u0111ana koji se sje\u0107aju utemeljenja neke nove moralne povelje ili kakva velikog doga\u0111anja u nacionalnom \u017eivotu?\n\nElementarni oblici religijskog \u017eivota, 2008."},
        {heading:"Klasni profil zatvorenika (z. 34)",text:"Odluka (\u2026) o pomilovanju korumpiranih politi\u010dara izazvala je \u0161trajkove u prenapućenim (\u2026) zatvorima te time u prvi plan istaknula pre\u010desto zanemarivani klasni profil zatvorenika. Dok s jedne strane stoje korumpirani politi\u010dari sposobni dati mito i na taj na\u010din izbje\u0107i zatvorske kazne, s druge strane imamo obespravljene najsiroma\u0161nije pripadnike dru\u0161tva osu\u0111ene zbog, primjerice, kra\u0111e elektri\u010dne energije ili posjedovanja narkotika.\n\nwww.bilten.org, 2016."},
        {heading:"Kulturni kapital i obrazovne nejednakosti (z. 35)",text:"Prema teoriji kulturnog kapitala (...) razmjerno trajni karakter obrazovnih nejednakosti proiz lazi iz \u010dinjenice da je obrazovni uspjeh u osnovi (pred)odre\u0111en klasnim razlikama u obiteljskoj socijalizaciji. Ove razlike u socijalizaciji imaju za posljedicu da djeca iz privilegiranih obitelji zapo\u010dinju i nastavljaju svoje \u0161kolovanje s vi\u0161e relevantnih vje\u0161tina i znanja; (...)\n\nU kona\u010dnici, klasne razlike u obiteljskoj socijalizaciji korespondiraju s razlikama u prilagodbi \u0161kolskom okru\u017eenju i \u0161kolskom uspjehu. Ovisno o koli\u010dini kulturnog kapitala s kojim raspola\u017eu, u\u010denici mogu vi\u0161e ili manje uspje\u0161no odgovoriti na nastavni\u010dka o\u010dekivanja i postavljene akademske standarde, prilagoditi im se ili o njima pregovarati s obrazovnim akterima (...). (...) sudjelovanje u\u010denika u aktivnostima vezanima uz umjetnost, klasi\u010dnu glazbu i knji\u017eevnost, ima utjecaj na ocjene u srednjoj \u0161koli koji je visoko zna\u010dajan.\n\nRevija za socijalnu politiku, 2018."}

  "2020_jesen": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Istraživanje života imigranata (z. 28)",text:"Znanstvenik koji istražuje život imigranata prati njihove svakodnevne aktivnosti kroz dulje vremensko razdoblje i provodi dubinske intervjue s njima."},
        {heading:"Stilovi i trendovi imućnih (z. 29)",text:"Različite vrste interesa imućnih i slavnih pojedinaca utječu na stvaranje novih stilova i trendova, npr. u prehrani, odijevanju ili uređenju interijera, koje slijede pripadnici drugih društvenih grupa širom svijeta."},
        {heading:"Prehrambeni obrasci i kulturni rituali (z. 30)",text:"U svakoj kulturi pronalazimo određene ponavljajuće obrasce u pripremanju i zajedničkome konzumiranju hrane za dane posta, blagdane, rođendane ili vjenčanja. Svakodnevnom pripremom i konzumacijom hrane u određeno doba dana stvaramo i održavamo kulturne obrasce koji čine društvenu strukturu, a da toga nismo ni svjesni."},
        {heading:"Weberovi idealni tipovi vlasti (z. 31)",text:"Zadatci se odnose na Weberove idealne tipove vlasti — racionalno-legalnu, tradicionalnu i karizmatsku vlast."},
        {heading:"Globalizacija i umrežavanje regija (z. 32)",text:"Tijekom povijesti širile su se trgovinske mreže i gospodarske institucije te su se regije Europe, Azije i Afrike, a kasnije i Amerike povezivale na različite načine. To je povezivanje utjecalo na širenje i razvoj industrije, organizaciju rada i proizvodnje, urbanizaciju i dominaciju gradskoga načina života. Suvremena je tehnologija značajno ubrzala umrežavanje različitih regija svijeta i ojačala svijest pojedinaca o svijetu kao jedinstvenoj cjelini."},
        {heading:"Struktura, institucije i latentne funkcije (z. 33)",text:"Terminom \u201estruktura\" se označava suodnošenje dijelova neke cjeline. (...)\n\nProučavanje institucija dovodi nas do zaključka da postoje različite razine funkcionalne analize. Prva razina tiče se individualnih uloga i njihovih funkcija, a druga raspravlja o funkciji institucija u društvu. U prvom slučaju riječ je o ulogama, a u drugom o institucijama. Naravno, instituciju zamišljamo kao da je sastavljena od pojedinačnih uloga ili od aktivnosti pojedinaca, no za institucionalnu razinu analize važan je kolektivni učinak svih pojedinačnih akcija. (...)\n\nNema nikakve sumnje da ljudi stvaraju i održavaju društvene strukture. No, kao što smo istakli, društvene strukture mogu proizvesti učinke koje ljudi, koji su stvorili te strukture, nisu ni predvidjeli ni očekivali. (...) Latentna funkcija podrazumijeva da su i društvena evolucija i integracija neplanirane i neočekivane. Time se u stvari želi reći da se integracija i evolucija odvijaju neovisno o motivaciji ljudi koji stvaraju društvene strukture.\n\nSociološka hrestomatija, 1990."},
        {heading:"Generacija Z i digitalni svijet (z. 34)",text:"Prije samo dvadeset godina nismo ni čuli za internet. Mislili smo da je najuzbudljivija stvar na svijetu televizija s deset kanala. A onda su se stvari u samo nekoliko godina promijenile. Na svijet je došla generacija Z, prva generacija 21. stoljeća. Za njih je CD vintage predmet (!), prijatelje nalaze preko društvenih mreža, njihove su dječje knjige čitane preko Kindlea i iPada, a www ih prati od samog rođenja. Oni žive u svijetu \u201eteganja\" i \u201elajkanja\", znaju kako sebe brendirati, brzo reagiraju i još brže se organiziraju. (...)\n\n(...) Svijet pred njihovim očima rapidno se mijenjao. Njihova je zemlja zadobila pridjev \u201etranzicijska\". Preobrazili su se pejzaži, gradovi, roditeljski poslovi, ulice, navike... Najezdom šoping centara gledali su kako stare stvari lete u smeće i kupuju se nove. Računali su da će dobiti najbolje i najkreativnije poslove. Nije tako ispalo. Život na kredit u tranzicijskom okruženju, a potom gospodarska kriza, oblikovali su socijalnu nesigurnost. Tranzicijski kapitalizam ponudio je mahom privremene poslove. Stoga ne čudi da je, uza sav tehnološki boom, omiljeni poslodavac u postsocijalističkoj zemlji poput Hrvatske postala – država.\n\nwww.jutranji.hr, 2015."},
        {heading:"Refleksivna modernost i društvo rizika (z. 35)",text:"Taj rizik ne potječe iz svijeta prirode, nego od refleksivne modernosti, odnosno intervencije znanja i tehnologije u svijet prirode. (...) Proizvedeni je rizik globalizirajući i prijeti bogatima i (mnogo više) siromašnima, svim klasama i svim društvima manjim ili većim intenzitetom. Izvanjski je rizik zamijenjen proizvedenim rizikom koji je visoke vjerojatnosti, odnosno predstavlja veću prijetnju. Proizvedeni rizici po karakteru mogu biti globalni (potencijalni nuklearni rat, ekološki rizici, globalne klimatske promjene, recesija i kolaps svjetske ekonomije, naftna kriza i terorizam) i individualni (rizici po život i zdravlje, rizici od genetički modificirane hrane, rizici po brak i obitelj, zarazne bolesti i slično).\n\nRevija za sociologiju, 2018."}
      ]
    },

  "2021_ljeto": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Istraživanje rodnih uloga u medijima (z. 28)",text:"Znanstvenik je posljednjih godinu dana uz pomoć zadane analitičke matrice pratio novinske članke, radioemisije i televizijske emisije kako bi analizirao patrijarhalnost i načine pisanja o rodnim ulogama u hrvatskome društvu."},
        {heading:"Vodoinstalater i anomija (z. 29)",text:"Vodoinstalater svakodnevno odlazi na posao koji voli te marljivo i teško radi kako bi sebi i obitelji osigurao egzistenciju. Njegovi kolege istodobno taj posao odrađuju bez imalo strasti i želje za profesionalnim uspjehom. Jedan od njegovih kolega želi postići uspjeh preko noći te preprodaje drogu jer smatra da poštenim radom to nikad neće postići."},
        {heading:"Marija i Dom za nezbrinutu djecu (z. 30)",text:"Nakon što je postala punoljetna, Marija se morala iseliti iz Doma za nezbrinutu djecu u kojemu je provela cijeli život. To ju je potaknulo na volonterski rad u udruzi za vrijeme studija socijalnoga rada kako bi nakon diplome mogla raditi i pomagati ostaloj punoljetnoj djeci koja moraju iseliti iz Doma za nezbrinutu djecu."},
        {heading:"Prestižni fakulteti i afirmativna akcija (z. 31)",text:"Prestižni fakulteti upisuju učenike koji su tijekom svojega dotadašnjeg školovanja imali najviše ocjene i najbolje rezultate na natjecanjima. Neki od tih fakulteta dodjeljuju bodove učenicima iz društveno depriviranih grupa kako bi i oni mogli upisati isti fakultet."},
        {heading:"Emisije CO\u2082 i društvo rizika (z. 32)",text:"Danas nam sve više prijete opasnosti od ekoloških katastrofa, emisije stakleničkih plinova, globalnih ekonomskih promjena ili genetički modificirane hrane, što su proizvodi moderne industrije. Tako rezultati Svjetske zdravstvene organizacije pokazuju da danas sve više udišemo onečišćeni zrak. Istraživanja u znanosti omogućuju da bolje razumijemo posljedice takvoga ponašanja pa već danas znamo da će se tijekom godina razviti određene bolesti, primjerice poremećaji dišnoga trakta i bolesti srca koje će skratiti život.\n\nGrafički prikaz 1. Antropogene emisije ugljikova dioksida u teragramima (Tg) od 1900. do 2007. godine. Trend je rastući.\n\nIzvor: Emisije stakleničkih plinova, 2014."},
        {heading:"Mead: značenje i društvena interakcija (z. 33)",text:"Koncept značenja vrlo je važan za Meada. Ponašanje je smišljeno onda kada koristimo našu svijest da bismo se stavili na mjesta drugih i tako bili u stanju interpretirati njihove misli i akcije. Međutim, ovdje, kao i drugdje, Mead smatra da značenja ne nastaju originalno iz svijesti, nego iz socijalne situacije. Značenje postoji u socijalnom djelovanju prije pojave svijesti o njemu. Jedna radnja je značajna ukoliko pokret ukazuje jednom akteru rezultat ponašanja drugog aktera. Značenje ne mora biti svjesno.\n\n(...) S tog stajališta, kritični moment u procesu razmišljanja je mogućnost privremenog inhibiranja akcija. To znači da i pokraj djelovanja stimulansa, ljudi ne moraju dati nužno željeni odgovor. Oni odlučuju o tome što žele, svjesno ispitujući cjeline alternativa prije negoli započnu reagirati u konkretnoj situaciji.\n\nIzvor: Suvremena sociologijska teorija, 1997."},
        {heading:"Tetovaže katolika u srednjoj Bosni (z. 34)",text:"(...) Obred ukrašavanja kože nije bio rezerviran za sve dane u kalendarskoj godini. Uobičajeno je bilo da sam proces tetoviranja započne na Ivandan (24. lipnja kada je blagdan sv. Ivana Krstitelja), Josipdan (na blagdan sv. Josipa 19. ožujka), Blagovijest (25. ožujak), Cvijetnicu (blagdan koji se slavi tjedan dana prije Uskrsa) ili na bilo koji dan u Velikome tjednu. Evidentno je da je tetovirački obred i u kalendarskome pogledu posjedovao konfesionalni karakter.\n\nSam događaj oslikavanja tijela za jednu porodicu ili obitelj predstavljao je svečanost. Riječ je o radosnoj ceremoniji kojoj su se svi veselili. Zato su i sam obred nazivali svečanošću dražesne ljubavi.\n\nIzvor: Tetovaže katolika u srednjoj Bosni \u2013 simbolički ornament duha i tijela, 2017."},
        {heading:"Greta Thunberg i pokret \u201ePetkom za budućnost\u201d (z. 35)",text:"Ona je ikona naraštaja mladih koji ustaje protiv klimatskih promjena. Šveđanka je sa 16 godina postala glasonošom milijuna zabrinute mladeži koji razvrstavaju svoje smeće, čiste plaže, okreću leđa mesu i zrakoplovima i glasaju za zelene.\n\n(...) Njezin \u201eškolski štrajk\u201d nakon nekoliko je tjedana privukao pažnju društvenih mreža, a potom i svjetskih medija čime je rođen pokret \u201ePetkom za budućnost\u201d. Fenomen je postao viralan.\n\n\u201eŠvedski školski kurikulum potiče kritičko razmišljanje učenika umjesto nagomilavanja znanja\u201d, naglasila je.\n\nIzvor: www.politikaplus.com"}
      ]

      sections: [
        {heading:"Kretanje BDP-a EU za vrijeme COVID-19 (z. 28)",text:"Grafički prikaz 1. Utjecaj pandemije bolesti COVID-19 na kretanje BDP-a u EU.\n\nVrijednosti: 3. kvartal 2019.: +1,60% | 4. kvartal 2019.: +1,20% | 1. kvartal 2020.: \u22122,50% | 2. kvartal 2020.: \u221214,10%\n\nIzvor: www.statista.com"},
        {heading:"Zapovjednici i vojnici (z. 29)",text:"Zapovjednici su odgovorni da zadaće svakoga vojnika budu obavljene točno, uspješno i na vrijeme, a to postižu upravljanjem, vođenjem i zapovijedanjem. Vojnici svoje zadaće moraju obaviti u skladu s postavljenim standardima. Dužnost je i pravo zapovjednika da vojnicima izdaje zapovijedi koje podređeni moraju bespogovorno izvršavati."},
        {heading:"Narodni plesovi i kulturna promjena (z. 30)",text:"Narodni plesovi često su neizbježan dio i vrhunac rituala, u prošlosti s naglašenom magijskom ulogom, a u suvremenome životu sa simboličkim značenjem u procesima identifikacije. Neki su narodni plesovi po svojstvima i raširenosti veće starine i ukorijenjenosti na tlu Hrvatske: (...) Kao svoju tradiciju Hrvati su s vremenom prihvatili i plesove susjednih europskih zemalja, koji su u određenome razdoblju bili popularni (...).\n\nIzvor: www.info.hazu"},
        {heading:"Ekološki projekti i održivi razvoj (z. 32)",text:"Kako bi potaknule društveno odgovorno ponašanje i veću brigu za očuvanje okoliša, pojedine trgovine pokrenule su niz projekata. Jedan je od takvih projekata poticanje na nekorištenje plastičnim vrećicama pri kupnji te njihovo ekološko zbrinjavanje i recikliranje."},
        {heading:"Online identitet i dramaturški pristup (z. 33)",text:"Igrači u online-okruženju imaju mogućnost predstavljati sebe na željeni način, dok im offline-okruženje (iza ekrana) služi kao priprema za izvođenje akcije. Akterovo ponašanje može biti drugačije u offline-okruženju od onoga koje predstavlja u online-okruženju.\n\n(...) Više sugovornika/ica je istaknulo da im je predstavljanje lakše u online-okruženju upravo iz razloga jer nitko ne zna tko su a i imaju mogućnost predstavljanja sebe kako žele: \u201ePrihvate me i takvu svakakvu kakvu se ja predstavim, u međuvremenu se ja prilagodin, postanem normalna\u201d (Sugovornica 1). Online-okruženje pruža mogućnost izvedbe i prezentacije različitih identiteta, korištenja alter ega i \u201eigranja\u201d s vlastitim identitetom. Nedostaje neverbalna komunikacija pa je olakšano \u201eupravljanje dojmom o sebi\u201d.\n\nIzvor: Moj avatar i ja, 2016."},
        {heading:"Prosvjedi Black Lives Matter (z. 34)",text:"(...) glasnogovornica pokreta Black Lives Matter navodi da su se prosvjednici okupili u znak solidarnosti s crnačkom zajednicom u SAD-u. Williams je istaknula da je prosvjed miroljubiv (...)\n\n(...) Pred policijskom stanicom okupile su se stotine ljudi, razbijeni su prozori, policija je upotrijebila suzavac i gumene metke. Ozbiljniji sukobi i paljevina krenuli su u srijedu, a prosvjednici su počeli s pljačkom dućana. U četvrtak je zapaljena policijska postaja.\n\nIzvor: www.vecernji.hr, www.tportal.hr"}
      ]

  "2022_ljeto": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Cooleyjev \u201eja u ogledalu\u201d (z. 15)",text:"\u201eDok gledamo svoje lice, figuru i odjeću u ogledalu, i zanimamo se za njih jer su naši, i zadovoljni smo s njima ili ne odgovaraju onome što bismo htjeli da budu; zamišljamo što drugi misle o našemu izgledu, manirima, ciljevima, djelima, karakteru, prijateljima itd., što utječe na naš stav o sebi.\u201d\n\nIzvor: prevedeno prema https://brocku.ca"},
        {heading:"Mislav — obiteljska farma sira (z. 29)",text:"Mislav sa svojim roditeljima, suprugom i dvoje djece živi na selu. Njegovi su roditelji završili samo osnovnu školu i skromno su zarađivali od poljoprivrede i male proizvodnje mlijeka. Kako bi im osigurao bolje uvjete života, završio je tečaj za licenciranoga proizvođača sira, podigao je kredit u banci te kupio krave i strojeve. Nakon nekoga vremena i dosta promašaja s receptima izrade sira, veliki trgovački lanac otkupio je njegov domaći dimljeni sir koji je dobio i nekoliko nagrada za izvrsnost. Posao mu ide sjajno, gradi novi proizvodni pogon i turistička potrošnja traži od njega nove proizvode. Kupio je novi automobil te svoju obitelj prvi put odveo na more."},
        {heading:"Goffman — kazalište i društvena uloga (z. 30)",text:"Prema Ervingu Goffmanu kada pojedinac nastupa pred drugim ljudima, kao u kazališnoj predstavi, od njih zahtijeva da ozbiljno uvaže dojam koji želi ostaviti, da vjeruju da stvarno posjeduje obilježja koja naizgled posjeduje te da će izvršiti zadatak koji treba izvršiti."},
        {heading:"Ivan — zatvor i resocijalizacija (z. 31)",text:"Ivan je nakon osam godina zatvora u kojemu je bio zbog razbojstva pušten na slobodu, zbog čega se našao u brojnim problemima. Nije imao gdje stanovati ni od čega živjeti, a i sa sestrom je bio u lošim odnosima. Roditelji su mu također bili u zatvoru zbog razbojstva i ovisništva te su svoje stavove i vrijednosti prenijeli i na njega. Preminuli su, ali za njima ne žali. Ivan je stalno započinjao nove poslove, ali ih nije uspio dovršiti. U zatvoru je uspio barem završiti školu za tesara, no ne zna kako će od toga živjeti. Jedino je siguran da ne želi više osjećati krivnju."},
        {heading:"Mekdonaldizacija društva (z. 33)",text:"Birokracija je, prema tome, kao i fast-food restoran, strogo definirana četirima sastavnicama formalne racionalnosti: učinkovitošću, predvidljivošću, kvantifikacijom i kontrolom kroz zamjenu humanih tehnologija nehumanima.\n\n(...) Razvoj McDonald\u2019sovih racionalnih načela obično se pripisuje Rayu Krocu, osnivaču McDonald\u2019sovog carstva. Osnovni McDonald\u2019sov pristup, međutim, razvila su braća Mac i Dick McDonald. Braća McDonald su na taj način pokrenula razvoj racionalizirane \u201efast-food tvornice\u201d.\n\nIzvor: Mekdonaldizacija društva, 1999."}
      ]
    },

  "2022_jesen": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Marija i potres (z. 10)",text:"Marija je živjela u Glini te je bila vlasnica trgovine mješovitom robom. Potres joj je oštetio kuću i trgovinu te nakon potresa mora živjeti u kontejnerskom smještaju. Budući da nema obitelj koja bi joj mogla pomoći i nema uvjete za mirovinu, trenutačno živi od socijalne pomoći za nezaposlene."},
        {heading:"Marko — student medicine na praksi (z. 14)",text:"Marko je na završnoj godini studija medicine i za buduće radno mjesto kao student odrađuje redovitu medicinsku praksu u bolnici. S vremena na vrijeme nailazi na pacijente koji mu prilaze i žele razgovarati s njim jer misle da je liječnik."},
        {heading:"Sukob učenika oko maturalnog putovanja (z. 18)",text:"Učenici 3.A razreda sukobili su se oko odabira destinacije koju preferiraju za maturalno putovanje."},
        {heading:"Ana — sukob uloga (z. 27)",text:"Ana je upisala fakultet i mora ići svaki dan na predavanja, ali joj se razboljela majka i trebala bi se stalno brinuti o njoj. Zbog toga se nalazi u nepovoljnoj situaciji jer mora odlučiti hoće li nastaviti studij ili će odustati od studija i brinuti se o bolesnoj majci."},
        {heading:"Prosvjed u Washingtonu (z. 29)",text:"U Washingtonu se dogodio masovni prosvjed koji je nastao spontanim okupljanjem i kulminirao je nasilnim ulaskom prosvjednika u Dom kongresnika. Sudionici prosvjeda nisu bili prije prosvjeda u trajnoj komunikaciji. Na prosvjedu su sudjelovale osobe različitih političkih orijentacija i nisu postojale vođe niti jasni ciljevi.\n\nNakon što su ušli u dom kongresnika, prosvjednici su ozlijedili i smrtno ranili nekoliko policajaca."},
        {heading:"John i Michael — generacijska pokretljivost (z. 30)",text:"John je liječnik podrijetlom iz Jamajke koji se doselio u Veliku Britaniju. Njegov unuk Michael priveden je u policiju jer je osumnjičen za pljačku trgovine. Tamo su uvidjeli kako Michael nije državljanin Velike Britanije, već je ilegalni migrant. Michael nije optužen za pljačku, ali je dobio rješenje o deportaciji na Jamajku. Michael nema više članova obitelji na Jamajki i ne zna ništa o Jamajki te sluša grime i navija za Arsenal."},
        {heading:"Porast razvoda braka (z. 32)",text:"Tijekom 2007. godine bilježili smo 19 razvoda na svakih 100 sklopljenih brakova, a 2012. godine skočili smo na čak 28 razvoda na 100 novih brakova.\n\nDrugim riječima, dok je jednostavna metoda podjele novih brakova s brojem razvoda pokazivala da se 2007. raspadao svaki peti brak, 2012. se godine raspadao gotovo svaki treći.\n\nHrvatska, dodaje, još dobro stoji u odnosu na sjeverne i zapadnoeuropske zemlje, gdje je omjer još nepovoljniji: u Austriji, primjerice, dolazi 40 razvoda na 100 brakova, a u Mađarskoj 35.\n\nZa takav razvoj situacije postoji nekoliko teorija. Demografi objašnjavaju da je u predindustrijskom društvu brak bio obveza. S industrijalizacijom i odlaskom u grad, djeca su sve manje korisna, traže velika ulaganja, a malo ili ništa ne pridonose. Ljudi postaju manje zainteresirani za djecu, a time i za brak, koji više nije obveza, nego izbor.\n\nIzvor: prilagođeno prema www.jutarnji.hr"},
        {heading:"Lalić i Torcida (z. 33)",text:"\u201eSve te gluposti koje su godinama pisali o nama u novinama, šta li su sve govorili, sve je to bilo najviše zbog toga što nas ti ljudi nisu poznavali, što su nas gledali sa strane ka neku gomilu divljaka. Da bi se nas shvatilo, mislim da bi se shvatila Torcida i naš đir, triba se uć unutra, među nas (...)\u201d (Lalić 1993: 76)\n\nLalić je istraživanje o navijačkoj kulturi provodio na, kako sam kaže, dvije godine i tri mjeseca dugom gostovanju na domaćem terenu. Ulazak među navijače značio je opipavanje bîla tadašnje mladeži i pouzdanu informaciju o njihovim razmišljanjima.\n\nIzvor: www.nacional.hr"}
      ]
    },

  "2023_ljeto": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Mila — asistentica i štrajk (z. 16)",text:"Mila je asistentica u nastavi i ima radni ugovor na određeno vrijeme. Uz njezinu pomoć slabovidna djevojčica Ana već tri godine svakodnevno uspješno svladava nastavne zadatke i stalno napreduje. No, Mila, kao i puno njezinih kolega asistenata, nikako ne mogu dobiti ugovor na neodređeno vrijeme te su se odlučili na štrajk.\n\nMila se na dan štrajka našla pred teškom dvojbom: treba li biti kolegica ostalim asistentima i otići u štrajk za radna prava, što podrazumijeva da će Anu ostaviti bez pomoći, ili treba i dalje pomagati Ani u nastavi, što isključuje podršku kolegama u štrajku."},
        {heading:"Zlatko — navijač i devijantnost (z. 29)",text:"Zlatko je oduvijek bio strastveni nogometni navijač. S ocem i starijim bratom odlazio bi na tribine i tamo učio kako navijati, kako razlikovati \u201enaše\u201d i \u201enjihe\u201d navijače te kako \u201eizmigoljiti\u201d policiji kada se unosi pirotehnika i navijački rekviziti.\n\nU zadnje vrijeme rijetko idu na utakmice zbog nedostatka novca. Otac je u mirovini, a brat se oženio pa mora brinuti o ženi i djetetu. Zlatko pokušava završiti srednju strojarsku školu i naći što prije posao. I njegov je otac bio alatničar u državnoj tvrtki, a brat je upisao Strojarski fakultet, no odustao je nakon dvije godine. Zlatko se, osim u obitelji, snalaženju naučio i na tribinama. Naučio se snaći kako kupiti jeftino, a prodati skupo te kako platiti malu kaznu ako ga uhvati policija."},
        {heading:"Maja — obiteljska pekarna (z. 30)",text:"Maja je u svojoj kući gazdarica. Voli da je sve na svojemu mjestu i da to vide gosti koji im dođu. Zajedno sa suprugom je godinama podizala svoju pekarnicu u kojoj je on radio danonoćno. Nisu trošili novac na nepotrebne stvari. Život im je bio skroman, pun odricanja, a svu su ušteđevinu ulagali u kuću i u budućnost svojih kćeri. Ako bi suprugu zatrebala pomoć, Maja bi bila tu za njega jer zna da bi i on njoj pomogao. On je uvijek bio odgovoran za pekarnicu, ali su sve važne životne odluke donosili zajedno. Obje su kćeri sada odrasle te pomažu Maji i njezinu suprugu."},
        {heading:"Viktor — psihijatrijska bolnica (z. 31)",text:"Za Viktora je prvi susret s grupom liječenih alkoholičara u psihijatrijskoj bolnici predstavljao popriličan šok, nikako si nije htio priznati da je ovisan o alkoholu. Razveden, napušten od djece i bliskih mu ljudi, bez posla — sve mu se to činilo prihvatljivim. Nakon što ga je liječnik zamolio da ostane i pažljivo sasluša, uočio je da s njima ima mnoge sličnosti te je odlučio ostati na liječenju. Liječnik ga je upozorio da mora pristati na pravila ponašanja u bolnici i raditi sve što zahtijeva terapija. Viktor je sutradan iznio priču o svojoj borbi s alkoholom te je prihvatio da mu treba pomoć."},
        {heading:"Thomas teorem i koronavirus (z. 33)",text:"\u201eČak i da sve ovo s koronavirusom jest nekakav tajni geopolitički sukob između poznatih ili nepoznatih sila — u što naravno uopće ne vjerujem — to je za svakodnevni život i izazove s kojima se ljudi suočavaju zapravo potpuno nebitno. Za svakodnevni život ljudi nisu presudne zavjere, nego mogu li kupiti kruh i hoće li biti škole te hoće li kroz ovu pandemiju proći zdravi. U sociologiji je poznat tzv. Thomasov teorem koji tvrdi da ako ljudi neku situaciju definiraju kao stvarnu, ona će imati stvarne posljedice.\n\nTrenutno, kao društvo imamo stvarnu situaciju neposredne ugroze zbog koronavirusa te se u skladu s time ponašamo. Zato ste vi danas i kupili u dućanu puna kolica namirnica. Svi osjećamo posljedice ove situacije. Ne moramo vjerovati u teorije zavjere da bi one utjecale na nas.\u201d\n\nIzvor: www.index.hr (doc. dr. sc. Valerija Barada)"}
      ]
    },

  "2023_jesen": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Udruživanje i društveni pokret (z. 12)",text:"Povezivanjem pojedinaca istih interesa ili ciljeva stvorile su se mnoge društvene grupe i organizacije. U suvremenome društvu udruživanje putem interneta i društvenih mreža omogućilo je inače nepovezanim pojedincima da budu društveni aktivisti i sudionici u istome protestu protiv kršenja ljudskih prava."},
        {heading:"Ivan — etiketiranje (z. 29)",text:"Ivan se uvijek spremao za svaku pisanu provjeru znanja, no kako zbog treninga nije stigao naučiti sve za jedan ispit, dio je odgovora napisao na ruku. Nastavnik ga je prilikom pokušaja prepisivanja uhvatio. Od toga je dana Ivan tijekom pisanja ispita znanja na svim nastavnim satima uvijek bio premješten u prvu klupu bez obzira što je dobivao visoke ocjene koje je zaslužio svojim trudom i učenjem."},
        {heading:"Navijači — subkultura i rituali (z. 30)",text:"Svaki nogometni sportski klub ima svoje navijače koji tomu klubu pružaju podršku motivirajući igrače da postignu što bolje rezultate na utakmicama. Oni čine društvenu grupu u kojoj su članovi međusobno povezani jakim osjećajem pripadnosti, a od ostalih se razlikuju po stilu života i odijevanja, navijačkome etičkom kodeksu i ponašanju. Utakmica kluba se ne propušta pa navijači prate svoj klub i u druge gradove. Od ostalih se navijačkih skupina razlikuju po šalovima, zastavama i transparentima. Svaka je utakmica popraćena isplaniranim i koordiniranim navijanjem sastavljenim od zajedničkoga pjevanja pjesama, skandiranja, isticanja transparenata i ostalih navijačkih rekvizita, za što sami igrači tvrde da ih ohrabruje i potiče da ulože maksimalan trud."},
        {heading:"Petra — meritokracija i funkcionalistička perspektiva (z. 31)",text:"Petra se od prvoga dana škole uvijek jako trudila i imala je najbolji školski uspjeh, što se nastavilo i na fakultetu koji je završila kao najbolji student na svojoj godini. Takav joj se rad isplatio jer je dobila dobro plaćen posao u struci putem natječaja isključivo zbog svoje kvalifikacije i prijašnjega truda. Nakon određenoga vremena Petri je na radnome mjestu ponuđena visoka funkcija na kojoj donosi važne odluke o poslovanju i financiranju te je zbog novostečenoga položaja i stručnosti postala vrlo ugledna u društvu."},
        {heading:"Obitelj, zajednica i društvena pokretljivost (z. 33)",text:"Bilo to dobro ili loše, lokalno okruženje u kojem živimo oblikuje naš život. To okruženje uključuje mjesta, ali i ljude među kojima živimo. Na mogućnosti uspjeha djece uvelike utječe način na koji njihove obitelji, lokalna zajednica i njezine javne i privatne službe reagiraju na odgoj i obrazovanje.\n\nBaš u obitelji djeca stječu svoja prva iskustva kroz učenje. Svoje okruženje prvo vide kroz oči članova svojih obitelji, dok doživljavaju reakcije obitelji na različite vanjske situacije. To može imati pozitivne ili negativne učinke na dječji razvoj, te na njihove sklonosti i želje u budućnosti.\n\nU područjima visoke nezaposlenosti i siromaštva u Engleskoj, škole bilježe reakcije i najmlađih učenika, od kojih jedan sedmogodišnjak izjavljuje kako 'nikad neće naći posao, jer se ni njegov tata i djed nikad nisu uspjeli zaposliti'.\n\nIzvor: Učenje u obitelji: kako obitelj postaje katalizator promjena, 2010."}
      ]
    },

    charts: [

        title: "Grafički prikaz 1. Broj urbanoga i ruralnoga stanovništva u svijetu od 1960. do 2020. godine (u milijardama)",

  "2024_ljeto": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Putopisac — etnografsko istraživanje (z. 6)",text:"Putopisac i njegova supruga putovali su godinu dana svijetom i istraživali što ljubav znači predstavnicima različitih kultura. Kroz to putovanje promatrali su, zabilježili i snimili živote 120 ljudi, od nomadskih lovaca i sakupljača do holivudskih celebrityija, kako bi saznali što za njih znače ljubav, brak, prevara i razvod."},
        {heading:"Maja — resocijalizacija u Japanu (z. 12)",text:"Maja je zbog posla prije godinu dana otišla živjeti u Japan. Iako je zadovoljna plaćom, imala je poteškoća s prihvaćanjem organizacije radnoga vremena i strogih društvenih pravila u Japanu. Maja je u razgovoru s prijateljicom rekla da je napustila svoja uvjerenja i počela usvajati strogu radnu etiku i nova pravila ponašanja."},
        {heading:"Stratifikacija je nužna (z. 21)",text:"U svakome društvu postoje privremeni, besperspektivni i slabo plaćeni poslovi, a siromašni i niže rangirani društveni slojevi osiguravaju radnu snagu za obavljanje takvih poslova. Zbog toga je društvena stratifikacija nužna i neophodna."},
        {heading:"Hrvatska nogometna reprezentacija (z. 22)",text:"Uspjesi hrvatske nogometne reprezentacije na svjetskim prvenstvima 2018. i 2022. godine osnažile su kult reprezentacije koja je u hrvatskome društvu potaknula zajedništvo te osjećaj ponosa i pripadnosti hrvatskoj državi."},
        {heading:"Hrvoje i socijalni kapital (z. 25)",text:"Hrvojeva je mama liječnica i ima veliki krug prijatelja od kojih su neki liječnici, odvjetnici i visoki državni službenici, a neki soboslikari i keramičari. Odrastajući od malih nogu u takvoj okolini, Hrvoje je naučio sklapati prijateljstva i poznanstva sa širokim krugom ljudi različitoga društvenog položaja."},
        {heading:"Okoliš i društvo rizika (z. 29)",text:"U posljednje vrijeme sve su glasnije rasprave o tome kako očuvati naš planet. Raspravlja se o zabrani proizvodnje automobila koji ostavljaju veći ugljični otisak kako bi se očuvala biološka raznolikost za sljedeće generacije. Znamo da je naš planet previše zagađen i da je čovjekova aktivnost dovela do toga zagađenja.\n\nTako je, primjerice, proizvodnja genetski modificirane hrane osigurala više hrane za sve što je dovelo do povećanja populacije, a povratno je povećanje populacije izazvalo porast industrijske proizvodnje, što je utjecalo na zagađenje zraka i tla. Život u takvome društvu postaje sve neizvjesniji i nesigurniji."},
        {heading:"Društvena pokretljivost u Danskoj i Brazilu (z. 30)",text:"Svjetski ekonomski forum objavio je izvještaj o društvenoj pokretljivosti pojedinaca u 82 države. Prema tome izvještaju, osobi rođenoj u Danskoj koja se rodi u obitelji s jako niskim primanjima, trebat će dvije generacije da dođe do srednjega ranga primanja. U Brazilu ili Južnoafričkoj Republici za dostizanje srednjega ranga primanja potrebno je čak devet generacija, ako se pretpostavi da će se rast i razvoj tih zemlja odvijati tempom kojim se danas razvijaju.\n\nIzvor: prema: www.lidermedia.hr, 2023."},
        {heading:"Skinheadi — subkultura i socijalni pokret (z. 32)",text:"Skinheadi su se pojavili u Velikoj Britaniji kasnih šezdesetih godina prošlog stoljeća. Izvorno taj pokret, u početku relativno nevažan, nije bio rasistički. Bio je reakcija na hipi kulturu i raspad britanskog gospodarstva. (...) hipici su imali dugu kosu i išli na mirovne prosvjede pa su skinheadi obrijali glavu i nasiljem se koristili kao sredstvom isticanja svoje muževnosti. Pokret skinheada, većina kojih je u to vrijeme potjecala iz radničke obitelji, dijelio je mnoge vrijednosti s imigrantima koji su bili na margini društva. I jedni i drugi slušali su ska i reggae glazbu. (...)\n\nTek su u kasnim sedamdesetima skinheadi uistinu počeli naginjati nasilju. Parola \u201enema budućnosti\u201d bio je jezgrovit izraz društvenoga nereda. Postao je radikalniji i počeo se buniti protiv rastućeg siromaštva i socioekonomske politike koja je marginalizirala mlade ljude iz radničkoga sloja. Skinsi su se suprotstavljali poretku i politici Margareth Thatcher te zanemarivanju bijele radničke klase.\n\nIzvor: Sport i nasilje u Europi, 2007."},
        {heading:"Cicourel — etiketiranje i delinkvencija (z. 33)",text:"Cicourel je svoje istraživanje proveo u dvama kalifornijskim gradovima sa po približno 100 000 stanovnika. Socioekonomske značajke stanovništva obaju gradova bile su slične. Prema strukturalnim teorijama, broj delinkvenata morao bi u oba grada biti sličan. Međutim, Cicourel je ustanovio znatnu razliku u broju uhićenih i optuženih delinkvenata. On tvrdi da se ta razlika može objasniti jedino veličinom, organizacijom, politikom i praksom službi za maloljetnike i policije.\n\nTako je grad s višom stopom delinkvencije zapošljavao više socijalnih radnika i imao iscrpnije dosjee; u drugome je gradu ta stopa izrazito fluktuirala ovisno o publicitetu koji slučaju daju lokalne novine ili o pritisku gradonačelnika. Stoga se može reći da društvena reakcija izravno utječe na stopu delinkvencije.\n\nPravda je rezultat dogovaranja u procesu interakcije. Proizvodnja delinkvenata ovisi o načinima organizacije službi za maloljetnike i policije, o njihovoj politici i o pritiscima lokalnih medija i političara.\n\nIzvor: Sociologija: teme i perspektive, 2002."}
      ]
    },

  "2024_jesen": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Matko — društvena pokretljivost (z. 23)",text:"Matko potječe iz radničke obitelji i čitav svoj radni vijek radi u osiguravateljskoj kući. Počeo je raditi kao prodavač automobilskoga osiguranja i paralelno s radom upisao je izvanredni studij prava. Nakon završenoga fakulteta napredovao je na radna mjesta voditelja odjela i kasnije ravnatelja podružnice. Prije dvije godine postao je i član uprave. S primanjima voditelja odjela i ravnatelja živio je kao i ostali pripadnici srednjega sloja, a sada s primanjima člana uprave napokon može sebi priuštiti stvari koje većina ljudi može samo zamišljati."},
        {heading:"Martin — gubitak posla i alkoholizam (z. 29)",text:"Martin je bio vrijedan radnik koji svoje poslove nije uspijevao dugo zadržati. Školovao se za postolara i neko je vrijeme radio u malome obrtu koji je proizvodio muške cipele po mjeri. Zbog uvoza jeftinih cipela posao je polako propadao. Dobio je otkaz i prekvalificirao se. Nakon samo nekoliko mjeseci otkako je dobio posao skladištara, uslijedio je novi otkaz jer je firma uvela sustav automatskoga skladištenja robe. Martin više nije znao kako dalje. Gubio je svaku nadu i sve je češće rješenje tražio u alkoholu."},
        {heading:"Mirela i roditelji — obitelj i ekonomska funkcija (z. 30)",text:"Mirela je zbog studija preselila u drugi grad, ali je od studiranja odustala nakon druge godine. Vratila se roditeljima uvjerena da od studiranja neće biti prevelike koristi. Roditelji su joj pred mirovinu. Otac je grafičar i radi u tiskari, a majka je blagajnica u supermarketu. Podržali su njezino odustajanje od fakulteta jer ni oni nemaju visoko obrazovanje. Mirela je dobila posao u supermarketu gdje radi i njezina majka koja će uskoro u mirovinu pa će je Mirela zamijeniti na radnom mjestu blagajnice. Mirelinim roditeljima odgovara da ona ostane živjeti s njima i pomogne im održavati kućanstvo."},
        {heading:"Ured socijalne skrbi — grupe i birokracija (z. 31)",text:"Odmah nakon posla zaposlenici Ureda socijalne skrbi zajedno bi otišli u obližnji kafić. Dinamičnu i profesionalnu komunikaciju kolega iz ureda zamijenila bi opuštena i spontana komunikacija prijatelja. U uredu se znalo točno tko ima kakvu funkciju i odgovornost, dok su se u kafiću te granice pomiješale. Takva su im druženja bila potrebna kao \u201eispušni ventil\u201d jer su se tijekom dana susretali s teškim sudbinama ljudi. Koliko god su željeli pomoći, morali su poštivati zakone i tretirati ljude kao pravne predmete."},
        {heading:"Društvenost i usamljenost (z. 33)",text:"Ljudska društvenost je važna čak i u suvremenim individualističkim društvima. Gotovo 80 % naše budne svakodnevice provodimo s drugima, a vrijeme provedeno s prijateljima, rođacima, supružnikom, djecom i kolegama izravno se ocjenjuje korisnijim od vremena provedenog u samoći. Ljudi su takva bića koja pridaju značenje društvenim odnosima koji fizički čak ni ne postoje (npr. između autora i čitatelja, između pojedinca i Boga) ili kada nije moguća uzajamnost (npr. u imaginarnim odnosima s televizijskim likovima). Suprotno tomu, društvenu izolaciju opažamo i kada društvene veze i odnosi postoje, ali nemamo sposobnost iskoristiti snagu te povezanosti u svakodnevnome životu. Kronični doživljaj izolacije (tj. usamljenost) karakteriziraju poremećaji pažnje, spoznaje, osjećanja i ponašanja koji uzimaju danak pobolijevanju i smrtnosti.\n\nIzvor: Loneliness Matters. Annals of Behavioral Medicine, 2010."}
      ]
    },

  "2025_ljeto": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Andreja — sutkinja i štrajk (z. 15)",text:"Andreja je sutkinja koja 20 godina sudi na općinskome sudu. Radi na puno različitih predmeta i prilično je opterećena poslom, zbog čega provodi premalo vremena sa svojom obitelji. Plaća koju prima za svoj rad je niska za stupanj obrazovanja koji je stekla, kao i za odgovornost koju ima kao sutkinja, stoga se s drugim sucima odlučila na štrajk. Suci žele veću plaću, primjerenu njihovu zasluženom, visokom profesionalnom i društvenom položaju."},
        {heading:"Siromaštvo je korisno (z. 21)",text:"Usprkos uvriježenomu mišljenju da je siromaštvo loše za društvo, ono je zapravo korisno jer povezuje različite društvene slojeve u svrhovitu cjelinu. Najugroženiji pripadnici nižega društvenog sloja trebaju ekonomsku pomoć i druge oblike pomoći, a nju dobivaju od profesionalaca iz srednjega sloja koji su školovani za tu zadaću. Pripadnici viših slojeva, poput političara, imaju zadaću donošenja pravila i zakona kojima se reguliraju prava i obveze u području socijalne skrbi i socijalnih politika sa svrhom pomoći siromašnima. Na taj se način osigurava društvena stabilnost."},
        {heading:"Inga — voditeljica i sukob uloga (z. 29)",text:"Inga je bila uspješna zaposlenica jedne medijske tvrtke. Napredovala je do pozicije voditeljice odjela i bila je sretna, ali onda je uočila promjenu u ponašanju svojih kolega. Čim bi ušla u prostoriju, razgovor bi utihnuo. Shvatila je da postoji nevidljivi zid koji je dijelio njihovo ponašanje kad je bila prisutna od onoga kad bi izašla. Pred njom su se svi ponašali službeno, a ona je htjela i dalje biti uključena u njihove šale, druženja i razgovore. Osjećala se odsječeno i pitala je li dobro odlučila kada je prihvatila voditeljsku poziciju. Iako je bila njihova nadređena, željela je da ju kolege smatraju prijateljicom."},
        {heading:"Marko i Zoran — pokretljivost i klasa (z. 30)",text:"Marko i Zoran su odrasli zajedno. U kvartu su se stalno družili sve dok Zoran, nakon što je završio fakultet i zaposlio se na dobro plaćenom radnom mjestu u banci, nije počeo mijenjati navike. Njegova priča bila je \u201efilmska\u201d: učlanio se u političku stranku i vjenčao se s mladom poduzetnicom čiji je otac vlasnik uspješne tvrtke u drvnoj industriji. Napredovao je u poslu, upoznavao je puno važnih ljudi i imao idiličan obiteljski život s dvoje male djece. Marko nije završio fakultet, radi u lokalnom fast-food restoranu, neoženjen je i živi s roditeljima. Marko je i dalje pripadao kvartovskom radništvu, a Zoran je postao dio elite."},
        {heading:"Vana, Vedran i smartphoneovi (z. 31)",text:"Prije pojave mobilnih telefona mladi su u interakciji s roditeljima, braćom, sestrama i prijateljima dobivali punu pažnju. Danas se mladi moraju nositi s roditeljima koji su fizički blizu, na dodir, ali mentalno negdje drugdje. Vana, koja živi sama s roditeljima, kaže kako njezina majka ne podiže pogled sa smartphonea da pozdravi kćer kada automobilom dođe po nju u školu. Vedran kaže da mu se više sviđalo kad je njegov otac imao stolno računalo. Sada on, otac, brat i majka zajedno sjede na trosjedu te gledaju film, ali otac istovremeno gleda u svoj smartphone.\n\nPrilagođeno prema: Sami zajedno, 2012."},
        {heading:"Društvene mreže i slika o sebi (z. 33)",text:"Način na koji sebe doživljavamo rezultat je toga kakvi smo, kakvi bismo željeli biti i kakvi mislimo da bismo trebali biti unutar društva u kojemu živimo. (...) Svi smo motivirani smanjiti jaz između tih doživljaja sebe. To može biti pozitivno jer usporedba s boljom slikom o sebi može potaknuti osobni napredak. Suprotno, neuspjeh u premošćivanju toga jaza može rezultirati nezadovoljstvom i razočaranjem.\n\nDruštvene mreže značajno pridonose nerealnim uzorima i potrebama s obzirom na pretjerano samopredstavljanje korisnika i brutalnu društvenu usporedbu prema sveprisutnim kriterijima ljepote i slave. (...) Dok ljudska bića danas imaju više mogućnosti usporedbe s drugima nego ikad prije, od neprocjenjive je važnosti svijest da život kakav se prikazuje na društvenim mrežama nije isto što i život u stvarnome svijetu.\n\nPrilagođeno prema: Social media, social comparison and mental health. Nursing times, 2020."}
      ]
    },

  "2025_jesen": {
    article: {
      title: "Tekstovi uz zadatke",
      sections: [
        {heading:"Japanska kultura i dob (z. 9)",text:"U japanskoj kulturi najstariji članovi društva pri vrhu su društvene ljestvice jer se njihovo iskustvo i životna mudrost visoko cijene. Odanost, vjernost obitelji i pokoravanje starijemu tri su osnovne vrijednosti kojima su se u društvu regulirali hijerarhijski odnosi utemeljeni na vlasti, krvnom srodstvu i starosti."},
        {heading:"Pleme Kaningara — ritual prijelaza (z. 19)",text:"Na Novoj Gvineji postoji pleme Kaningara čiji pripadnici vjeruju da su potomci krokodila i stoga se svim dječacima u plemenu s navršenih 12 godina naoštrenim bambusovim štapićima zarezuje trup da bi ožiljci podsjećali na krokodilovu glavu i ljuske. Ožiljci predstavljaju tragove zuba krokodila koji je progutao dječake, a povrativši ih preobrazio u muškarce. Nakon urezivanja ožiljaka dječake smatraju odraslim muškarcima."},
        {heading:"Liječnici i suci — funkcionalistička stratifikacija (z. 22)",text:"Pojedinci koji obavljaju poslove za koje je potrebno dugotrajno obrazovanje te vladanje posebnim vještinama i znanjima, a važni su za društvo poput liječnika i sudaca, povlašteni su i treba ih nagraditi višim plaćama od pojedinaca koji obavljaju jednostavnije poslove."},
        {heading:"Simboli, dijade i trijade — Simmel (z. 29)",text:"Za društveni život vrlo je bitno da se akteri koriste zajedničkim simbolima. Procesi razmišljanja, djelovanja i interakcije olakšani su činjenicom da značajni simboli imaju zapravo isto značenje za sve, potičući iste reakcije kod ljudi koji se njima koriste, kao i kod onih koji na njih reagiraju. (...)\n\nGeorg Simmel razlikuje dva temeljna oblika interakcije s obzirom na bliskost i međusobnu povezanost članova grupe. Grupe od dvaju članova među kojima se razvija bliska, intimna i povjerljiva veza naziva dijadama, a višebrojne grupe u kojima članovi dijele iste interese i ostvaruju svrhovite veze naziva trijadama.\n\nPrilagođeno prema: Suvremena sociologijska teorija, 1997."},

// vježbanje je ograničeno na `allowed` ispite, a razrada rezultata je zaključana kad lockResults.
function socBridge(){try{return window.__SOC_BRIDGE__||{};}catch(e){return {};}}

// Fail-closed kao i lockResults: bez `allowed` liste vježbanje je otvoreno samo ako
// razrada nije zaključana (plaćeni tier ili standalone otvaranje). Dok DISCERE_CONFIG
// ne stigne, safety boot (6 s) tako ne otključa svih 32 ispita free korisniku.
function socAllowed(k){const b=socBridge();return b.allowed?b.allowed.has(k):!b.lockResults}
// DISCERE_CONFIG NIJE jednokratna poruka: roditelj tier razrješava asinkrono, pa
// prva konfiguracija zna biti 'free' i ispravak stiže tek nakon boota. Ekrani koji
// most čitaju pri renderu (rezultati, statistika, značke na Homeu) moraju se na to
// prebojiti — inače plaćeni korisnik do kraja sesije gleda zaključanu razradu.
// Bridge je globalan i mijenja ga poruka izvan Reacta, pa pretplata ide na događaj.
function useSocBridge(){
  const[,bump]=React.useState(0);
  React.useEffect(function(){
    function onChange(){bump(function(n){return n+1});}
    window.addEventListener("soc-bridge-change",onChange);
    return function(){window.removeEventListener("soc-bridge-change",onChange);};
  },[]);
  return socBridge();
}

function nrm(s){return String(s||"").toLowerCase().trim().replace(/[.,!?;:]/g,"")}
function hasAns(a){if(a===undefined||a===null||a==="")return false;if(Array.isArray(a))return a.length>0;if(typeof a==="object")return Object.keys(a).length>0;return true}
/** Odgovor sveden na popis oznaka — polje ostaje polje, tekst se rastavlja na znakove. */
function asList(v){if(Array.isArray(v))return v;if(typeof v==="string")return[...v];return[]}
/**
 * Provjeri jedan odgovor. `null` = ne ocjenjuje se automatski (sa/es, pitanje bez
 * ključa, mc s cl==="?").
 *
 * OVO JE BLIZANAC `chk` IZ lib/sociologija/scoring.js i mora ostati doslovno
 * isti: plaćeni tier ocjenjuje ovdje (ima ključeve u pregledniku), free na
 * poslužitelju, a rezultat se ne smije razići. Paritet drži test koji ovu
 * funkciju acornom izvlači ravno iz isporučenog HTML-a
 * (__tests__/discere/soc-scoring-parity.test.js).
 *
 * `if(!q||!q.sol) return null` je uvjet bez kojega engine PUCA, a ne degradira:
 * free korisnik u ispitnom modu dobiva sva pitanja bez ključa (ADR-001), a i u
 * izvoru postoje tri `mc` pitanja bez `sol` (2018_jesen: 33_1, 34_1, 35_1).
 */
function chk(q,a){
  if(!q||!q.sol)return null;
  if(q.type==="mc")return q.sol.cl==="?"?null:a===q.sol.cl;
  if(q.type==="ms")return[...asList(q.sol.cls)].sort().join(",")===[...asList(a)].sort().join(",");
  if(q.type==="mat"){
    if(!Array.isArray(q.sol.pairs))return null;
    if(!a||typeof a!=="object")return false;
    return q.sol.pairs.every(p=>a[p.l]===p.r);
  }
  if(q.type==="fb"){const ac=q.sol.alt||[q.sol.ans];return asList(ac).some(x=>nrm(x)===nrm(a))}
  return null
}
/** Nosi li pitanje ključ? Prekidač iz ADR-001: bez njega rezultat daje poslužitelj. */
function hasKey(q){return !!(q&&q.sol)}
function grade(p){return p>=85?5:p>=70?4:p>=55?3:p>=40?2:1}

function useTimer(tot,run,onExpire,onWarn){
  const[s,setS]=useState(tot);
  const warned=React.useRef({ten:false,five:false,zero:false});
  useEffect(()=>{
    if(!run||s<=0){
      if(s<=0&&!warned.current.zero){warned.current.zero=true;if(onExpire)onExpire();}
      return;
    }
    const id=setInterval(()=>setS(x=>{
      const ns=Math.max(0,x-1);
      if(ns===600&&!warned.current.ten){warned.current.ten=true;if(onWarn)onWarn(600);}
      if(ns===300&&!warned.current.five){warned.current.five=true;if(onWarn)onWarn(300);}
      if(ns===0&&!warned.current.zero){warned.current.zero=true;if(onExpire)onExpire();}
      return ns;
    }),1000);
    return()=>clearInterval(id);
  },[run,s]);
  return{s,d:String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
}

function MatQ({q,a,setA,rev}){
  const cur=a||{};
  // Bez ključa (free u ispitnom modu) pitanje se i dalje RJEŠAVA — samo se ne
  // boji. Prazan popis parova je jedini oblik koji to izražava bez grananja na
  // svakom mjestu ispod.
  const pairs=(q.sol&&Array.isArray(q.sol.pairs))?q.sol.pairs:[];
  const[activeLeft,setActiveLeft]=React.useState(null); // which left item is selected

  function handleLeftClick(lft){
    if(rev) return;
    // If already matched, click again to unmatch
    if(cur[lft]){
      setA({...cur,[lft]:""});
      setActiveLeft(null);
      return;
    }
    setActiveLeft(lft===activeLeft?null:lft);
  }

  function handleRightClick(opt){
    if(rev||!activeLeft) return;
    // If this option is already used by another left item, swap
    const usedBy = Object.entries(cur).find(([k,v])=>v===opt&&k!==activeLeft)?.[0];
    const newA = {...cur,[activeLeft]:opt};
    if(usedBy) newA[usedBy]=""; // free the swapped one
    setA(newA);
    setActiveLeft(null);
  }

  const usedOpts = new Set(Object.values(cur).filter(Boolean));

  return e("div",{className:"mat-mobile"},
    // Instructions when nothing selected
    !rev&&!activeLeft&&e("div",{style:{fontSize:12,color:"var(--gold)",marginBottom:4}},
      "👆 Klikni pojam s lijeve strane, zatim odaberi odgovarajući s desne."
    ),
    !rev&&activeLeft&&e("div",{style:{fontSize:12,color:"var(--blue)",marginBottom:4}},
      "✦ Odabrano: \""+activeLeft+"\" — klikni odgovarajući opis s desne."
    ),

    // Left items (terms to match)
    e("div",null,
      e("div",{className:"mat-mobile-section-title"},"Pojmovi"),
      e("div",{className:"mat-left-list"},
        q.items.map((lft,i)=>{
          const cr=pairs.find(p=>p.l===lft)?.r;
          const ch=cur[lft]||"";
          const isActive=activeLeft===lft;
          const isMatched=!!ch;
          const ok=rev&&ch===cr;
          const bad=rev&&ch&&ch!==cr;
          const cls=ok?"ok":bad?"bad":isActive?"active":isMatched?"matched":"idle";
          return e("div",{key:i,className:"mat-left-item "+cls,onClick:()=>handleLeftClick(lft)},
            e("span",null,lft),
            ch&&e("span",{className:"mat-left-badge"},rev?"":"✓")
          );
        })
      )
    ),

    // Right items (options to choose from)
    e("div",null,
      e("div",{className:"mat-mobile-section-title"},"Opisi / Definicije"),
      e("div",{className:"mat-right-list"},
        q.opts.map((opt,j)=>{
          const isUsed=usedOpts.has(opt);
          const usedByKey=Object.entries(cur).find(([k,v])=>v===opt)?.[0];
          const isSelectable=!!activeLeft&&(!isUsed||usedByKey!==undefined);
          const ok=rev&&pairs.some(p=>p.r===opt&&cur[p.l]===opt);
          const bad=rev&&isUsed&&!ok;
          const cls=ok?"ok":bad?"bad":isUsed&&!isSelectable?"used":isSelectable?"selectable":"idle";
          return e("div",{key:j,className:"mat-right-item "+cls,
            onClick:()=>isSelectable&&handleRightClick(opt)},
            opt
          );
        })
      )
    ),

    // Summary of matched pairs
    Object.entries(cur).some(([k,v])=>v)&&!rev&&e("div",null,
      e("div",{className:"mat-mobile-section-title",style:{marginTop:4}},"Tvoji parovi"),
      e("div",{className:"mat-pairs-summary"},
        q.items.filter(lft=>cur[lft]).map((lft,i)=>e("div",{key:i,className:"mat-pair-row"},
          e("span",{className:"mat-pair-left"},lft),
          e("span",null,"→"),
          e("span",{className:"mat-pair-right"},cur[lft])
        ))
      ),
      e("button",{className:"mat-clear-btn",onClick:()=>{setA({});setActiveLeft(null);}},
        "✕ Poništi sve")
    ),

    // Review mode: show correct pairs
    rev&&e("div",{className:"mat-pairs-summary"},
      q.items.map((lft,i)=>{
        const cr=pairs.find(p=>p.l===lft)?.r;
        const ch=cur[lft];
        const ok=ch===cr;
        return e("div",{key:i,className:"mat-pair-row",
          style:{borderLeft:"3px solid "+(ok?"var(--green)":"var(--red)"),paddingLeft:8}},
          e("span",{className:"mat-pair-left"},lft),
          e("span",null,"→"),
          e("span",{className:"mat-pair-right",style:{color:ok?"var(--green)":"var(--red)"}},ch||e("em",null,"(nije odgovoreno)")),
          !ok&&e("span",{style:{fontSize:11,color:"var(--muted)",marginLeft:8}},"✓ "+cr)
        );
      })
    )
  );
}

function generateSAHint(q, ans){
  const qLow = q.toLowerCase();
  const hasAlt = ans && ans.includes("/");
  const hasMultiple = ans && ans.includes(",") && !hasAlt;
  const isLong = ans && ans.length > 100;
  const isNumber = ans && /^\d|oko \d|%/.test(ans);
  let whatToLook = null;
  if(/kako se naziva|kako se zove|koji je naziv|što je naziv/.test(qLow))
    whatToLook = "Traži se naziv/pojam — jednom riječju ili kratkom frazom.";
  else if(/koji.*razlika|razlika između|od čega ovisi/.test(qLow))
    whatToLook = "Traži se razlika ili odnos između pojmova.";
  else if(/tko sačinjava|tko čini|od koga se sastoji/.test(qLow))
    whatToLook = "Traži se popis članova ili sastavnica.";
  else if(/koje su dvije|koja su dva|navedi dva|nabroji/.test(qLow))
    whatToLook = "Traže se točno dva elementa — navedi oba.";
  else if(/kolika je|koliko|koji postotak|koji broj/.test(qLow))
    whatToLook = "Traži se numerički podatak — iz teksta ili tablice.";
  else if(/zašto|zbog čega|koji su razlozi/.test(qLow))
    whatToLook = "Traži se uzrok ili obrazloženje — navedi razlog.";
  else if(/definir|što znači|što je/.test(qLow))
    whatToLook = "Traži se definicija — kratko i precizno.";
  const keywords = (ans||"")
    .split(/\/|,|\s+i\s+/)
    .map(s=>s.trim())
    .filter(s=>s.length>2&&s.length<40);
  let formatHint = null;
  if(hasAlt) formatHint = "Prihvaćaju se oba oblika odgovora — oba su točna.";
  else if(hasMultiple) formatHint = "Traže se "+keywords.length+" elementa — navedi sve.";
  else if(isLong) formatHint = "Duži odgovor — objasni ukratko, nije potrebno opširno.";
  else if(isNumber) formatHint = "Odgovor je broj ili postotak — čitaj iz teksta/tablice.";
  return { whatToLook, keywords, formatHint };
}

function FeedbackBox({q,a,rev,elapsed,avgTime}){
  if(!rev||q.type==="sa"||q.type==="es")return null;
  // Bez ključa nema što reći. Bez ovog izlaza bi free korisnik u ispitnom modu

  // Pomoćna funkcija za prikaz vremena
  function timingBadge(){
    if(!elapsed||elapsed<=0) return null;
    const isSlower = avgTime&&elapsed>avgTime*1.5;
    const isFaster = avgTime&&elapsed<avgTime*0.7;
    const col = elapsed>90?"var(--red)":elapsed>45?"var(--gold)":"var(--green)";

        padding:"2px 7px",borderRadius:99
      }},elapsed+"s"),
      avgTime&&e("span",null,

          ? e("span",{style:{color:"var(--red)"}},"sporije od prosjeka")

            ? e("span",{style:{color:"var(--green)"}},"brže od prosjeka ✓")

      )
    );
  }

  if(q.type==="mat"){
    const ok=q.sol.pairs.every(p=>(a||{})[p.l]===p.r);
    return e("div",{className:"fb "+(ok?"ok":"bad")},
      e("div",{className:"fbtitle"},ok?"✓ Točno!":"✗ Netočno"),
      !ok&&e("div",{className:"fbtext"},"Točni parovi: "+q.sol.pairs.map(p=>p.l+" → "+p.r).join(" · ")),
      timingBadge())
  }
  if(q.type==="fb"){
    const ac=q.sol.alt||[q.sol.ans],ok=ac.some(x=>nrm(x)===nrm(a));
    return e("div",{className:"fb "+(ok?"ok":"bad")},

  const ok=chk(q,a);
  if(ok===null) return null;

const XP_LEVELS = [0,100,250,450,700,1000,1400,1900,2500,3200,4000];
function getLevel(xp){ let l=0; for(let i=0;i<XP_LEVELS.length;i++){if(xp>=XP_LEVELS[i])l=i;} return l; }
function xpToNext(xp){ const l=getLevel(xp); return XP_LEVELS[l+1]?XP_LEVELS[l+1]-xp:0; }
function xpProgress(xp){ const l=getLevel(xp),base=XP_LEVELS[l],next=XP_LEVELS[l+1]; return next?Math.round((xp-base)/(next-base)*100):100; }
const LEVEL_NAMES = ["Početnik","Učenik","Marljivac","Znalac","Stručnjak","Majstor","Expert","Virtuoz","Znanstvenik","Akademik","Profesor"];

function saveUserData(data){

}

function calcXpGain(pct, totalQ){
  let xp = Math.round(pct * 0.8);       // base: % * 0.8
  if(pct >= 85) xp += 30;               // bonus odlicni
  else if(pct >= 70) xp += 15;          // bonus vrlodobar
  if(pct === 100) xp += 50;             // perfectionist
  return Math.max(5, xp);
}

function updateStreak(data){
  const today = new Date().toDateString();
  const last = data.lastDate;
  if(last === today) return data; // already updated today
  const yesterday = new Date(Date.now()-86400000).toDateString();
  const newStreak = last === yesterday ? data.streak + 1 : 1;
  return {...data, streak: newStreak, lastDate: today};
}

function useUserData(){
  const[userData, setUserData] = useState(()=>loadUserData());
  const update = (fn) => {
    setUserData(prev => {
      const next = fn(prev);
      saveUserData(next);
      return next;
    });
  };
  return [userData, update];
}

function TrendGraph({history}){
  const[tooltip,setTooltip]=React.useState(null);
  if(!history||history.length===0) return e("div",{className:"trend-empty"},"📈 Nema podataka — riješi barem jedan ispit.");
  
  const W=560,H=180,PAD={t:20,r:20,b:40,l:40};
  const iW=W-PAD.l-PAD.r, iH=H-PAD.t-PAD.b;
  const GC={1:"var(--red)",2:"#f97316",3:"var(--gold)",4:"#60a5fa",5:"var(--green)"};
  
  const data = history.slice(-10); // last 10
  const n = data.length;
  const xStep = n>1 ? iW/(n-1) : 0;
  
  function xPos(i){ return PAD.l + (n>1 ? i*xStep : iW/2); }
  function yPos(pct){ return PAD.t + iH - (pct/100)*iH; }
  
  // Build polyline path
  const pts = data.map((h,i)=>xPos(i)+","+yPos(h.pct));
  const linePath = pts.join(" ");
  
  // Area fill path
  const areaPath = `M${xPos(0)},${PAD.t+iH} ` + 
    data.map((h,i)=>`L${xPos(i)},${yPos(h.pct)}`).join(" ") +
    ` L${xPos(n-1)},${PAD.t+iH} Z`;
  
  // Y gridlines at 40,55,70,85 (grade boundaries)
  const gridLines = [40,55,70,85];
  const gradeNames = {40:"Dovoljan",55:"Dobar",70:"Vrl.dobar",85:"Odličan"};
  
  const avgPct = Math.round(data.reduce((a,h)=>a+h.pct,0)/n);
  const trend = n>=3 ? data.slice(-3).reduce((a,h)=>a+h.pct,0)/3 - data.slice(0,Math.min(3,n)).reduce((a,h)=>a+h.pct,0)/Math.min(3,n) : 0;
  
  return e("div",{className:"trend-wrap"},
    e("svg",{className:"trend-svg",viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"xMidYMid meet"},
      // Grid lines
      ...gridLines.map(pct=>e("g",{key:pct},
        e("line",{x1:PAD.l,y1:yPos(pct),x2:W-PAD.r,y2:yPos(pct),stroke:"var(--bdr2)",strokeWidth:1,strokeDasharray:"4 4"}),
        e("text",{x:PAD.l-4,y:yPos(pct)+4,textAnchor:"end",fontSize:9,fill:"var(--muted)"},pct+"%")
      )),
      // Area
      n>1&&e("path",{d:areaPath,fill:"var(--gold)",fillOpacity:.06}),
      // Line
      n>1&&e("polyline",{points:linePath,fill:"none",stroke:"var(--gold)",strokeWidth:2.5,strokeLinecap:"round",strokeLinejoin:"round"}),
      // Average line
      n>=3&&e("line",{x1:PAD.l,y1:yPos(avgPct),x2:W-PAD.r,y2:yPos(avgPct),stroke:"rgba(255,255,255,.2)",strokeWidth:1,strokeDasharray:"6 3"}),
      // X labels
      data.map((h,i)=>e("text",{key:i,x:xPos(i),y:H-6,textAnchor:"middle",fontSize:9,fill:"var(--muted)"},
        h.examLabel?.replace("Sociologija — ","")?.slice(0,8)||""
      )),
      // Points
      data.map((h,i)=>e("circle",{
        key:i,className:"trend-point",
        cx:xPos(i),cy:yPos(h.pct),r:5,
        fill:GC[h.grade]||"var(--gold)",stroke:"var(--bg)",strokeWidth:2,
        onMouseEnter:(ev)=>{
          const rect=ev.currentTarget.closest("svg").getBoundingClientRect();
          setTooltip({x:xPos(i),y:yPos(h.pct),data:h,i});
        },
        onMouseLeave:()=>setTooltip(null)
      }))
    ),
    // Tooltip
    tooltip&&e("div",{className:"trend-tooltip",style:{
      left:Math.min((tooltip.x/560*100),75)+"%",
      top:(tooltip.y/180*100-20)+"%"
    }},
      e("strong",{style:{color:GC[tooltip.data.grade]||"var(--gold)"}},
        "Ocjena "+tooltip.data.grade+" — "+tooltip.data.pct+"%"
      ),
      e("span",null,tooltip.data.examLabel),e("br"),
      e("span",{style:{color:"var(--muted)"}},tooltip.data.date+" · "+tooltip.data.cor+"/"+tooltip.data.total+" točnih")
    ),
    // Legend
    e("div",{className:"trend-legend"},
      e("div",{className:"trend-legend-item"},
        e("div",{className:"trend-legend-line",style:{background:"var(--gold)"}}),
        "Tvoj rezultat"
      ),
      n>=3&&e("div",{className:"trend-legend-item"},
        e("div",{className:"trend-legend-line",style:{background:"rgba(255,255,255,.2)"}}),
        "Prosjek "+avgPct+"%"
      ),
      n>=3&&e("div",{className:"trend-legend-item",style:{marginLeft:"auto",fontWeight:600}},
        trend>3?e("span",{className:"pred-trend-up"},"↑ Rastući trend (+"+Math.round(trend)+"%)"):
        trend<-3?e("span",{className:"pred-trend-down"},"↓ Padajući trend ("+Math.round(trend)+"%)"):
        e("span",{className:"pred-trend-flat"},"→ Stabilan")

function GradePrediction({history}){
  if(!history||history.length<2) return e("div",{className:"trend-empty"},
    "📊 Trebaš barem 2 riješena ispita za predviđanje."
  );
  
  const GC={1:"var(--red)",2:"#f97316",3:"var(--gold)",4:"#60a5fa",5:"var(--green)"};
  const GNAMES={1:"Nedovoljan (1)",2:"Dovoljan (2)",3:"Dobar (3)",4:"Vrlo dobar (4)",5:"Odličan (5)"};
  
  // NCE grade distribution (approximate from NCVVO izvještaji 2020-2025)
  const NCE_DIST = {
    1: 22,  // % koji ne polože ili dobiju 1
    2: 18,  // % koji dobiju 2
    3: 24,  // % koji dobiju 3
    4: 20,  // % koji dobiju 4
    5: 16,  // % koji dobiju 5
  };
  // Thresholds za ocjene (simulator bod)
  const GRADE_THRESH = {5:85, 4:70, 3:55, 2:40};
  
  const recent = history.slice(-5);
  const avgPct = Math.round(recent.reduce((a,h)=>a+h.pct,0)/recent.length);
  
  const weights = recent.map((_,i)=>i+1);
  const totalW = weights.reduce((a,b)=>a+b,0);
  const weightedPct = Math.round(recent.reduce((a,h,i)=>a+h.pct*weights[i],0)/totalW);
  
  const trend = history.length>=3 
    ? (history.slice(-2).reduce((a,h)=>a+h.pct,0)/2) - (history.slice(-4,-2).reduce((a,h)=>a+h.pct,0)/Math.min(2,history.slice(-4,-2).length))
    : 0;
  
  const predicted = Math.max(0, Math.min(100, Math.round(weightedPct + trend*0.3)));
  const grade = predicted>=85?5:predicted>=70?4:predicted>=55?3:predicted>=40?2:1;
  const gc = GC[grade];
  
  const confidence = history.length>=5?"Visoka":history.length>=3?"Srednja":"Niska";
  const confColor = confidence==="Visoka"?"var(--green)":confidence==="Srednja"?"var(--gold)":"var(--muted)";
  
  const best = Math.max(...history.map(h=>h.pct));
  const worst = Math.min(...history.map(h=>h.pct));
  const trendDir = trend>2?"↑ Rasteš":trend<-2?"↓ Padaš":"→ Stagniraš";
  const trendColor = trend>2?"var(--green)":trend<-2?"var(--red)":"var(--muted)";

  // Cumulative % of NCE who scored below your grade
  const betterThan = Object.entries(NCE_DIST)
    .filter(([g])=>parseInt(g)<grade)
    .reduce((s,[,pct])=>s+pct, 0);
  
  return e("div",null,
    e("div",{className:"pred-card"},
      e("div",{className:"pred-grade",style:{color:gc}},grade),
      e("div",{style:{fontFamily:"var(--fh)",fontSize:28,color:gc,marginBottom:4}},GNAMES[grade]),
      e("div",{className:"pred-label"},"Predviđena ocjena na pravoj maturi"),
      e("div",{className:"pred-confidence",style:{background:confColor+"20",color:confColor,border:"1px solid "+confColor+"40"}},
        "Pouzdanost: "+confidence+" · "+predicted+"%"
      ),
      e("div",{className:"pred-breakdown"},
        e("div",{className:"pred-bd-item"},e("div",{className:"pred-bd-label"},"Prosječni rezultat"),e("div",{className:"pred-bd-val"},avgPct+"%")),
        e("div",{className:"pred-bd-item"},e("div",{className:"pred-bd-label"},"Trend"),e("div",{className:"pred-bd-val",style:{color:trendColor}},trendDir)),
        e("div",{className:"pred-bd-item"},e("div",{className:"pred-bd-label"},"Najbolji ispit"),e("div",{className:"pred-bd-val",style:{color:"var(--green)"}},best+"%")),
        e("div",{className:"pred-bd-item"},e("div",{className:"pred-bd-label"},"Najslabiji ispit"),e("div",{className:"pred-bd-val",style:{color:"var(--red)"}},worst+"%"))
      )
    ),
    // NCE distribution visualization
    e("div",{style:{marginTop:16,background:"var(--s1)",border:"1px solid var(--bdr)",borderRadius:"var(--rr)",padding:"16px 18px"}},
      e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:12}},"NCE distribucija ocjena"),
      e("div",{style:{display:"flex",gap:6,alignItems:"flex-end",height:64,marginBottom:8}},
        [1,2,3,4,5].map(g=>{
          const pct=NCE_DIST[g];
          const isYours=g===grade;
          const col=GC[g];
          return e("div",{key:g,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}},
            e("div",{style:{fontSize:10,color:isYours?col:"var(--muted)",fontWeight:isYours?700:400}},pct+"%"),
            e("div",{style:{
              width:"100%",height:Math.round(pct/24*56)+"px",borderRadius:"4px 4px 0 0",
              background:isYours?col:"var(--s3)",
              border:isYours?"2px solid "+col:"1px solid var(--bdr)",
              transition:"height .6s ease",position:"relative"
            }},
              isYours&&e("div",{style:{
                position:"absolute",top:-20,left:"50%",transform:"translateX(-50%)",
                fontSize:9,background:col,color:"#fff",padding:"1px 5px",borderRadius:4,
                whiteSpace:"nowrap"
              }},"Ti ▼")
            ),
            e("div",{style:{fontSize:10,fontWeight:700,color:isYours?col:"var(--muted)"}},g)
          );
        })
      ),
      betterThan>0&&e("div",{style:{fontSize:12,color:"var(--muted)",borderTop:"1px solid var(--bdr)",paddingTop:8,marginTop:4}},
        "S ovim rezultatima bio/la bi u gornji ",e("strong",{style:{color:gc}},(100-betterThan-NCE_DIST[grade])+"%"),
        " maturanata iz sociologije."
      )
    ),
    e("div",{className:"daily-insight"},
      trend>3 ? e("span",null,"🚀 ",e("strong",null,"Odlično napredUJEš!"),` Ako nastaviš ovim tempom, ocjena ${Math.min(5,grade+1)} je dostižna.`) :
      trend<-3 ? e("span",null,"⚠️ ",e("strong",null,"Pad u rezultatima."),` Preporučamo fokus na slabe teme — pogledaj Heatmap.`) :
      e("span",null,"💪 ",e("strong",null,"Stabilan si."),` Za poboljšanje uvježbaj teme ispod 60% — provjeri Heatmap.`)
    )
  );
}

function getDailyChallengeQuestions(){
  // Deterministički seed temeljen na današnjem datumu — svaki dan ista 5 pitanja
  const today=new Date();
  const seed=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
  function seededRand(s){ let x=Math.sin(s)*10000; return x-Math.floor(x); }

  // Uzmi sve MC pitanje s exp-om iz 2018–2025
  const pool=[];
  Object.values(EXAMS).forEach(exam=>{
    if(exam.year<2018) return;
    exam.qs.forEach(q=>{
      if(q.type==="mc"&&q.exp&&q.sol?.cl) pool.push({...q,_examKey:exam.key});
    });
  });

  // Fisher-Yates s deterministički seedom
  const arr=[...pool];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(seededRand(seed+i)*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr.slice(0,5);
}

function DailySummary({userData}){
  const history = userData.history||[];
  const today = new Date().toLocaleDateString("hr");
  const todayExams = history.filter(h=>h.date===today);
  const todayXp = todayExams.length * 60; // approx
  
  const hour = new Date().getHours();
  const greeting = hour<12?"Dobro jutro":hour<18?"Dobar dan":"Dobra večer";

  // Study time estimation: each exam ~30-90 min, use qTimes if available
  function estimateTime(h){
    if(h.qTimes){
      const totalSec = Object.values(h.qTimes).reduce((s,t)=>s+(t||0),0);
      if(totalSec>60) return Math.round(totalSec/60);
    }
    return h.mode==="simulacija" ? 90 : 35; // fallback estimates
  }

  const todayMinutes = todayExams.reduce((s,h)=>s+estimateTime(h),0);

  // Last 7 days study time
  const last7 = Array.from({length:7},(_,i)=>{
    const d = new Date(Date.now()-(6-i)*86400000).toLocaleDateString("hr");
    const dayExams = history.filter(h=>h.date===d);
    const mins = dayExams.reduce((s,h)=>s+estimateTime(h),0);
    const hasExam = dayExams.length>0;
    const isToday = d===today;
    const label = ["Ned","Pon","Uto","Sri","Čet","Pet","Sub"][new Date(Date.now()-(6-i)*86400000).getDay()];
    return {d, hasExam, isToday, mins, label, exams:dayExams.length};
  });
  const weekMinutes = last7.reduce((s,d)=>s+d.mins,0);
  const maxMins = Math.max(...last7.map(d=>d.mins),1);

  // Last 7 days streak visualization
  const days = last7;
  
  // Today's improvements
  const topicImprovements = [];
  if(todayExams.length>=1 && history.length>=2){
    const todayTb = todayExams[todayExams.length-1].topic_breakdown||{};
    const prevTb = history.slice(0,-todayExams.length).reduce((acc,h)=>{
      if(!h.topic_breakdown) return acc;
      Object.entries(h.topic_breakdown).forEach(([t,d])=>{
        if(!acc[t]) acc[t]={correct:0,total:0};
        acc[t].correct+=d.correct||0; acc[t].total+=d.total||0;
      });
      return acc;
    },{});
    Object.entries(todayTb).forEach(([topic,data])=>{
      if(!data.total) return;
      const todayPct = Math.round(data.correct/data.total*100);
      const prev = prevTb[topic];
      const prevPct = prev&&prev.total ? Math.round(prev.correct/prev.total*100) : null;
      if(prevPct!==null && todayPct-prevPct>=10) topicImprovements.push({topic,todayPct,prevPct,diff:todayPct-prevPct});
    });
  }

  if(history.length===0) return null;
  
  function fmtMins(m){
    if(m===0) return "0 min";
    if(m<60) return m+" min";
    return Math.floor(m/60)+"h "+(m%60>0?m%60+"min":"");
  }

  return e("div",{className:"daily-card"},
    e("div",{className:"daily-greeting"},greeting+" 👋"),
    e("div",{className:"daily-sub"},
      todayExams.length===0 ? "Nisi još danas vježbao/la. Hoćeš li riješiti ispit?" :
      `Danas si riješio/la ${todayExams.length} ispit${todayExams.length>1?"a":""}${todayMinutes>0?" · "+fmtMins(todayMinutes)+" učenja":""}.`
    ),
    e("div",{className:"daily-stats"},
      e("div",{className:"daily-stat"},
        e("div",{className:"daily-stat-val",style:{color:"var(--gold)"}},userData.xp||0),
        e("div",{className:"daily-stat-lbl"},"Ukupni XP")
      ),
      e("div",{className:"daily-stat"},
        e("div",{className:"daily-stat-val",style:{color:"var(--green)"}},history.length),
        e("div",{className:"daily-stat-lbl"},"Ispita riješeno")
      ),
      e("div",{className:"daily-stat"},
        e("div",{className:"daily-stat-val",style:{color:"#f97316"}},userData.streak||0),
        e("div",{className:"daily-stat-lbl"},"Dan streak 🔥")
      ),
      e("div",{className:"daily-stat"},
        e("div",{className:"daily-stat-val",style:{color:"var(--teal)"}},fmtMins(weekMinutes)),
        e("div",{className:"daily-stat-lbl"},"Ovaj tjedan ⏱")
      ),
      (()=>{
        const totalMins = history.reduce((s,h)=>s+estimateTime(h),0);
        const totalHrs = (totalMins/60).toFixed(1);
        return e("div",{className:"daily-stat"},
          e("div",{className:"daily-stat-val",style:{color:"var(--blue)"}},totalHrs+"h"),
          e("div",{className:"daily-stat-lbl"},"Ukupno učenja")
        );
      })()

    // Weekly study time bar chart
    e("div",{style:{marginBottom:16}},
      e("div",{style:{fontSize:11,color:"var(--muted)",marginBottom:8,display:"flex",justifyContent:"space-between"}},
        e("span",null,"Aktivnost — zadnjih 7 dana"),
        weekMinutes>0&&e("span",null,fmtMins(weekMinutes)+" ukupno")

      e("div",{style:{display:"flex",alignItems:"flex-end",gap:4,height:48}},
        days.map((d,i)=>e("div",{key:i,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}},
          e("div",{

/* ── banka pitanja je asinkrona (ADR-001, Faza 2) ────────────────────────────
   EXAMS je prazan dok roditelj ne pošalje ispite, pa svaki izračun nad cijelom
   bankom mora znati razlikovati „nema grešaka“ od „nemam podatke“. Prije zahvata
   je EXAMS uvijek bio pun, pa ta razlika nije postojala. */
function socBankLoaded(){for(const k in EXAMS)return true;return false;}

/* Virtualna vježba iz jedne teme. Namjerno FUNKCIJA, a ne gotov objekt: slaže se
   tek kad je banka stvarno tu (pozivatelj je pokreće nakon withAllExams), pa Sim
   nikad ne dobije qs:[] — s praznim popisom se na `exam.key+"_"+q.id` ruši. */
function socTopicVirtualExam(topicKey,label){
  const qs=[];
  Object.values(EXAMS).forEach(function(exam){
    (exam&&exam.qs||[]).forEach(function(q){
      if(q.topic!==topicKey||q.type==="sa"||q.type==="es")return;
      qs.push(Object.assign({},q,{_examKey:exam.key}));
    });
  });
  return {key:"filter_session",year:"Tema",season:"session",
    label:(label||TOPIC_LABELS[topicKey]||topicKey)+" — vježbanje",
    qs:qs.sort(function(){return Math.random()-.5;}).slice(0,40)};
}

      topicStats[topic].correct += data.correct||0;
      topicStats[topic].total   += data.total||0;

  const streakQuality = history.slice(-10).map((h,i,arr)=>{

  });

  const allTimes = history.flatMap(h=>h.qTimes ? Object.values(h.qTimes) : []);
  const avgTime  = allTimes.length ? Math.round(allTimes.reduce((a,b)=>a+b,0)/allTimes.length) : 0;
  const slowQ    = history.flatMap(h=>{
    if(!h.qTimes||!h.qs) return [];
    return Object.entries(h.qTimes)
      .filter(([,t])=>t>60)
      .map(([id,t])=>({id,time:t,examLabel:h.examLabel}));
  }).slice(0,5);

  // Kritična pitanja: točni ali spori (>90s) — nesigurnost
  const criticalQs = React.useMemo(()=>{
    const map={};
    history.forEach(h=>{
      if(!h.qTimes||!h.answers||!h.examKey) return;
      const exam=EXAMS[h.examKey];
      if(!exam) return;
      Object.entries(h.qTimes).forEach(([qid,t])=>{
        if(t<90) return; // samo spori
        const q=exam.qs.find(q=>String(q.id)===String(qid));
        if(!q||q.type==="sa"||q.type==="es") return;
        const ans=h.answers[qid];
        if(!ans) return;
        const correct=chk(q,ans)===true;
        if(!correct) return; // samo točni
        const key=h.examKey+"__"+qid;
        if(!map[key]) map[key]={q,examKey:h.examKey,totalTime:0,count:0};
        map[key].totalTime+=t;
        map[key].count++;
      });
    });
    return Object.values(map)
      .map(x=>({...x,avgTime:Math.round(x.totalTime/x.count)}))
      .sort((a,b)=>b.avgTime-a.avgTime)
      .slice(0,10);
  },[history]);

  function getRecommendations(){
    const recs = [];

    const topErrors = errors.slice(0,3).filter(e=>e.count>=2);

    // Strong topics

    if(strong) recs.push({

      title:`Snaga: ${strong.label}`,
      desc:`${strong.pct}% — izvrsno! Nastavi ovim tempom.`,

    // Time tip
    if(avgTime > 45) recs.push({

      desc:`Prosječno ${avgTime}s po pitanju. Na maturi imaš ~2min po pitanju — uvježbaj brže odlučivanje.`,

      desc:"Što više ispita riješiš, točnija je analiza slabih točaka. Cilj: barem 5 ispita.",
      badge:"tip"
    });
    // Perfect score encouragement
    const best = history.length ? Math.max(...history.map(h=>h.pct)) : 0;
    if(best >= 85) recs.push({
      icon:"🏆",
      title:"Odličan rezultat!",
      desc:`Postigao/la si ${best}% — to odgovara ocjeni 5. Probaj ljetni/jesenski rok za raznovrsnost.`,
      badge:"good"
    });
    return recs.length ? recs : [{icon:"📊",title:"Nastavi vježbati",desc:"Riješi još ispita za personalizirane preporuke.",badge:"tip"}];
  }

          if(weightedAvg>=targetPct) return e("div",{style:{marginBottom:28}},

                        }},

            // Usporedba rokova + najbrže poboljšanje

              const jAvg=jesenski.length?Math.round(jesenski.reduce((s,h)=>s+h.pct,0)/jesenski.length):null;

              const byYear={};

                if(!yr) return;
                if(!byYear[yr]) byYear[yr]=[];
                byYear[yr].push(h.pct);
              });
              const improvements=Object.entries(byYear)
                .filter(([,pcts])=>pcts.length>=2)
                .map(([yr,pcts])=>({yr,first:pcts[0],last:pcts[pcts.length-1],diff:pcts[pcts.length-1]-pcts[0]}))

              const bestImprov=improvements[0];

              return e("div",{style:{marginTop:24,display:"flex",flexDirection:"column",gap:12}},

                (lAvg!==null||jAvg!==null)&&e("div",{style:{
                  background:"var(--s1)",border:"1px solid var(--bdr)",borderRadius:"var(--rr)",
