                }},
                  e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:12}},
                    "☀️ Ljetni vs 🍂 Jesenski"),
                  e("div",{style:{display:"flex",gap:12}},
                    lAvg!==null&&e("div",{style:{flex:1,textAlign:"center",padding:"12px",background:"var(--s2)",borderRadius:"var(--r)"}},
                      e("div",{style:{fontSize:24,fontWeight:800,color:"var(--gold)",fontFamily:"var(--fh)"}},"☀️ "+lAvg+"%"),
                      e("div",{style:{fontSize:11,color:"var(--muted)",marginTop:4}},"Ljetni · "+ljetni.length+" ispita")
                    ),
                    jAvg!==null&&e("div",{style:{flex:1,textAlign:"center",padding:"12px",background:"var(--s2)",borderRadius:"var(--r)"}},
                      e("div",{style:{fontSize:24,fontWeight:800,color:"var(--teal)",fontFamily:"var(--fh)"}},"🍂 "+jAvg+"%"),
                      e("div",{style:{fontSize:11,color:"var(--muted)",marginTop:4}},"Jesenski · "+jesenski.length+" ispita")
                    )
                  ),
                  lAvg!==null&&jAvg!==null&&e("div",{style:{fontSize:12,color:"var(--muted)",marginTop:10,textAlign:"center"}},

                      :lAvg<jAvg

                // Najbrže poboljšanje
                bestImprov&&bestImprov.diff>0&&e("div",{style:{
                  background:"var(--green-d)",border:"1px solid rgba(30,122,62,.25)",

      tab==="heatmap"&&(history.length===0

        : e("div",null,
            e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:16}},"Kalendar učenja — zadnjih 26 tjedana"),
            (()=>{
              // Build a map of date → {exams, pct, mins}
              const dateMap = {};
              function estimateMinHm(h){
                if(h.qTimes){const s=Object.values(h.qTimes).reduce((a,b)=>a+(b||0),0);if(s>60)return Math.round(s/60);}
                return h.mode==="simulacija"?90:35;
              }
              history.forEach(h=>{
                if(!h.date) return;
                if(!dateMap[h.date]) dateMap[h.date]={exams:0,totalPct:0,mins:0};
                dateMap[h.date].exams++;
                dateMap[h.date].totalPct+=h.pct||0;
                dateMap[h.date].mins+=estimateMinHm(h);
              });
              // Normalize to ISO date for comparison
              function hrToDate(hrStr){
                // "18. 3. 2026." → Date
                if(!hrStr) return null;
                const parts=hrStr.replace(/\./g,"").trim().split(/\s+/);
                if(parts.length<3) return null;
                return new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
              }
              function dateToHr(d){
                return d.toLocaleDateString("hr");
              }
              // Build 26 weeks (182 days) grid ending today
              const today = new Date();
              today.setHours(0,0,0,0);
              // Start from most recent Monday 26 weeks ago
              const startDay = new Date(today);
              startDay.setDate(today.getDate() - 182);
              // Align to Monday
              const dow = startDay.getDay();
              const diff = dow===0?-6:1-dow;
              startDay.setDate(startDay.getDate()+diff);

              const weeks = [];
              let cur = new Date(startDay);
              while(cur<=today){
                const week=[];
                for(let d=0;d<7;d++){
                  const dateStr=dateToHr(new Date(cur));
                  const data=dateMap[dateStr]||null;
                  const isToday=cur.toDateString()===today.toDateString();
                  const isFuture=cur>today;
                  week.push({date:new Date(cur),dateStr,data,isToday,isFuture});
                  cur.setDate(cur.getDate()+1);
                }
                weeks.push(week);
              }

              // Color intensity based on exams done
              function cellColor(data,isFuture,isToday){
                if(isFuture) return "transparent";
                if(!data||data.exams===0) return "var(--s3)";
                const n=data.exams;
                if(n>=3) return "var(--green)";
                if(n>=2) return "#2a9e58";
                return "#1e7a3e";
              }
              function cellOpacity(data){
                if(!data||data.exams===0) return 1;
                const n=data.exams;
                return n>=3?1:n>=2?0.75:0.5;
              }

              // Month labels
              const months=["Sij","Velj","Ožu","Tra","Svi","Lip","Srp","Kol","Ruj","Lis","Stu","Pro"];
              const monthLabels=[];
              weeks.forEach((week,wi)=>{
                const first=week[0];
                if(wi===0||first.date.getDate()<=7){
                  monthLabels[wi]=months[first.date.getMonth()];
                }
              });

              const totalDays=Object.keys(dateMap).length;
              const totalSessions=history.length;
              const currentStreak=userData.streak||0;
              const maxStreak=(()=>{
                // compute max streak from history dates
                const dates=Object.keys(dateMap).map(d=>hrToDate(d)).filter(Boolean).sort((a,b)=>a-b);
                let ms=0,cs=0,prev=null;
                dates.forEach(d=>{
                  if(prev&&(d-prev)===86400000) cs++;
                  else cs=1;
                  if(cs>ms) ms=cs;
                  prev=d;
                });
                return ms;
              })();

              return e("div",null,
                // Summary stats
                e("div",{style:{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}},
                  [
                    {label:"Aktivni streak",val:currentStreak+"🔥",col:"var(--gold)"},
                    {label:"Rekordni streak",val:maxStreak+" dana",col:"var(--blue)"},
                    {label:"Aktivni dani",val:totalDays,col:"var(--green)"},
                    {label:"Ukupno sesija",val:totalSessions,col:"var(--teal)"},
                  ].map((s,i)=>e("div",{key:i,style:{
                    flex:"1 1 80px",minWidth:80,background:"var(--s1)",border:"1px solid var(--bdr)",
                    borderRadius:"var(--r)",padding:"10px 12px",textAlign:"center",boxShadow:"var(--shadow-sm)"
                  }},
                    e("div",{style:{fontSize:18,fontWeight:800,color:s.col,fontFamily:"var(--fh)"}},""+s.val),
                    e("div",{style:{fontSize:10,color:"var(--muted)",marginTop:2}},s.label)
                  ))
                ),
                // Heatmap grid
                e("div",{style:{overflowX:"auto",paddingBottom:8}},
                  e("div",{style:{display:"inline-flex",flexDirection:"column",gap:0,minWidth:480}},
                    // Month row
                    e("div",{style:{display:"flex",gap:3,marginBottom:4,paddingLeft:24}},
                      weeks.map((week,wi)=>e("div",{key:wi,style:{
                        width:13,fontSize:9,color:"var(--muted)",fontWeight:600,textAlign:"left",
                        whiteSpace:"nowrap",overflow:"visible"
                      }},monthLabels[wi]||""))
                    ),
                    // Day rows (Mon-Sun)
                    ["Pon","Sri","Pet"].map((dayLabel,di)=>{
                      const dayIndex=[1,3,5][di]; // Mon=1,Wed=3,Fri=5
                      return e("div",{key:di,style:{display:"flex",alignItems:"center",gap:3,marginBottom:3}},
                        e("div",{style:{width:20,fontSize:9,color:"var(--muted)",textAlign:"right",paddingRight:3,flexShrink:0}},dayLabel),
                        weeks.map((week,wi)=>{
                          // Show only Mon, Wed, Fri rows — skip Tue, Thu, Sat, Sun cells visually
                          const cell=week[dayIndex];
                          if(!cell) return e("div",{key:wi,style:{width:13,height:13}});
                          const bg=cellColor(cell.data,cell.isFuture,cell.isToday);
                          const opacity=cell.data?cellOpacity(cell.data):1;
                          return e("div",{
                            key:wi,
                            style:{
                              width:13,height:13,borderRadius:3,
                              background:bg,opacity,
                              border:cell.isToday?"2px solid var(--gold)":"1px solid transparent",
                              cursor:cell.data?"pointer":"default",
                              transition:"transform .1s",
                            },
                            onMouseEnter:()=>cell.data&&setTooltip({...cell.data,dateStr:cell.dateStr,x:wi,y:di}),
                            onMouseLeave:()=>setTooltip(null),
                          });
                        })
                      );
                    }),
                    // Legend
                    e("div",{style:{display:"flex",alignItems:"center",gap:6,marginTop:8,paddingLeft:24,fontSize:10,color:"var(--muted)"}},
                      "Manje",
                      ...[0,0.5,0.75,1].map((op,i)=>e("div",{key:i,style:{width:13,height:13,borderRadius:3,background:"var(--green)",opacity:op||0.15}})),
                      "Više"
                    )
                  )
                ),
                // Tooltip
                tooltip&&e("div",{style:{
                  background:"var(--s1)",border:"1px solid var(--bdr)",borderRadius:"var(--r)",
                  padding:"8px 12px",fontSize:12,marginTop:8,boxShadow:"var(--shadow)",
                  display:"inline-block"
                }},
                  e("strong",null,tooltip.dateStr),
                  e("span",{style:{marginLeft:8,color:"var(--muted)"}},
                    tooltip.exams+" sesija"+(tooltip.mins>0?" · "+Math.round(tooltip.mins)+" min":"")),
                  tooltip.exams>0&&tooltip.totalPct>0&&e("span",{style:{
                    marginLeft:8,fontWeight:700,
                    color:Math.round(tooltip.totalPct/tooltip.exams)>=70?"var(--green)":
                          Math.round(tooltip.totalPct/tooltip.exams)>=55?"var(--gold)":"var(--red)"
                  }},
                    "· Ø "+Math.round(tooltip.totalPct/tooltip.exams)+"%")
                )
              );
            })()
          )
      ),

      // Bez banke se wrongMap ne može složiti, a prazan wrongMap ovdje ispiše
      // „Nema pogrešnih odgovora — odličan rad!“ korisniku koji ih ima desetke.
      tab==="teska"&&(history.length===0
        ? noData
        : !bankLoaded
        ? bankNote
        : (()=>{
            // Aggregate wrong answers by question key
            const wrongMap = {};
            history.forEach(h=>{
              if(!h.answers||!h.examKey) return;
              const exam = EXAMS[h.examKey];
              if(!exam) return;
              exam.qs.forEach(q=>{
                if(q.type==="sa"||q.type==="es") return;
                const ans = h.answers[q.id];
                if(ans===undefined||ans===null) return;
                const ok = chk(q, ans);
                if(ok===false){
                  const key = h.examKey+"__"+q.id;
                  if(!wrongMap[key]) wrongMap[key]={q, examKey:h.examKey, wrong:0, seen:0};
                  wrongMap[key].wrong++;
                }
                if(ok===true||ok===false){
                  const key = h.examKey+"__"+q.id;
                  if(!wrongMap[key]) wrongMap[key]={q, examKey:h.examKey, wrong:0, seen:0};
                  wrongMap[key].seen++;
                }
              });
            });
            const hardest = Object.values(wrongMap)
              .filter(x=>x.wrong>0)
              .map(x=>({...x, pct:Math.round(x.wrong/(x.seen||1)*100)}))
              .sort((a,b)=>b.wrong-a.wrong||b.pct-a.pct)
              .slice(0,20);

            if(hardest.length===0) return e("div",{style:{textAlign:"center",padding:"40px 0"}},
              e("div",{style:{fontSize:32,marginBottom:12}},"🏆"),
              e("div",{style:{fontSize:14,color:"var(--muted)"}},"Nema pogrešnih odgovora — odličan rad!")
            );

            return e("div",null,
              e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:6}},"Najteža pitanja — po broju grešaka"),
              e("div",{style:{fontSize:12,color:"var(--muted)",marginBottom:16}},"Pitanja koja si griješio najčešće (iz svih sesija)"),
              e("div",{style:{display:"flex",flexDirection:"column",gap:8}},
                hardest.map((item,i)=>{
                  const ex = EXAMS[item.examKey];
                  const exLabel = ex ? ex.year+". — "+(ex.season==="ljeto"?"Ljetni":"Jesenski") : item.examKey;
                  const wrongColor = item.pct>=70?"var(--red)":item.pct>=40?"var(--gold)":"var(--muted)";
                  return e("div",{key:i,style:{

                    padding:"12px 14px",boxShadow:"var(--shadow-sm)",display:"flex",gap:12,alignItems:"flex-start"
                  }},
                    e("div",{style:{
                      minWidth:44,height:44,borderRadius:"var(--r)",background:"var(--red-d)",
                      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                      flexShrink:0,border:"1px solid rgba(196,48,48,.2)"
                    }},
                      e("div",{style:{fontSize:15,fontWeight:800,color:"var(--red)",lineHeight:1}},item.wrong+"×"),
                      e("div",{style:{fontSize:9,color:"var(--muted)"}},item.wrong===1?"greška":"grešaka")
                    ),
                    e("div",{style:{flex:1,minWidth:0}},
                      e("div",{style:{display:"flex",gap:6,marginBottom:4,flexWrap:"wrap",alignItems:"center"}},
                        e("span",{className:"topic-tag",style:{fontSize:10}},TOPIC_LABELS[item.q.topic]||item.q.topic),
                        e("span",{style:{fontSize:10,color:"var(--muted)"}},exLabel),
                        item.seen>1&&e("span",{style:{fontSize:10,color:wrongColor}},item.pct+"% grešaka")
                      ),
                      e("div",{style:{fontSize:13,lineHeight:1.5,marginBottom:item.q.opts?6:0}},item.q.q),
                      item.q.opts&&item.q.sol?.cl&&e("div",{style:{
                        fontSize:11,color:"var(--green)",background:"var(--green-d)",
                        padding:"4px 8px",borderRadius:4,display:"inline-block"
                      }},
                        "✓ Točno: "+item.q.sol.cl+") "+item.q.opts["ABCDE".indexOf(item.q.sol.cl)]
                      ),
                      item.q.exp&&e("div",{style:{fontSize:11,color:"var(--muted)",marginTop:6,fontStyle:"italic"}},
                        "💡 "+item.q.exp)
                    )
                  );
                })
              )
            );
          })()
      ),

      tab==="teme"&&drillTopic&&(()=>{
        const topicLabel=TOPIC_LABELS[drillTopic]||drillTopic;
        const tStat=topicStats[drillTopic]||{correct:0,total:0};
        const tPct=tStat.total?Math.round(tStat.correct/tStat.total*100):0;
        const tColor=tPct>=70?"var(--green)":tPct>=50?"var(--gold)":"var(--red)";
        const LL2=["A","B","C","D","E","F"];
        const allQs=[];
        Object.values(EXAMS).forEach(exam=>{
          exam.qs.filter(q=>q.topic===drillTopic&&q.type!=="sa"&&q.type!=="es").forEach(q=>{
            allQs.push({q,exam});
          });
        });
        return e("div",null,
          e("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}},
            e("button",{className:"drill-back",style:{margin:0},onClick:()=>setDrillTopic(null)},"← Natrag na heatmap"),
            onFilter&&bankLoaded&&allQs.length>0&&e("button",{
              className:"btn btn-gold",
              style:{fontSize:12,padding:"6px 14px"},
              onClick:()=>{
                // Vježba se slaže TEK u goFilteru, nakon što banka sigurno stigne
                // (predaje se recept, ne gotov objekt) — inače bi Sim dobio qs:[].
                window._virtualExamBuilder=()=>socTopicVirtualExam(drillTopic,topicLabel);
                onFilter(drillTopic);
              }
            },"▶ Vježbaj ovu temu ("+Math.min(allQs.length,40)+")")
          ),
          e("div",{className:"drill-header"},
            e("span",{className:"drill-title"},topicLabel),
            e("span",{className:"drill-stat",style:{color:tColor}},tPct+"% · "+tStat.correct+"/"+tStat.total+" točnih")
          ),
          !bankLoaded?bankNote:
          e("div",{className:"drill-q-list"},
            allQs.map(({q,exam},i)=>e("div",{key:i,className:"drill-q-item neu"},
              e("div",{className:"drill-q-text"},e("strong",{style:{color:"var(--muted)",fontSize:11}},exam.year+" "+exam.label+" · "+TLBL[q.type]+" "),q.q),
              e("div",{className:"drill-q-meta"},
                q.type==="mc"&&q.sol?.cl&&e("span",{className:"drill-q-ans"},"Točan: ",e("span",null,q.sol.cl+" — "+(q.opts[LL2.indexOf(q.sol.cl)]||""))),
                q.type==="ms"&&q.sol?.cls&&e("span",{className:"drill-q-ans"},"Točni: ",e("span",null,q.sol.cls.join(", "))),
                q.type==="mat"&&q.sol?.pairs&&e("span",{className:"drill-q-ans"},"Parovi: ",e("span",null,q.sol.pairs.map(p=>p.l+" → "+p.r).join(" | "))),
                q.type==="fb"&&q.sol?.ans&&e("span",{className:"drill-q-ans"},"Odgovor: ",e("span",null,q.sol.ans))
              )
            ))
          )
        );
      })(),
      tab==="teme"&&!drillTopic&&(topicList.length===0
        ? e("div",{style:{color:"var(--muted)",fontSize:13,textAlign:"center",padding:"32px 0"}},
            "📊 Nema podataka. Riješi barem jedan ispit.")
        : e("div",null,
            // Weak topic shortcuts
            onFilter&&(()=>{
              const weakTopics = Object.keys(TOPIC_LABELS).map(key=>{
                const t = topicStats[key];
                const pct = t&&t.total ? Math.round(t.correct/t.total*100) : null;
                return {key, pct};
              }).filter(t=>t.pct!==null&&t.pct<60).sort((a,b)=>a.pct-b.pct).slice(0,4);
              if(weakTopics.length===0) return null;
              return e("div",{style:{background:"var(--red-d)",border:"1px solid rgba(196,48,48,.2)",borderRadius:"var(--rr)",padding:"14px 16px",marginBottom:16}},
                e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--red)",marginBottom:10}},
                  "⚠️ Slabe teme — preporučeno vježbanje"),
                e("div",{style:{display:"flex",flexWrap:"wrap",gap:8}},
                  weakTopics.map(({key,pct})=>e("button",{
                    key,
                    className:"btn",
                    style:{fontSize:12,padding:"5px 12px",background:"var(--s1)",border:"1px solid rgba(196,48,48,.3)",color:"var(--red)"},
                    onClick:()=>{
                      // Isti razlog kao u drillu: popis pitanja se slaže tek u
                      // goFilteru, nakon što banka stigne (EXAMS je ovdje možda
                      // još prazan — Statistika se otvara i bez dohvata).
                      window._virtualExamBuilder=()=>socTopicVirtualExam(key,TOPIC_LABELS[key]||key);
                      onFilter(key);
                    }
                  },(TOPIC_LABELS[key]||key)+" "+pct+"%"))
                )
              );
            })(),
            e("div",{style:{marginBottom:20}},
              e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:10}},
                "📚 Pokrivenost gradiva"),
              e("div",{style:{fontSize:12,color:"var(--muted)",marginBottom:10}},
                "Koliko pitanja si vidio/la od ukupnog broja u bazi po temi."),
              // Viđena pitanja se broje iz banke; bez nje bi svaka tema pisala
              // 0/690 i izgledala kao da korisnik nije riješio ništa.
              !bankLoaded?bankNote:
              e("div",{style:{display:"flex",flexDirection:"column",gap:6}},
                (()=>{
                  const TOTALS={"sociološke_teorije":690,"socijalizacija":170,"organizacije_i_rad":144,"stratifikacija":140,"kultura_i_društvo":126,"politika_i_vlast":103,"religija":102,"obitelj":88,"metodologija":78,"devijacija":31,"urbanizacija":18,"globalizacija":17,"demografija":11};
                  // Broji viđena pitanja iz history answers
                  const seen={};
                  history.forEach(h=>{
                    if(!h.examKey) return;
                    const ex=EXAMS[h.examKey];
                    if(!ex) return;
                    ex.qs.forEach(q=>{
                      const norm=TC[q.topic]||q.topic;
                      if(!seen[norm]) seen[norm]=new Set();
                      seen[norm].add(q.id);
                    });
                  });
                  return Object.entries(TOPIC_LABELS)
                    .filter(([k])=>TOTALS[k])
                    .map(([key,label])=>{
                      const total=TOTALS[key]||0;
                      const seenCount=seen[key]?seen[key].size:0;
                      const pct=total?Math.round(seenCount/total*100):0;
                      const col=pct>=80?"var(--green)":pct>=50?"var(--gold)":"var(--muted)";
                      return e("div",{key,style:{display:"flex",alignItems:"center",gap:10}},

                        e("div",{style:{flex:1,height:5,background:"var(--s3)",borderRadius:99,overflow:"hidden"}},
                          e("div",{style:{height:"100%",width:pct+"%",background:col,borderRadius:99,transition:"width 1s"}})
                        ),
                        e("div",{style:{fontSize:11,color:col,fontWeight:700,minWidth:50,textAlign:"right"}},
                          seenCount+"/"+total+" ("+pct+"%)"
                        )
                      );
                    });
                })()
              )
            ),
            e("div",{style:{fontSize:12,color:"var(--muted)",marginBottom:14}},
              "🟢 ≥70%  🟡 50–70%  🔴 <50%  ⬜ Nema podataka · Klikni temu za detalje"
            ),
            e("div",{className:"heatmap-grid"},
              Object.keys(TOPIC_LABELS).map(key=>{
                const t = topicStats[key];
                const pct = t&&t.total ? Math.round(t.correct/t.total*100) : null;
                const cls = pct===null?"empty":pct>=70?"hot":pct>=50?"mid":"cold";
                return e("div",{key,className:"heatmap-cell "+cls,
                  style:{cursor:pct!==null?"pointer":"default"},
                  onClick:()=>pct!==null&&setDrillTopic(key)},
                  e("div",{className:"heatmap-topic"},TOPIC_LABELS[key]),
                  e("div",{className:"heatmap-pct"},pct===null?"—":pct+"%"),
                  e("div",{className:"heatmap-sub"},t?t.correct+"/"+t.total+" točnih":"Nije rješavano"),
                  pct!==null&&e("div",{style:{fontSize:9,color:"var(--muted)",marginTop:3}},"Klikni za detalje →")
                );
              })
            ),
            // Topic trend section
            history.length>=2&&(()=>{
              // Compute per-topic pct for first half vs second half of history
              const mid = Math.ceil(history.length/2);
              const earlier = history.slice(0, mid);
              const later   = history.slice(mid);

              function topicPct(sessions){
                const acc={};
                sessions.forEach(h=>{
                  if(!h.topic_breakdown) return;
                  Object.entries(h.topic_breakdown).forEach(([t,d])=>{
                    if(!acc[t]) acc[t]={correct:0,total:0};
                    acc[t].correct+=d.correct||0;
                    acc[t].total+=d.total||0;
                  });
                });
                return Object.fromEntries(
                  Object.entries(acc).map(([t,v])=>[t,v.total?Math.round(v.correct/v.total*100):null])
                );
              }

              const earlyPct = topicPct(earlier);
              const latePct  = topicPct(later);

              const trends = Object.keys(TOPIC_LABELS)
                .map(key=>({
                  key,
                  label: TOPIC_LABELS[key]||key,
                  early: earlyPct[key]??null,
                  late:  latePct[key]??null,
                  diff:  (latePct[key]!=null&&earlyPct[key]!=null)
                           ? latePct[key]-earlyPct[key] : null
                }))
                .filter(t=>t.diff!==null)
                .sort((a,b)=>b.diff-a.diff);

              if(trends.length===0) return null;

              const improved = trends.filter(t=>t.diff>0);
              const declined = trends.filter(t=>t.diff<0);
              const stable   = trends.filter(t=>t.diff===0);

              return e("div",{style:{marginTop:24}},
                e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:12}},
                  "📈 Napredak po temi — usporedba"),
                e("div",{style:{fontSize:12,color:"var(--muted)",marginBottom:14}},
                  "Usporedba prvih "+earlier.length+" i zadnjih "+later.length+" ispita."),
                e("div",{style:{display:"flex",flexDirection:"column",gap:6}},
                  trends.map(t=>{
                    const col = t.diff>5?"var(--green)":t.diff<-5?"var(--red)":t.diff>0?"var(--teal)":"var(--muted)";
                    const icon = t.diff>5?"↑↑":t.diff>0?"↑":t.diff<-5?"↓↓":t.diff<0?"↓":"→";
                    return e("div",{key:t.key,style:{
                      display:"flex",alignItems:"center",gap:10,
                      background:"var(--s1)",border:"1px solid var(--bdr)",
                      borderRadius:"var(--r)",padding:"8px 12px",
                      boxShadow:"var(--shadow-sm)"
                    }},
                      e("div",{style:{
                        fontSize:15,fontWeight:800,color:col,
                        minWidth:28,textAlign:"center"
                      }},icon),
                      e("div",{style:{flex:1,fontSize:13,fontWeight:500}},t.label),
                      e("div",{style:{fontSize:12,color:"var(--muted)",minWidth:60,textAlign:"right"}},
                        t.early+"% → "+t.late+"%"),
                      e("div",{style:{
                        fontSize:12,fontWeight:700,color:col,
                        minWidth:44,textAlign:"right"
                      }},(t.diff>0?"+":"")+t.diff+"%")
                    );
                  })
                )
              );
            })()
          )
      ),

      tab==="tipovi"&&(history.length===0
        ? noData
        : e("div",null,
            // Agregacija po tipu iz svih history entries
            (()=>{
              const TYPE_META = {
                mc:  {label:"Višestruki izbor (MC)",  color:"var(--blue)",   icon:"🔵", desc:"Odabir jednog točnog odgovora od 4"},
                ms:  {label:"Višestruke kombinacije (MS)", color:"var(--teal)", icon:"🟢", desc:"Odabir dvaju točnih odgovora"},
                mat: {label:"Povezivanje (MAT)",       color:"var(--gold)",   icon:"🟡", desc:"Sparivanje pojmova i definicija"},
                fb:  {label:"Dopunjavanje (FB)",        color:"#c084fc",      icon:"🟣", desc:"Upisivanje pojma koji nedostaje"},
                sa:  {label:"Kratki odgovor (SA)",      color:"var(--green)", icon:"🟢", desc:"Rečenica ili dva — ne ocjenjuje se automatski"},
                es:  {label:"Esej (ES)",                color:"var(--red)",   icon:"🔴", desc:"Duži odgovor — ne ocjenjuje se automatski"},
              };

              const typeAcc = {};
              history.forEach(h=>{
                if(!h.breakdown) return;
                h.breakdown.forEach(b=>{
                  if(!typeAcc[b.key]) typeAcc[b.key]={correct:0,total:0,sessions:0};
                  typeAcc[b.key].correct += b.correct||0;
                  typeAcc[b.key].total   += b.total||0;
                  typeAcc[b.key].sessions++;
                });
              });

              const rows = Object.entries(typeAcc)
                .map(([key,v])=>({
                  key, ...TYPE_META[key],
                  correct:v.correct, total:v.total,
                  pct:v.total?Math.round(v.correct/v.total*100):null,
                  sessions:v.sessions
                }))
                .filter(r=>r.total>0)
                .sort((a,b)=>(b.pct||0)-(a.pct||0));

              if(rows.length===0) return noData;

              const best = rows[0];
              const worst = rows[rows.length-1];

              return e("div",null,
                // Sažetak
                rows.length>=2&&e("div",{style:{
                  display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"
                }},
                  e("div",{style:{
                    flex:1,minWidth:140,background:"var(--green-d)",
                    border:"1px solid rgba(30,122,62,.3)",borderRadius:"var(--rr)",
                    padding:"14px 16px"
                  }},
                    e("div",{style:{fontSize:11,fontWeight:700,color:"var(--green)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}},"💪 Najjači tip"),
                    e("div",{style:{fontFamily:"var(--fh)",fontSize:20,marginBottom:2}},best.label.split(" (")[0]),
                    e("div",{style:{fontSize:22,fontWeight:800,color:"var(--green)"}},(best.pct||0)+"%"),
                    e("div",{style:{fontSize:11,color:"var(--muted)"}},best.correct+"/"+best.total+" točnih")
                  ),
                  e("div",{style:{
                    flex:1,minWidth:140,background:"var(--red-d)",
                    border:"1px solid rgba(196,48,48,.3)",borderRadius:"var(--rr)",
                    padding:"14px 16px"
                  }},
                    e("div",{style:{fontSize:11,fontWeight:700,color:"var(--red)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}},"⚠️ Najslabiji tip"),
                    e("div",{style:{fontFamily:"var(--fh)",fontSize:20,marginBottom:2}},worst.label.split(" (")[0]),
                    e("div",{style:{fontSize:22,fontWeight:800,color:"var(--red)"}},(worst.pct||0)+"%"),
                    e("div",{style:{fontSize:11,color:"var(--muted)"}},worst.correct+"/"+worst.total+" točnih")
                  )
                ),

                // Detaljan prikaz svakog tipa
                e("div",{style:{display:"flex",flexDirection:"column",gap:10}},
                  rows.map(r=>e("div",{key:r.key,style:{
                    background:"var(--s1)",border:"1px solid var(--bdr)",
                    borderRadius:"var(--rr)",padding:"14px 16px",
                    boxShadow:"var(--shadow-sm)"
                  }},
                    e("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:8}},
                      e("div",{style:{fontSize:18}},r.icon||"📊"),
                      e("div",{style:{flex:1}},
                        e("div",{style:{fontWeight:700,fontSize:14}},r.label||r.key),
                        e("div",{style:{fontSize:11,color:"var(--muted)"}},r.desc||"")
                      ),
                      e("div",{style:{
                        fontFamily:"var(--fh)",fontSize:24,fontWeight:800,
                        color:r.pct>=70?"var(--green)":r.pct>=55?"var(--gold)":"var(--red)"
                      }},r.pct!==null?r.pct+"%":"—")
                    ),
                    // Progress bar
                    r.pct!==null&&e("div",null,
                      e("div",{style:{
                        height:6,background:"var(--s3)",borderRadius:99,overflow:"hidden",marginBottom:4
                      }},
                        e("div",{style:{
                          height:"100%",
                          width:r.pct+"%",
                          background:r.pct>=70?"var(--green)":r.pct>=55?"var(--gold)":"var(--red)",
                          borderRadius:99,transition:"width 1s"
                        }})
                      ),
                      e("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--muted)"}},
                        e("span",null,r.correct+" točnih od "+r.total),
                        e("span",null,r.sessions+" "+(r.sessions===1?"sesija":"sesija"))
                      )
                    )
                  ))
                )
              );
            })()
          )
      ),

      tab==="savjeti"&&e("div",null,
        e("div",{style:{marginBottom:24}},
          e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:12}},"Preporuke"),
          e("div",{className:"rec-list"},
            getRecommendations().map((r,i)=>e("div",{key:i,className:"rec-item"},
              e("span",{className:"rec-icon"},r.icon),
              e("div",{className:"rec-content"},
                e("div",{className:"rec-title"},r.title),
                e("div",{className:"rec-desc"},r.desc),
                e("span",{className:"rec-badge "+r.badge},
                  r.badge==="urgent"?"Prioritet":r.badge==="good"?"Odlično":"Savjet")
              )
            ))
          )
        ),
        allTimes.length>0&&e("div",null,
          e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:12}},"Brzina rješavanja"),
          e("div",{className:"time-stats-grid"},
            e("div",{className:"time-stat-card"},
              e("div",{className:"time-stat-val",style:{color:"var(--blue)"}},avgTime+"s"),
              e("div",{className:"time-stat-lbl"},"Prosjek po pitanju")
            ),
            e("div",{className:"time-stat-card"},
              e("div",{className:"time-stat-val",style:{color:avgTime<=45?"var(--green)":avgTime<=90?"var(--gold)":"var(--red)"}},
                avgTime<=45?"Brzo":avgTime<=90?"Dobro":"Sporo"),
              e("div",{className:"time-stat-lbl"},"Tempo")
            ),
            e("div",{className:"time-stat-card"},
              e("div",{className:"time-stat-val",style:{color:"var(--muted)"}},Math.round(90*60/(avgTime||60))),
              e("div",{className:"time-stat-lbl"},"Pitanja za 90min")
            )

        criticalQs.length>0&&e("div",{style:{marginTop:8}},
          e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:6}},

          e("div",{style:{fontSize:12,color:"var(--muted)",marginBottom:12}},

          e("div",{style:{display:"flex",flexDirection:"column",gap:8}},
            criticalQs.map((item,i)=>{
              const ex=EXAMS[item.examKey];
              const exLabel=ex?ex.year+". — "+(ex.season==="ljeto"?"Ljetni":"Jesenski"):item.examKey;
              const mins=Math.floor(item.avgTime/60);
              const secs=item.avgTime%60;
              const timeStr=mins>0?mins+"m "+secs+"s":secs+"s";
              return e("div",{key:i,style:{

                }},
                  e("div",{style:{fontSize:13,fontWeight:800,color:"var(--gold)",lineHeight:1}},timeStr),

                  )
                )

            })
          )
        )
      )
    )
  );
}

function EssayGrader({q, answer}){
  const[state,setState]=useState("idle"); // idle | loading | done | error
  const[result,setResult]=useState(null);

  // Reset when question changes
  React.useEffect(()=>{setState("idle");setResult(null);},[q.id]);

  const hasAnswer = answer && answer.trim().length > 20;
  const charCount = (answer||"").length;

  async function gradeEssay(){
    if(!hasAnswer) return;
    setState("loading");

    const refAnswer = q.sol?.ex || "";
    const prompt = `Ti si profesor sociologije koji ocjenjuje odgovor učenika na ispitu državne mature.

PITANJE: "${q.q}"

${refAnswer ? `REFERENTNI ODGOVOR (primjer dobrog odgovora): "${refAnswer}"` : ""}

ODGOVOR UČENIKA: "${answer}"

Ocijeni odgovor učenika prema sljedećim kriterijima i odgovori ISKLJUČIVO u JSON formatu:
{
  "score": <cijeli broj 0-3>,
  "verdict": "<Izvrsno|Dobro|Djelomično|Nedovoljno>",
  "elements_found": ["<element koji je učenik naveo>", ...],
  "elements_missing": ["<ključni element koji nedostaje>", ...],
  "feedback": "<2-3 rečenice konstruktivnog feedbacka na hrvatskom>"
}

Kriteriji bodovanja:
- 3 boda: svi ključni elementi prisutni, jasno i točno objašnjeno
- 2 boda: većina elemenata prisutna, manji propusti  
- 1 bod: djelomičan odgovor, površno ili nepotpuno
- 0 bodova: odgovor je pogrešan ili ne odgovara pitanju

Odgovori SAMO JSON-om, bez ikakvog teksta prije ili poslije.`;

    try{
      const res = await fetch("/api/ai-simulator",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:1000,
          messages:[{role:"user",content:prompt}]
        })
      });
      const data = await res.json();
      const text = data?.content?.[0]?.text||"{}";
      const clean = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      setResult(parsed);
      setState("done");
    }catch(e){
      setState("error");
    }
  }

  const scoreColors = {
    3:"var(--green)", 2:"var(--blue)", 1:"var(--gold)", 0:"var(--red)"
  };
  const scoreLabels = {
    3:"Izvrsno", 2:"Dobro", 1:"Djelomično", 0:"Nedovoljno"
  };

  if(state==="idle") return e("div",null,
    e("div",{className:"essay-char-count"},charCount+" znakova"),
    hasAnswer
      ? e("button",{className:"essay-grade-btn",onClick:gradeEssay},
          "🤖 AI ocijeni moj odgovor")
      : e("div",{style:{fontSize:12,color:"var(--muted)",marginTop:6}},
          "Napiši odgovor (min. 20 znakova) za AI ocjenu.")
  );

  if(state==="loading") return e("div",null,
    e("div",{className:"essay-char-count"},charCount+" znakova"),
    e("button",{className:"essay-grade-btn loading",disabled:true},"🤖 Ocjenjujem..."),
    e("div",{className:"essay-grade-wrap"},
      e("div",{className:"essay-grade-header",style:{color:"var(--muted)",fontSize:13}},
        "Analiziram tvoj odgovor..."
      )
    )
  );

  if(state==="error") return e("div",null,
    e("div",{className:"essay-char-count"},charCount+" znakova"),
    e("button",{className:"essay-grade-btn",onClick:gradeEssay},"🤖 Pokušaj ponovo")
  );

  if(state==="done"&&result) {
    const sc = result.score??0;
    const col = scoreColors[sc]||"var(--gold)";
    return e("div",null,
      e("div",{className:"essay-char-count"},charCount+" znakova"),
      e("div",{className:"essay-grade-wrap"},
        e("div",{className:"essay-grade-header"},
          e("div",{className:"essay-grade-score"},
            e("div",{className:"essay-grade-circle",style:{borderColor:col,color:col}},sc+"/3"),
            e("div",{className:"essay-grade-label"},
              e("div",{className:"essay-grade-title",style:{color:col}},result.verdict||scoreLabels[sc]),
              e("div",{className:"essay-grade-sub"},sc+" od 3 boda")
            )
          ),
          e("div",{className:"essay-criteria"},
            (result.elements_found||[]).map((el,i)=>e("div",{key:"f"+i,className:"essay-criterion"},
              e("span",{className:"essay-criterion-icon"},"✅"),
              e("div",{className:"essay-criterion-text"},el)
            )),
            (result.elements_missing||[]).map((el,i)=>e("div",{key:"m"+i,className:"essay-criterion"},
              e("span",{className:"essay-criterion-icon"},"❌"),
              e("div",{className:"essay-criterion-text"},el)
            ))
          )
        ),
        result.feedback&&e("div",{className:"essay-feedback"},result.feedback),
        e("button",{className:"essay-grade-btn",onClick:()=>{setState("idle");setResult(null);}},
          "🔄 Ocijeni ponovo")
      )
    );
  }
  return null;
}

function AnswerHelper({q, show, onToggle, autoExpand}){
  // show = controlled from outside (after answer in practice, or manual toggle)
  const[aiState,setAiState]=React.useState("idle");
  const[aiText,setAiText]=React.useState("");
  const[showGlossary,setShowGlossary]=React.useState(false);

  React.useEffect(()=>{setAiState("idle");setAiText("");},[q.id]);

  // ADR-001: „Pokaži odgovor“ i AI objašnjenje postoje SAMO ako pitanje nosi
  // ključ. Pozivatelji to provjeravaju, ali komponenta ključ čita na sedam
  // mjesta — jedan izlaz ovdje je jeftiniji i sigurniji od sedam upitnika.
  if(!hasKey(q))return null;

  function getAnswerContent(){
    if(q.type==="mc"){
      const idx=["A","B","C","D","E","F"].indexOf(q.sol.cl);
      return e("div",{className:"ah-answer-content"},
        e("span",{className:"ah-correct"},q.sol.cl+" — "),q.opts[idx]||"");
    }
    if(q.type==="ms"){
      return e("div",{className:"ah-answer-content"},
        e("span",{className:"ah-correct"},q.sol.cls.join(", ")+" — "),
        q.sol.cls.map(L=>q.opts[["A","B","C","D","E","F"].indexOf(L)]).filter(Boolean).join(", "));
    }
    if(q.type==="mat"){
      return e("div",{className:"ah-answer-content"},
        q.sol.pairs.map((p,i)=>e("div",{key:i,style:{marginBottom:3}},
          e("span",{className:"ah-correct"},p.l)," → "+p.r)));
    }
    if(q.type==="fb"){
      return e("div",{className:"ah-answer-content"},e("span",{className:"ah-correct"},q.sol.ans));
    }
    if(q.type==="sa"){
      return e("div",{className:"ah-answer-content"},q.sol.ans);
    }
    if(q.type==="es"){
      return e("div",{className:"ah-answer-content"},q.sol.ex||"Nema primjera odgovora.");
    }
    return null;
  }

  async function fetchAi(){
    setAiState("loading");
    const correctAns = q.type==="mc"?`${q.sol.cl} — ${q.opts[["A","B","C","D","E","F"].indexOf(q.sol.cl)]}`:
                       q.type==="ms"?q.sol.cls.join(", "):
                       q.type==="mat"?q.sol.pairs.map(p=>`${p.l} → ${p.r}`).join("; "):
                       q.type==="fb"?q.sol.ans:q.sol.ans||"";
    const prompt=`Ti si profesor sociologije. Učenik uči za državnu maturu.

Pitanje: "${q.q}"
Točan odgovor: ${correctAns}

Napiši kratko obrazloženje (2-4 rečenice) na hrvatskom koje objašnjava ZAŠTO je taj odgovor točan — koji sociološki pojam, teorija ili autor stoji iza njega. Budi konkretan i educativan. Ne ponavljaj pitanje.`;
    try{
      const res=await fetch("/api/ai-simulator",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
          messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      setAiText(data?.content?.[0]?.text||"Nije moguće generirati objašnjenje.");
      setAiState("done");
    }catch(e){setAiState("error");}
  }

  // Don't show anything if not toggled and not auto-expanded
  if(!show && !autoExpand) return e("button",{className:"ah-toggle-btn",onClick:onToggle},"💡 Pokaži odgovor");

  return e("div",{className:"ah-wrap"},
    // Answer section
    e("div",{className:"ah-answer"},
      e("div",{className:"ah-answer-label"},"💡 Točan odgovor"),
      getAnswerContent()
    ),
    // Built-in explanation (exp field — 2015 exams)
    q.exp&&e("div",{className:"ah-exp"},
      e("div",{className:"ah-exp-label"},"📖 Obrazloženje"),
      e("div",{className:"ah-exp-text"},q.exp)
    ),
    // AI explanation — only if no built-in exp
    !q.exp&&(()=>{
      if(aiState==="idle") return e("button",{className:"ah-ai-btn",onClick:fetchAi},"🤖 AI objašnjenje");
      if(aiState==="loading") return e("button",{className:"ah-ai-btn loading",disabled:true},"🤖 Generira...");
      if(aiState==="error") return e("button",{className:"ah-ai-btn",onClick:fetchAi},"🤖 Pokušaj ponovo");
      return e("div",{className:"ah-ai-content"},
        e("div",{className:"ah-exp-label"},"🤖 AI Profesor"),
        e("div",{className:"ah-ai-text"},aiText));
    })(),
    e("button",{
      onClick:()=>setShowGlossary(true),
      style:{
        marginTop:6,background:"none",border:"1px solid var(--bdr)",
        borderRadius:"var(--r)",padding:"5px 12px",fontSize:12,
        color:"var(--muted)",cursor:"pointer",fontFamily:"var(--fb)"
      }
    },"📖 Pojmovnik"),
    showGlossary&&e(GlossaryModal,{
      onClose:()=>setShowGlossary(false),
      initialTerm:""
    })
  );
}

  const qctx = ctx.question_context[questionId];
  if(!qctx) return null;

  const [open, setOpen] = React.useState(false);
  const [activeTab, setActiveTab] = React.useState(null);

  const needs = qctx.needs;
  const hasArticle = needs.includes("article");
  const tableIds = needs.filter(n => n.startsWith("table"));

  React.useEffect(()=>{
    if(needs.length > 0) setActiveTab(needs[0]);
  }, [questionId]);

  const chartIds = needs.filter(n => n.startsWith("chart"));

  const tabLabel = t => {
    if(t==="article") return "📄 Tekst";

        needs.map(t => e("button", {

      activeTab==="article" && e("div", {className:"ctx-scroll-inner"},

function ChartLine({chart}){
  if(chart.type==="bar") return e(ChartBar,{chart});
  const W=480, H=220, PL=44, PR=16, PT=12, PB=36;
  const cW=W-PL-PR, cH=H-PT-PB;
  const allVals=chart.datasets.flatMap(d=>d.data);
  const minV=0, maxV=chart.yMax||Math.ceil(Math.max(...allVals)/10)*10;
  const xStep=cW/(chart.labels.length-1);
  const yScale=v=>(1-(v-minV)/(maxV-minV))*cH;
  const yTicks=[];
  for(let v=0;v<=maxV;v+=chart.yStep||10) yTicks.push(v);
  const colors=["#c0186c","#888780","#4b7bff","#3ecf6e"];
  const pts=(data)=>data.map((v,i)=>[PL+i*xStep, PT+yScale(v)]);
  const polyline=(data,color,i)=>{
    const p=pts(data);
    const d=p.map((pt,i)=>i===0?`M${pt[0].toFixed(1)},${pt[1].toFixed(1)}`:`L${pt[0].toFixed(1)},${pt[1].toFixed(1)}`).join(" ");
    return e("g",{key:i},
      e("path",{d,fill:"none",stroke:color,strokeWidth:"2",strokeLinejoin:"round",strokeLinecap:"round"}),
      p.map((pt,j)=>e("circle",{key:j,cx:pt[0],cy:pt[1],r:4,fill:color,stroke:"var(--bg)",strokeWidth:1.5}))
    );
  };
  const legCols=chart.datasets.length;
  const legW=cW/legCols;
  return e("svg",{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",height:"auto",display:"block"}},
    yTicks.map(v=>e("g",{key:v},
      e("line",{x1:PL,x2:W-PR,y1:PT+yScale(v),y2:PT+yScale(v),stroke:"rgba(255,255,255,.07)",strokeWidth:.5}),
      e("text",{x:PL-6,y:PT+yScale(v),textAnchor:"end",dominantBaseline:"central",fontSize:10,fill:"var(--muted)"},v+"%")
    )),
    chart.labels.map((lbl,i)=>e("text",{key:i,x:PL+i*xStep,y:H-4,textAnchor:"middle",fontSize:10,fill:"var(--muted)"},lbl)),
    chart.datasets.map((ds,i)=>polyline(ds.data,colors[i],i)),
    chart.datasets.map((ds,i)=>e("g",{key:"leg"+i,transform:`translate(${PL+(i*legW)},${H-PT+2})`},
      e("line",{x1:0,x2:14,y1:-8,y2:-8,stroke:colors[i],strokeWidth:2}),
      e("text",{x:18,y:-4,fontSize:10,fill:"var(--muted)"},ds.label)
    ))
  );
}

function ChartBar({chart}){
  const nActs=chart.labels.length;
  const nDs=chart.datasets.length;
  const W=520, PL=50, PR=12, PT=14, PB=70;
  const legH=20*(Math.ceil(nDs/2));
  const H=240+PB+legH;
  const cH=H-PT-PB-legH;
  const cW=W-PL-PR;
  const allVals=chart.datasets.flatMap(d=>d.data);
  const minV=chart.yMin!==undefined?chart.yMin:0;
  const maxV=chart.yMax||Math.ceil(Math.max(...allVals)/10)*10;
  const range=maxV-minV;
  const yScale=v=>cH-((v-minV)/range)*cH;
  const zeroY=PT+yScale(0);
  const yTicks=[];
  const step=chart.yStep||10;
  for(let v=minV;v<=maxV;v+=step) yTicks.push(parseFloat(v.toFixed(4)));
  const groupW=cW/nActs;
  const pad=groupW*0.12;
  const bW=(groupW-pad*2)/nDs;
  const colors=chart.colors||["#c0186c","#b0aaa0","#888780","#555450"];
  const xLblY=PT+cH+18;
  const wrapLabel=(lbl)=>{
    const words=lbl.split(" ");
    if(words.length<=2) return [lbl];
    const mid=Math.ceil(words.length/2);
    return [words.slice(0,mid).join(" "), words.slice(mid).join(" ")];
  };
  return e("svg",{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",height:"auto",display:"block"}},
    yTicks.map(v=>e("g",{key:v},
      e("line",{x1:PL,x2:W-PR,y1:PT+yScale(v),y2:PT+yScale(v),stroke:v===0?"rgba(255,255,255,.25)":"rgba(255,255,255,.07)",strokeWidth:v===0?1:.5}),
      e("text",{x:PL-5,y:PT+yScale(v),textAnchor:"end",dominantBaseline:"central",fontSize:9,fill:"var(--muted)"},v+"%")
    )),
    chart.labels.map((lbl,i)=>{
      const cx=PL+i*groupW+groupW/2;
      const lines=wrapLabel(lbl);
      return e("g",{key:i},

      );
    }),
    chart.datasets.map((ds,di)=>e("g",{key:di},
      ds.data.map((v,ai)=>{
        const x=PL+ai*groupW+pad+di*bW;
        const pos=v>=0;
        const bH=Math.abs((v/range)*cH);
        const y=pos?PT+yScale(v):zeroY;
        const lbl=v+"%";
        return e("g",{key:ai},
          e("rect",{x,y,width:bW-1,height:bH,fill:colors[di],rx:1}),
          bH>12&&e("text",{
            x:x+bW/2-0.5,
            y:pos?y+4:y+bH-4,
            textAnchor:"middle",
            dominantBaseline:pos?"hanging":"auto",
            fontSize:8,
            fill:"rgba(255,255,255,.9)"
          },lbl)
        );
      })
    )),
    [0,1,2,3].map(i=>{
      if(i>=nDs) return null;
      const col=i%2, row=Math.floor(i/2);
      const lx=PL+col*(cW/2);
      const ly=PT+cH+40+row*16;
      return e("g",{key:"leg"+i},
        e("rect",{x:lx,y:ly-7,width:12,height:10,fill:colors[i],rx:1}),
        e("text",{x:lx+16,y:ly,fontSize:10,fill:"var(--muted)"},chart.datasets[i].label)
      );
    })
  );
}

function AnimatedRing({pct,gc,g}){
  const r=54,circ=2*Math.PI*r;
  const[dash,setDash]=React.useState(0);
  React.useEffect(()=>{
    const t=setTimeout(()=>setDash(circ*(pct/100)),100);
    return()=>clearTimeout(t);
  },[pct]);
  return e("div",{className:"score-ring score-anim"},
    e("svg",{width:140,height:140,viewBox:"0 0 140 140"},
      e("circle",{cx:70,cy:70,r:r,fill:"none",stroke:"var(--s3)",strokeWidth:10}),
      e("circle",{cx:70,cy:70,r:r,fill:"none",stroke:gc,strokeWidth:10,
        strokeDasharray:circ,strokeDashoffset:circ-dash,
        style:{transition:"stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)"},
        strokeLinecap:"round"})
    ),
    e("div",{className:"score-ring-text"},
      e("div",{className:"score-ring-num",style:{color:gc}},g),
      e("div",{className:"score-ring-pct"},pct+"%")
    )
  );
}

function BreakdownCard({label,correct,total,color}){
  const pct=total?Math.round(correct/total*100):0;
  return e("div",{className:"bd-card"},
    e("div",{className:"bd-card-label"},label),
    e("div",{className:"bd-bar-wrap"},
      e("div",{className:"bd-bar",style:{width:pct+"%",background:color}})
    ),
    e("div",{className:"bd-score",style:{color}},correct+" / "+total,
      e("span",{style:{color:"var(--muted)",fontWeight:400,marginLeft:6}},pct+"%")
    )
  );
}

function Results({exam,answers,onBack,userData,qTimes={},conf={},examMode=false,onPracticeErrors,
                  score=null,submitting=false,submitError=null,retryIn=0,onRetrySubmit}){
  const QSR=exam.qs;
  const autoQ=QSR.filter(q=>q.type!=="sa"&&q.type!=="es");
  const manQ=QSR.filter(q=>q.type==="sa"||q.type==="es");
  const[showAll,setShowAll]=useState(false);
  // Pretplata na most: kasni DISCERE_CONFIG (razriješen plan) mora otključati i
  // rezultat koji je već na zaslonu, a ne tek sljedeći.
  const locked=!!useSocBridge().lockResults;

  /* ── ODAKLE DOLAZI OCJENA ─────────────────────────────────────────────────
     ADR-001 točka 10: klijent NIKAD ne računa ocjenu koju je poslužitelj već dao.
     `score` je odgovor ocjenjivačke rute ({pct,grade,cor,total,xpGain,scores});
     lokalni izračun postoji samo dok odgovor nije stigao, i samo s punim
     ključevima. Free korisnik po ODLUCI 1 dobiva `scores` (✓/✗ po pitanju), ali
     nikad sol/exp — mrežica ispod je upravo to i ništa više. */
  const scoreMap=(score&&score.scores&&typeof score.scores==="object")?score.scores:null;
  function verdict(q){
    if(!q||q.type==="sa"||q.type==="es")return null;
    if(scoreMap){const v=scoreMap[String(q.id)];return v===undefined?null:v;}
    return chk(q,answers[q.id]);
  }

  const waiting=!score&&!submitError;
  const failed=!score&&!!submitError;
  const cor=score?(Number(score.cor)||0):autoQ.filter(q=>verdict(q)===true).length;
  const total=score?(Number(score.total)||autoQ.length):autoQ.length;
  const pct=score?Math.max(0,Math.min(100,Math.round(Number(score.pct)||0)))
    :(autoQ.length?Math.round(cor/autoQ.length*100):0);
  const g=Number(score&&score.grade)||grade(pct),gc=GC[g]||GC[1];
  const wrongAutoQ=autoQ.filter(q=>verdict(q)===false);
  const types=[
    {key:"mc",label:"Jedan odgovor",color:"var(--blue)"},
    {key:"ms",label:"Više odgovora",color:"var(--teal)"},
    {key:"mat",label:"Povezivanje",color:"var(--gold)"},
    {key:"fb",label:"Dopunjavanje",color:"#c084fc"},
  ];
  const breakdown=types.map(t=>{
    const tqs=QSR.filter(q=>q.type===t.key);
    return{...t,correct:tqs.filter(q=>verdict(q)===true).length,total:tqs.length};
  }).filter(t=>t.total>0);
  const topicBreak={};
  autoQ.forEach(q=>{
    const t=q.topic||"ostalo";
    if(!topicBreak[t]) topicBreak[t]={correct:0,total:0,label:TOPIC_LABELS[t]||t};
    topicBreak[t].total++;
    if(verdict(q)===true) topicBreak[t].correct++;
  });
  const topicList=Object.values(topicBreak).filter(t=>t.total>0).sort((a,b)=>a.correct/a.total-b.correct/b.total);

  /* Bez ključeva rezultat može dati SAMO poslužitelj (free u ispitnom modu).
     Dok ga nema, ekran ne smije izmisliti ni postotak ni ocjenu — čeka se, a
     odgovori su u nacrtu, pa ni osvježavanje stranice ne pojede pokušaj. */
  if(!score&&(waiting||failed))return e(Fragment,null,
    e("div",{className:"nav"},
      e("button",{className:"btn btn-g",style:{fontSize:13,padding:"6px 12px"},onClick:onBack},"← Natrag"),
      e("span",{className:"ntitle"},"Rezultati"),
      e("span",{className:"nbadge"},exam.year+" — "+exam.label)
    ),
    e("div",{className:"results"},
      e("div",{className:"reshero",style:{display:"flex",flexDirection:"column",alignItems:"center",gap:14,textAlign:"center"}},
        waiting&&e(Fragment,null,
          e("div",{className:"spinner","aria-hidden":"true",style:{width:34,height:34,borderRadius:"50%",border:"3px solid var(--bdr)",borderTopColor:"var(--gold)",animation:"soc-spin .9s linear infinite"}}),
          e("h2",{role:"status","aria-live":"polite",style:{margin:0,fontSize:18}},"Ocjenjujemo…"),
          e("div",{style:{fontSize:13,color:"var(--muted)",maxWidth:400,lineHeight:1.6}},
            "Predaja je poslana. Odgovori su sačuvani — ostanu li i minutu dulje, ništa nije izgubljeno.")
        ),
        failed&&e(Fragment,null,
          e("div",{style:{fontSize:34}},"⚠️"),
          e("h2",{role:"alert",style:{margin:0,fontSize:17,maxWidth:440,lineHeight:1.5}},submitError.message),
          retryIn>0&&e("div",{style:{fontSize:13,color:"var(--muted)"}},"Ponovna predaja moguća za "+retryIn+" s."),
          e("div",{style:{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap",marginTop:4}},
            onRetrySubmit&&e("button",{className:"btn btn-gold",disabled:submitting||retryIn>0,onClick:onRetrySubmit},
              submitting?"Predajem…":"Pokušaj ponovno"),
            e("button",{className:"btn btn-g",onClick:onBack},"← Na početak")
          )
        )
      )
    )
  );

  return e(Fragment,null,
    e("div",{className:"nav"},
      e("button",{className:"btn btn-g",style:{fontSize:13,padding:"6px 12px"},onClick:onBack},"← Natrag"),
      e("span",{className:"ntitle"},"Rezultati"),
      e("span",{className:"nbadge"},exam.year+" — "+exam.label)
    ),
    e("div",{className:"results"},
      e("div",{className:"reshero"},
        e(AnimatedRing,{pct,gc,g}),
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:6}},
          e("h2",{style:{margin:0}},"Sociologija — "+exam.year+". "+exam.label),
          examMode&&e("span",{className:"exam-mode-chip"},"Simulacija")
        ),
        e("p",{style:{color:"var(--muted)",fontSize:14,marginTop:6}},
          (()=>{
            const history=(userData?.history||[]);
            const streak=userData?.streak||0;
            const totalExams=history.length;
            const prevPcts=history.slice(-6,-1).map(h=>h.pct);
            const prevAvg=prevPcts.length?Math.round(prevPcts.reduce((a,b)=>a+b,0)/prevPcts.length):null;
            const improved=prevAvg!==null&&pct>prevAvg;
            const declined=prevAvg!==null&&pct<prevAvg-10;
            const isFirst=totalExams<=1;
            const isStreak=streak>=3;
            const isBigStreak=streak>=7;
            const isPersonalBest=history.length>1&&pct===Math.max(...history.map(h=>h.pct));
            const srsCount=Object.keys(srsLoad()).length;
            const hasSRS=srsCount>10;

            if(pct===100) return "Savršeno! 💯 Sve točno — ovo je vrhunski rezultat. Spreman/na si za maturu!";
            if(pct>=90){
              if(isBigStreak) return `${streak} dana za redom i ${pct}% — nevjerojatan učinak! 🔥 Matura je formalnost.`;
              if(isPersonalBest) return `Novi osobni rekord — ${pct}%! 🏆 Ovaj rezultat govori sam za sebe.`;
              if(isStreak) return `${streak} dana zaredom i ${pct}% — streak se isplati! 🔥`;
              return "Izvanredan rezultat! Još malo vježbanja i matura je sigurna. 🏆";
            }
            if(pct>=70){
              if(isPersonalBest) return `Novi osobni rekord — ${pct}%! Pravi smjer, nastavi ovim tempom. 📈`;
              if(improved) return `Napredak! Prošli put ${prevAvg}%, sada ${pct}% — nastaviš li ovim tempom, prolaz je zajamčen. 📈`;
              if(isBigStreak) return `${streak} dana učenja za redom — i vidi se! ${pct}% je odličan rezultat. 🔥`;
              if(isStreak) return `${streak} dana učenja za redom i prolaz — streak radi! 🔥`;
              if(hasSRS) return `${pct}% i ${srsCount} SRS kartica naučenih — kombinacija radi! Nastavi.`;
              if(isFirst) return "Odličan početak! Nastavi vježbati i rezultati će samo rasti.";
              return "Položio/la si! Fokusiraj se na slabe teme i popni se iznad 80%.";
            }
            if(pct>=55){
              if(declined) return `Malo slabije nego inače (${prevAvg}%) — to se dogodi. Pogledaj koje teme su bile problem.`;
              if(improved) return `Bolje nego prošli put (${prevAvg}%) — pravi smjer! Još malo i prolaz je siguran. 📈`;
              if(isPersonalBest) return `Novi osobni rekord ${pct}% — na pravom si putu! Još malo pa prolaz. 📈`;
              if(isStreak) return `Streak od ${streak} dana radi — još malo i preskočit ćeš granicu prolaza!`;
              return "Na granici prolaza. Vježbaj teme gdje griješiš — napredak dolazi brzo!";
            }
            if(pct>=40){
              if(isFirst) return "Prvi ispit je uvijek najteži. Pogledaj slabe teme i kreni s ponavljanjem — napredak će biti brz.";
              if(improved) return `Bolje od prošlog puta (${prevAvg}%) — gradivo polako pada na mjesto. Nastavi! 📈`;
              if(hasSRS) return `${pct}% — još uvijek ispod prolaza, ali ${srsCount} SRS kartica je dobra baza. Intenzivnije vježbaj!`;
              return "Nije prošlo ovaj put — ali podaci pokazuju gdje griješiš. Koristi ih i vježbaj slabe teme!";
            }
            if(isFirst) return "Svaki početak je težak — ovo ti pokazuje što trebaš naučiti. Kreni s pojmovnikom i SRS karticama! 💪";
            if(declined) return `Puno niže od prosjeka (${prevAvg}%) — možda umor? Kratka pauza pa intenzivno ponavljanje.`;
            return "Svaki pokušaj otkriva što ne znaš — to je vrijednost vježbanja. Kreni s ponavljanjem! 💪";
          })()
        ),
        e("div",{style:{display:"flex",gap:8,justifyContent:"center",marginTop:14,flexWrap:"wrap"}},
          e("div",{className:"stat",style:{minWidth:90}},e("div",{className:"statn",style:{color:"var(--green)"}},cor),e("div",{className:"statl"},"Točnih")),
          e("div",{className:"stat",style:{minWidth:90}},e("div",{className:"statn",style:{color:"var(--red)"}},Math.max(0,total-cor)),e("div",{className:"statl"},"Netočnih")),
          manQ.length>0&&e("div",{className:"stat",style:{minWidth:90}},e("div",{className:"statn",style:{color:"var(--gold)"}},manQ.length),e("div",{className:"statl"},"Za provjeru"))
        )
      ),
      // Ključevi su postojali, pa rezultat na ekranu postoji i bez poslužitelja —
      // ali korisnik mora znati da možda nije ušao u napredak i percentil.
      score&&submitError&&e("div",{role:"status",style:{background:"var(--gold-d)",border:"1px solid var(--gold-b)",color:"var(--gold)",borderRadius:"var(--r)",padding:"10px 14px",marginBottom:18,fontSize:12.5,lineHeight:1.55}},
        submitError.message+" Rezultat je izračunat na ovom uređaju."),
      // Točno/netočno PO PITANJU. Ovo free korisnik smije vidjeti i nakon predaje
      // pravog ispita (ODLUKA 1); točan odgovor i obrazloženje ne smije nikad, pa
      // mrežica nosi samo oznaku i redni broj.
      e("div",{style:{marginBottom:22}},
        e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:10}},"Po pitanju"),
        e("div",{className:"qgrid"},QSR.map((q,i)=>{
          const v=verdict(q);
          const cls=v===true?"cok":v===false?"cbad":"cman";
          const opis=v===true?"točno":v===false?"netočno":"za ručnu provjeru";
          return e("div",{key:q.id,className:"qdot "+cls,title:(i+1)+". pitanje — "+opis,"aria-label":(i+1)+". pitanje — "+opis},i+1);
        })),
        manQ.length>0&&e("div",{style:{fontSize:11.5,color:"var(--muted)",marginTop:8}},
          "Sivo su pitanja koja se ne ocjenjuju automatski (kratki odgovori i eseji).")
      ),
      locked&&wrongAutoQ.length>0&&e(LockedBlock,{label:"Pogrešni odgovori ("+wrongAutoQ.length+")",rows:4,minHeight:170,note:"Točni odgovori i obrazloženja dostupni su od Standard plana."}),
      !locked&&wrongAutoQ.length>0&&e("div",{style:{marginBottom:22}},
        e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:10}},"Pogrešni odgovori ("+wrongAutoQ.length+")"),
        e("div",{style:{display:"flex",flexDirection:"column",gap:6}},
          (showAll?wrongAutoQ:wrongAutoQ.slice(0,5)).map((q,i)=>e("div",{key:i,
            style:{background:"var(--red-d)",border:"1px solid rgba(196,48,48,.2)",borderRadius:"var(--r)",padding:"10px 14px"}},
            e("div",{style:{fontSize:11,color:"var(--muted)",marginBottom:3}},TOPIC_LABELS[q.topic]||q.topic),
            e("div",{style:{fontSize:13,marginBottom:6,lineHeight:1.5}},q.q),
            q.type==="mc"&&e("div",{style:{fontSize:12,display:"flex",flexWrap:"wrap",gap:8}},
              e("span",{style:{color:"var(--red)"}},"✗ Tvoj: "+(answers[q.id]||"—")+" — "+(q.opts[LL.indexOf(answers[q.id])]||"bez odgovora")),
              e("span",{style:{color:"var(--green)"}},"✓ Točno: "+q.sol.cl+" — "+q.opts[LL.indexOf(q.sol.cl)])
            ),
            q.exp&&e("div",{style:{fontSize:11,color:"var(--muted)",marginTop:6,fontStyle:"italic",borderTop:"1px solid var(--bdr)",paddingTop:6}},"💡 "+q.exp)
          ))
        ),
        wrongAutoQ.length>5&&e("button",{className:"btn btn-g",style:{marginTop:8,fontSize:12},
          onClick:()=>setShowAll(s=>!s)},showAll?"Sakrij ↑":"Prikaži sve ("+wrongAutoQ.length+") ↓")
      ),
      !locked&&(()=>{
        const confEntries=autoQ.filter(q=>q.type==="mc"&&conf[q.id]!==undefined);
        if(confEntries.length===0) return null;
        const over=confEntries.filter(q=>conf[q.id]==="2"&&verdict(q)===false).length;
        return e("div",{style:{marginBottom:22}},
          e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:12}},"Tvoja procjena sigurnosti naspram stvarne točnosti"),
          e("div",{style:{display:"flex",flexDirection:"column",gap:8}},
            [["2","😎 Siguran/na","var(--green)"],["1","🤔 Nisam siguran/na","var(--gold)"],["0","😬 Pogađao/la sam","var(--red)"]].map(lvl=>{
              const items=confEntries.filter(q=>conf[q.id]===lvl[0]);
              if(items.length===0) return null;

              return e("div",{key:lvl[0],style:{background:"var(--s1)",border:"1px solid var(--bdr)",borderRadius:"var(--r)",padding:"10px 14px",display:"flex",alignItems:"center",gap:12,boxShadow:"var(--shadow-sm)"}},
                e("div",{style:{flex:1,fontSize:13}},lvl[1]),
                e("div",{style:{flex:1,height:6,background:"var(--s3)",borderRadius:99,overflow:"hidden"}},e("div",{style:{height:"100%",width:p+"%",background:lvl[2],borderRadius:99}})),
                e("div",{style:{fontSize:12,color:"var(--muted)",minWidth:74,textAlign:"right"}},corr+"/"+items.length+" ("+p+"%)")

        );

      locked&&e(LockedBlock,{label:"Analiza po tipu pitanja i temama",rows:5,minHeight:180,note:"Vidiš ocjenu, postotak i bodove. Razrada po tipovima pitanja i temama dolazi sa Standard planom."}),

      !locked&&topicList.length>1&&e("div",{style:{marginBottom:22}},
        e("div",{style:{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:"var(--muted)",marginBottom:12}},"Rezultati po temi"),
        e("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:8}},
          topicList.map((t,i)=>{

            const col=tp>=70?"var(--green)":tp>=50?"var(--gold)":"var(--red)";

              e("div",{style:{width:38,textAlign:"right",fontWeight:700,fontSize:15,color:col,flexShrink:0}},tp+"%"),
              e("div",{style:{flex:1}},
                e("div",{style:{fontSize:12,fontWeight:600,marginBottom:4}},t.label),
