<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8"/>
<title>maturiraj.hr — Engleski hero video</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a14; }
  body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
  #root { position: absolute; inset: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<button id="snd-btn"
  title="Ukljuci zvuk"
  onclick="if(!window.SOUND)return;window.SOUND.toggle();var m=window.SOUND.isMuted();this.textContent=m?'\uD83D\uDD07':'\uD83D\uDD0A';this.style.color=m?'rgba(255,255,255,0.55)':'#4ade80';this.style.borderColor=m?'rgba(255,255,255,0.2)':'#4ade80';"
  style="position:fixed;bottom:62px;right:14px;z-index:9999;width:40px;height:40px;font-size:20px;line-height:1;cursor:pointer;background:rgba(8,8,20,0.88);border:2px solid rgba(255,255,255,0.2);border-radius:9px;color:rgba(255,255,255,0.55);padding:0;display:flex;align-items:center;justify-content:center"
>&#x1F507;</button>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="sound.jsx"></script>
<script type="text/babel" src="tweaks.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Speed-adjusting Stage wrapper — reuses the starter Stage but scales dt by multiplying duration.
// Simpler: wrap with a CSS transform is not possible (it's a time-based engine),
// so we scale by adjusting the effective duration the Stage sees.
// Trick: Stage advances `time` by real dt each frame; to play faster, we feed a SHORTER duration
// AND keep children rendering at their own timings. But children expect 15s timeline.
// Cleaner: use a custom Stage that multiplies dt by speed factor.

function SpeedStage({ speed, children, ...rest }) {
  // Wrap the Stage and inject a custom TimelineContext that scales time for kids.
  // Simpler approach: mount a fresh Stage when speed changes by using a key.
  // But that resets the playhead. Instead, build our own thin playback.
  const BASE_DURATION = rest.duration || 25;
  const [time, setTime] = useState(() => {
    try { return parseFloat(localStorage.getItem('matura-eng-hero:t') || '0') || 0; } catch { return 0; }
  });
  const [playing, setPlaying] = useState(true);
  const [hoverTime, setHoverTime] = useState(null);
  const [scale, setScale] = useState(1);

  const stageRef = useRef(null);
  const rafRef = useRef(null);
  const lastTsRef = useRef(null);

  useEffect(() => {
    try { localStorage.setItem('matura-eng-hero:t', String(time)); } catch {}
  }, [time]);

  useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 68;
      const s = Math.min(el.clientWidth / rest.width, (el.clientHeight - barH) / rest.height);
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, [rest.width, rest.height]);

  useEffect(() => {
    if (!playing) { lastTsRef.current = null; return; }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = ((ts - lastTsRef.current) / 1000) * speed;
      lastTsRef.current = ts;
      setTime(t => {
        let next = t + dt;
        if (next >= BASE_DURATION) next = next % BASE_DURATION;
        if (next < 0) next = 0;
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); lastTsRef.current = null; };
  }, [playing, speed, BASE_DURATION]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
      else if (e.code === 'ArrowLeft') setTime(t => Math.max(0, t - (e.shiftKey ? 1 : 0.1)));
      else if (e.code === 'ArrowRight') setTime(t => Math.min(BASE_DURATION, t + (e.shiftKey ? 1 : 0.1)));
      else if (e.key === '0' || e.code === 'Home') setTime(0);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [BASE_DURATION]);

  const displayTime = hoverTime != null ? hoverTime : time;
  const ctxValue = React.useMemo(() => ({
    time: displayTime, duration: BASE_DURATION, playing, setTime, setPlaying
  }), [displayTime, BASE_DURATION, playing]);

  return (
    <div ref={stageRef} style={{
      position: 'absolute', inset: 0,
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      background: '#0a0a0a',
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <div style={{
        flex: 1, width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden', minHeight: 0,
      }}>
        <div style={{
          width: rest.width, height: rest.height,
          background: rest.background || '#0a0a14',
          position: 'relative',
          transform: `scale(${scale})`,
          transformOrigin: 'center',
          flexShrink: 0,
          boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
          overflow: 'hidden',
          borderRadius: 8,
        }}>
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>
      <PlaybackBar
        time={displayTime}
        duration={BASE_DURATION}
        playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => setTime(0)}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

function App() {
  const { tweaks, editMode, update } = useTweakState();

  // Apply accent colors to the global C object (hacky but effective
  // since all scenes read from C directly)
  const accent = getAccentColors(tweaks.accent);
  useEffect(() => {
    window.C.blue = accent.blue;
    window.C.purple = accent.purple;
    window.C.orange = accent.orange;
  }, [accent.blue, accent.purple, accent.orange]);
  // Also update synchronously on first render so initial paint is correct
  window.C.blue = accent.blue;
  window.C.purple = accent.purple;
  window.C.orange = accent.orange;

  return (
    <>
      <SpeedStage
        width={1920}
        height={1080}
        duration={25}
        background="#0a0a14"
        speed={tweaks.speed}
      >
        <VideoRoot cta={tweaks.cta} accent={tweaks.accent} />
      </SpeedStage>

      {editMode && (
        <TweaksPanel
          tweaks={tweaks}
          onUpdate={update}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
