name: Discere CI

on:
  push:
    branches:
      - feat/discere-full-exam-coverage
  pull_request:
    paths:
      - 'app/discere/**'
      - 'components/discere/**'
      - 'content/discere/**'
      - 'lib/discere/**'
      - 'scripts/discere-validate.mjs'
      - '__tests__/discere/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/discere-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Build
        run: pnpm build
